<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dynamic Browser</title>
    <link rel="icon" href="Logo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --bg: #0c0c14;
            --surface: #161622;
            --surface-2: #1e1e2f;
            --surface-3: #282840;
            --accent: #7c4dff;
            --accent-2: #b388ff;
            --accent-glow: #7c4dff55;
            --cyan: #00e5ff;
            --cyan-glow: #00e5ff44;
            --text: #f0f0fa;
            --text-2: #c0c0d0;
            --text-3: #8888a0;
            --border: #ffffff0a;
            --border-2: #ffffff18;
            --radius-sm: 12px;
            --radius: 18px;
            --radius-lg: 28px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'Inter', system-ui, -apple-system, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            scroll-behavior: smooth;
            font-size: 16px;
            height: 100%;
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 20px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            line-height: 1.6;
            position: relative;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--accent) var(--surface-2);
        }

        body::-webkit-scrollbar {
            width: 6px;
        }

        body::-webkit-scrollbar-track {
            background: var(--surface-2);
            border-radius: 3px;
        }

        body::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 3px;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 20% 30%, rgba(124, 77, 255, 0.12) 0%, transparent 50%),
                        radial-gradient(circle at 80% 70%, rgba(0, 229, 255, 0.08) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            justify-content: center;
            min-height: 100%;
        }

        .platform-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            gap: 32px;
            flex: 1;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }
        .platform-screen.hidden {
            display: none;
        }
        .platform-title {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-3);
            text-align: center;
        }
        .platform-cards {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .platform-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 36px 28px;
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
            user-select: none;
            min-width: 170px;
            flex: 1 1 170px;
            max-width: 200px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }
        .platform-card:hover {
            border-color: var(--border-2);
            background: var(--surface-2);
            transform: translateY(-4px);
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.4);
        }
        .platform-card i {
            font-size: 2.8rem;
            color: #ffffffcc;
            margin-bottom: 16px;
            display: block;
            transition: color 0.3s;
        }
        .platform-card:hover i {
            color: var(--accent-2);
        }
        .platform-card span {
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: -0.01em;
        }

        .store-view {
            display: none;
            flex-direction: column;
            width: 100%;
            gap: 20px;
            transition: opacity 0.4s ease, transform 0.4s ease;
            max-height: 100vh;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--accent) var(--surface-2);
        }
        .store-view.visible {
            display: flex;
        }

        .back-btn {
            background: var(--surface);
            border: 1px solid var(--border-2);
            color: var(--text-2);
            border-radius: 50px;
            padding: 8px 18px;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
            align-self: flex-start;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
        }
        .back-btn:hover {
            background: var(--surface-2);
            color: #fff;
            border-color: var(--accent);
        }

        .app-header {
            display: flex;
            gap: 20px;
            align-items: center;
            background: var(--surface);
            border-radius: var(--radius);
            padding: 24px;
            border: 1px solid var(--border);
        }
        .app-icon {
            width: 88px;
            height: 88px;
            border-radius: 20px;
            object-fit: cover;
            background: var(--surface-3);
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }
        .app-info {
            flex: 1;
        }
        .app-name {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 4px;
            line-height: 1.2;
        }
        .app-short-desc {
            font-size: 0.95rem;
            color: var(--text-2);
            margin-bottom: 12px;
        }
        .download-area {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        .format-selector {
            display: flex;
            gap: 8px;
        }
        .format-chip {
            background: var(--surface-3);
            border: 2px solid transparent;
            border-radius: 40px;
            padding: 8px 16px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: var(--transition);
            color: var(--text-2);
            user-select: none;
        }
        .format-chip.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
            box-shadow: 0 0 14px var(--accent-glow);
        }
        .btn-install {
            background: linear-gradient(135deg, var(--accent), #9c7cff);
            color: #fff;
            border: none;
            border-radius: 40px;
            padding: 12px 28px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 8px 24px var(--accent-glow);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.02em;
        }
        .btn-install:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 32px var(--accent-glow);
            background: linear-gradient(135deg, #8c5dff, #af8cff);
        }
        .btn-install:active {
            transform: scale(0.97);
        }
        .install-meta {
            font-size: 0.75rem;
            color: rgba(255,255,255,0.85);
            margin-top: 2px;
            display: block;
            font-weight: 500;
        }

        .screenshots-section {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 20px;
            border: 1px solid var(--border);
        }
        .section-label {
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-3);
            margin-bottom: 14px;
        }
        .screenshots-scroll {
            display: flex;
            overflow-x: auto;
            gap: 12px;
            padding-bottom: 6px;
            scrollbar-width: thin;
            scrollbar-color: var(--accent) var(--surface-2);
        }
        .screenshots-scroll::-webkit-scrollbar {
            height: 5px;
        }
        .screenshots-scroll::-webkit-scrollbar-track {
            background: var(--surface-2);
            border-radius: 3px;
        }
        .screenshots-scroll::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 3px;
        }
        .screenshot-img {
            border-radius: 12px;
            max-height: 260px;
            flex-shrink: 0;
            box-shadow: 0 6px 18px rgba(0,0,0,0.5);
            border: 1px solid var(--border-2);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .screenshot-img:hover {
            transform: scale(1.03);
        }

        .description-card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 20px;
            border: 1px solid var(--border);
        }
        .description-text {
            font-size: 0.95rem;
            color: var(--text-2);
            line-height: 1.7;
        }

        .permissions-card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 20px;
            border: 1px solid var(--border);
        }
        .permission-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
            color: var(--text-2);
        }
        .permission-item:last-child {
            border-bottom: none;
        }
        .permission-item i {
            color: var(--accent-2);
            width: 18px;
            text-align: center;
        }

        .footer {
            text-align: center;
            padding: 20px 0 8px;
            color: var(--text-3);
            font-size: 0.75rem;
            border-top: 1px solid var(--border);
            margin-top: 8px;
        }
        .footer a {
            color: var(--accent-2);
            text-decoration: none;
            margin: 0 4px;
        }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(120px);
            background: var(--surface-2);
            border: 1px solid var(--border-2);
            border-radius: 40px;
            padding: 14px 28px;
            color: #fff;
            font-weight: 600;
            font-size: 0.9rem;
            z-index: 100;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .toast.visible {
            transform: translateX(-50%) translateY(0);
        }
        .toast i {
            color: #2ed573;
        }

        .modal-overlay {
            display: flex;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s;
        }
        .modal-overlay.modal--visible {
            opacity: 1;
            visibility: visible;
        }
        .modal-content {
            background: var(--surface);
            border: 1px solid var(--border-2);
            border-radius: var(--radius-lg);
            max-width: 650px;
            width: 90%;
            position: relative;
            overflow: hidden;
            box-shadow: 0 30px 50px rgba(0,0,0,0.7);
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }
        .modal-overlay.modal--visible .modal-content {
            transform: scale(1);
        }
        .modal-scroll {
            overflow-y: auto;
            max-height: 80vh;
            padding: 28px;
            scrollbar-width: thin;
            scrollbar-color: var(--accent) var(--surface-2);
        }
        .modal-close {
            position: absolute;
            top: 12px;
            right: 16px;
            background: none;
            border: none;
            color: var(--text-2);
            font-size: 1.8rem;
            cursor: pointer;
        }

        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .lightbox.visible {
            opacity: 1;
            visibility: visible;
        }
        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 2.5rem;
            color: #fff;
            cursor: pointer;
            z-index: 2001;
            background: none;
            border: none;
        }
        .lightbox-img {
            max-width: 90vw;
            max-height: 85vh;
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        @media (max-width: 640px) {
            body { padding: 16px; }
            .platform-cards { gap: 16px; }
            .platform-card { padding: 28px 16px; }
            .app-header { flex-direction: column; align-items: center; text-align: center; }
            .app-icon { width: 72px; height: 72px; }
            .download-area { justify-content: center; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="platform-screen" id="platformScreen">
        <h2 class="platform-title">Выберите вашу платформу</h2>
        <div class="platform-cards" id="platformCards">
            <div class="platform-card" data-os="Windows">
                <i class="fab fa-windows"></i>
                <span>Windows</span>
            </div>
            <div class="platform-card" data-os="Android">
                <i class="fab fa-android"></i>
                <span>Android</span>
            </div>
        </div>
    </div>

    <div class="store-view" id="storeView">
        <button class="back-btn" id="backBtn"><i class="fas fa-arrow-left"></i> Назад</button>

        <div class="app-header">
            <img src="Logo.png" alt="Dynamic Browser" class="app-icon" id="appIcon">
            <div class="app-info">
                <h1 class="app-name" id="appName">Dynamic Browser</h1>
                <p class="app-short-desc" id="appShortDesc"></p>
                <div class="download-area">
                    <div class="format-selector" id="formatSelector" style="display: none;">
                        <span class="format-chip active" data-format="exe">EXE</span>
                        <span class="format-chip" data-format="zip">ZIP</span>
                    </div>
                    <button class="btn-install" id="btnInstall">
                        <i class="fas fa-download"></i> Скачать
                        <span class="install-meta" id="installMeta"></span>
                    </button>
                </div>
            </div>
        </div>

        <div class="screenshots-section">
            <h3 class="section-label">Скриншоты</h3>
            <div class="screenshots-scroll" id="screenshotsContainer"></div>
        </div>

        <div class="description-card">
            <h3 class="section-label">Описание</h3>
            <p class="description-text" id="fullDesc"></p>
        </div>

        <div class="permissions-card">
            <h3 class="section-label">Права доступа</h3>
            <div id="permissionsList"></div>
        </div>

        <div class="footer">
            © 2026 Dynamic Browser.
            <a href="#" id="privacyLink">Политика конфиденциальности</a>
            <a href="https://github.com/Shon-Lua/Dynamic-Browser" target="_blank" rel="noopener noreferrer">GitHub</a>
        </div>
    </div>
</div>

<div class="toast" id="toast">
    <i class="fas fa-check-circle"></i>
    <span id="toastMessage"></span>
</div>

<div class="modal-overlay" id="privacyModal">
    <div class="modal-content">
        <button class="modal-close" id="modalClose">&times;</button>
        <div class="modal-scroll">
            <div class="modal-body" id="modalBody">Загрузка...</div>
        </div>
    </div>
</div>

<div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightboxClose">&times;</button>
    <img class="lightbox-img" id="lightboxImg" src="" alt="Скриншот">
</div>

<script>
    const state = {
        selectedOS: null,
        selectedFormat: 'exe'
    };

    const appData = {
        Windows: {
            title: 'Dynamic Browser для Windows',
            shortDesc: 'Быстрый, безопасный и современный браузер.',
            fullDesc: 'Dynamic Browser — это новый уровень веб-сёрфинга. Мгновенная загрузка страниц, встроенная защита от трекеров, удобное управление вкладками и поддержка всех современных веб-стандартов. Идеально подходит для работы, учёбы и развлечений.',
            formats: ['exe', 'zip'],
            sizes: { exe: '128 MB', zip: '142 MB' },
            defaultFormat: 'exe',
            permissions: ['Интернет-соединение', 'Доступ к файловой системе (при сохранении файлов)', 'Геолокация (по желанию)']
        },
        Android: {
            title: 'Dynamic Browser для Android',
            shortDesc: 'Лёгкий и энергоэффективный браузер.',
            fullDesc: 'Dynamic Browser для Android обеспечивает плавную работу даже на слабых устройствах. Экономия трафика, ночной режим, блокировка рекламы и синхронизация с облаком. Ваши закладки и пароли всегда под рукой.',
            formats: ['apk'],
            sizes: { apk: '95 MB' },
            defaultFormat: 'apk',
            permissions: ['Интернет-соединение', 'Доступ к хранилищу (для загрузок)', 'Геолокация (по желанию)', 'Управление уведомлениями']
        }
    };

    const platformScreen = document.getElementById('platformScreen');
    const storeView = document.getElementById('storeView');
    const formatSelector = document.getElementById('formatSelector');
    const appName = document.getElementById('appName');
    const appShortDesc = document.getElementById('appShortDesc');
    const fullDesc = document.getElementById('fullDesc');
    const permissionsList = document.getElementById('permissionsList');
    const installMeta = document.getElementById('installMeta');
    const screenshotsContainer = document.getElementById('screenshotsContainer');
    const platformCards = document.querySelectorAll('.platform-card');
    const backBtn = document.getElementById('backBtn');
    const btnInstall = document.getElementById('btnInstall');

    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    const lightboxClose = document.getElementById('lightboxClose');

    let currentInstruction = null;
    let isAnimating = false;

    async function safeFetchText(url) {
        try {
            const r = await fetch(url);
            return r.ok ? await r.text() : null;
        } catch { return null; }
    }

    async function safeFetchJson(url) {
        try {
            const r = await fetch(url);
            if (!r.ok) return null;
            return await r.json();
        } catch { return null; }
    }

    async function loadInstruction(os) {
        return await safeFetchJson(`${os}/instruction.json`);
    }

    async function loadDescription(base, descPath) {
        if (!descPath) return null;
        return await safeFetchText(`${base}/${descPath}`);
    }

    async function loadScreenshots(base, imagesObj) {
        const urls = [];
        if (!imagesObj || typeof imagesObj !== 'object') return urls;
        const keys = Object.keys(imagesObj).sort((a, b) => {
            const na = parseInt(a.match(/\d+/)?.[0] || 0);
            const nb = parseInt(b.match(/\d+/)?.[0] || 0);
            return na - nb;
        });
        for (const key of keys) {
            const src = `${base}/${imagesObj[key]}`;
            const loaded = await new Promise(resolve => {
                const img = new Image();
                img.onload = () => resolve(true);
                img.onerror = () => resolve(false);
                img.src = src;
            });
            if (loaded) urls.push(src);
        }
        return urls;
    }

    function renderScreenshots(images) {
        screenshotsContainer.innerHTML = '';
        if (!images.length) {
            screenshotsContainer.innerHTML = '<p style="color:var(--text-3); text-align:center; width:100%">Скриншоты не найдены</p>';
            return;
        }
        images.forEach(src => {
            const img = document.createElement('img');
            img.src = src;
            img.className = 'screenshot-img';
            img.alt = 'Скриншот';
            img.addEventListener('click', () => {
                lightboxImg.src = src;
                lightbox.classList.add('visible');
            });
            screenshotsContainer.appendChild(img);
        });
    }

    function closeLightbox() {
        lightbox.classList.remove('visible');
        lightboxImg.src = '';
    }

    lightboxClose.addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', (e) => {
        if (e.target === lightbox) closeLightbox();
    });
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && lightbox.classList.contains('visible')) {
            closeLightbox();
        }
    });

    function getAppVersion() {
        if (currentInstruction && currentInstruction.version) {
            return currentInstruction.version;
        }
        return '3.2.1';
    }

    function transitionToStore() {
        if (isAnimating) return;
        isAnimating = true;
        platformScreen.style.transition = 'opacity 0.4s ease, transform 0.4s ease';
        platformScreen.style.opacity = '0';
        platformScreen.style.transform = 'translateY(-20px)';
        setTimeout(() => {
            platformScreen.style.display = 'none';
            platformScreen.classList.add('hidden');
            storeView.style.display = 'flex';
            storeView.style.opacity = '0';
            storeView.style.transform = 'translateY(20px)';
            storeView.style.transition = 'none';
            void storeView.offsetHeight;
            storeView.style.transition = 'opacity 0.4s ease, transform 0.4s ease';
            storeView.style.opacity = '1';
            storeView.style.transform = 'translateY(0)';
            storeView.classList.add('visible');
            isAnimating = false;
        }, 400);
    }

    function transitionToPlatform() {
        if (isAnimating) return;
        isAnimating = true;
        storeView.style.transition = 'opacity 0.4s ease, transform 0.4s ease';
        storeView.style.opacity = '0';
        storeView.style.transform = 'translateY(20px)';
        setTimeout(() => {
            storeView.style.display = 'none';
            storeView.classList.remove('visible');
            platformScreen.style.display = 'flex';
            platformScreen.style.opacity = '0';
            platformScreen.style.transform = 'translateY(-20px)';
            platformScreen.style.transition = 'none';
            void platformScreen.offsetHeight;
            platformScreen.style.transition = 'opacity 0.4s ease, transform 0.4s ease';
            platformScreen.style.opacity = '1';
            platformScreen.style.transform = 'translateY(0)';
            platformScreen.classList.remove('hidden');
            isAnimating = false;
        }, 400);
    }

    async function updateUI() {
        if (!state.selectedOS) {
            if (!platformScreen.classList.contains('hidden')) return;
            transitionToPlatform();
            return;
        }

        const osData = appData[state.selectedOS];
        appName.textContent = osData.title;
        appShortDesc.textContent = osData.shortDesc;

        currentInstruction = await loadInstruction(state.selectedOS);
        let desc = osData.fullDesc;
        if (currentInstruction?.desc) {
            const fetched = await loadDescription(state.selectedOS, currentInstruction.desc);
            if (fetched) desc = fetched;
        }
        fullDesc.textContent = desc;

        permissionsList.innerHTML = osData.permissions.map(p =>
            `<div class="permission-item"><i class="fas fa-check-circle"></i>${p}</div>`
        ).join('');

        const version = getAppVersion();

        if (state.selectedOS === 'Windows') {
            formatSelector.style.display = 'flex';
            document.querySelectorAll('.format-chip').forEach(c => c.classList.remove('active'));
            const activeChip = document.querySelector(`.format-chip[data-format="${state.selectedFormat}"]`);
            if (activeChip) activeChip.classList.add('active');
            installMeta.textContent = `v${version} · ${osData.sizes[state.selectedFormat]}`;
        } else {
            formatSelector.style.display = 'none';
            state.selectedFormat = 'apk';
            installMeta.textContent = `v${version} · ${osData.sizes.apk}`;
        }

        let imagesObj = currentInstruction?.Images || null;
        const screenshots = await loadScreenshots(state.selectedOS, imagesObj);
        renderScreenshots(screenshots);

        if (platformScreen.classList.contains('hidden')) return;
        transitionToStore();
    }

    platformCards.forEach(card => {
        card.addEventListener('click', () => {
            const os = card.dataset.os;
            if (state.selectedOS === os) return;
            state.selectedOS = os;
            state.selectedFormat = appData[os].defaultFormat;
            updateUI();
        });
    });

    backBtn.addEventListener('click', () => {
        state.selectedOS = null;
        currentInstruction = null;
        updateUI();
    });

    formatSelector.addEventListener('click', e => {
        if (state.selectedOS !== 'Windows') return;
        const chip = e.target.closest('.format-chip');
        if (!chip) return;
        state.selectedFormat = chip.dataset.format;
        updateUI();
    });

    btnInstall.addEventListener('click', () => {
        if (!state.selectedOS) return;
        const osData = appData[state.selectedOS];
        const size = osData.sizes[state.selectedFormat];
        const version = getAppVersion();
        let fileName;
        if (currentInstruction?.app) {
            if (state.selectedOS === 'Windows') {
                fileName = state.selectedFormat === 'exe' ? currentInstruction.exe : currentInstruction.zip;
            } else {
                fileName = currentInstruction.app;
            }
        }
        if (!fileName) {
            fileName = state.selectedOS === 'Windows'
                ? (state.selectedFormat === 'exe' ? `dynamic-browser-setup-${version}.exe` : `dynamic-browser-portable-${version}.zip`)
                : `dynamic-browser-${version}.apk`;
        }
        const link = `https://dynamicbrowser.app/dl/${fileName}`;
        showToast(`Загрузка ${fileName} (${size}) началась!`);
        const a = document.createElement('a');
        a.href = link;
        a.download = fileName;
        a.style.display = 'none';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    });

    function showToast(msg) {
        const toast = document.getElementById('toast');
        document.getElementById('toastMessage').textContent = msg;
        toast.classList.add('visible');
        clearTimeout(toast._timeout);
        toast._timeout = setTimeout(() => toast.classList.remove('visible'), 3000);
    }

    document.addEventListener('keydown', e => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
            e.preventDefault();
            btnInstall.click();
        }
    });

    const privacyLink = document.getElementById('privacyLink');
    const privacyModal = document.getElementById('privacyModal');
    const modalClose = document.getElementById('modalClose');
    const modalBody = document.getElementById('modalBody');

    function loadPrivacy() {
        fetch('POLITICS.txt')
            .then(r => r.ok ? r.text() : Promise.reject())
            .then(t => {
                const ps = t.split('\n\n').filter(p => p.trim());
                modalBody.innerHTML = ps.map(p => `<p>${p.replace(/\n/g, '<br>')}</p>`).join('');
            })
            .catch(() => modalBody.innerHTML = '<p>Не удалось загрузить политику.</p>');
    }
    loadPrivacy();

    privacyLink.addEventListener('click', e => {
        e.preventDefault();
        privacyModal.classList.add('modal--visible');
    });
    modalClose.addEventListener('click', () => privacyModal.classList.remove('modal--visible'));
    privacyModal.addEventListener('click', e => { if (e.target === privacyModal) privacyModal.classList.remove('modal--visible'); });
    document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && privacyModal.classList.contains('modal--visible'))
            privacyModal.classList.remove('modal--visible');
    });

    updateUI();
</script>
</body>
</html>
