<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Dynamic Browser | Ultimate Installer</title>
    <link rel="icon" href="Logo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-deep: #000000;
            --glass-base: rgba(0, 0, 0, 0.6);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-border-hover: rgba(255, 255, 255, 0.25);
            --text-white: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.7);
            --text-faint: rgba(255, 255, 255, 0.4);
            --radius-xl: 32px;
            --radius-md: 24px;
            --shadow-premium: 0 25px 40px -15px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.05);
            --ease-spring: cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg-deep);
            color: var(--text-white);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        canvas#webgl-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 0;
            pointer-events: none;
            will-change: transform;
        }

        .installer-core {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
        }

        /* выбор платформы */
        .platform-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 70vh;
            gap: 48px;
            transition: opacity 0.5s var(--ease-spring), transform 0.5s var(--ease-spring);
        }

        .platform-panel.hidden {
            display: none;
        }

        .brand-logo {
            text-align: center;
        }

        .brand-logo i {
            font-size: 3rem;
            background: linear-gradient(135deg, #fff, #aaa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 14px;
            display: inline-block;
        }

        .brand-logo span {
            font-weight: 600;
            letter-spacing: 0.2em;
            font-size: 0.8rem;
            color: var(--text-faint);
            text-transform: uppercase;
        }

        .platform-options {
            display: flex;
            gap: 36px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .platform-tile {
            background: var(--glass-base);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 60px;
            padding: 28px 44px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            transition: all 0.4s var(--ease-spring);
            min-width: 200px;
            box-shadow: var(--shadow-premium);
        }

        .platform-tile i {
            font-size: 3rem;
            transition: transform 0.2s;
        }

        .platform-tile span {
            font-weight: 700;
            font-size: 1.4rem;
            letter-spacing: -0.01em;
        }

        .platform-tile:hover {
            transform: translateY(-8px);
            border-color: var(--glass-border-hover);
            background: rgba(0, 0, 0, 0.8);
            box-shadow: 0 32px 48px -18px black, 0 0 0 1px rgba(255, 255, 255, 0.2);
        }

        /* детальный экран */
        .product-view {
            display: none;
            flex-direction: column;
            gap: 28px;
            animation: fadeUp 0.6s var(--ease-spring);
        }

        .product-view.visible {
            display: flex;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(32px);
                filter: blur(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        .back-action {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
            width: fit-content;
            border-radius: 80px;
            padding: 8px 24px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
            border: 1px solid var(--glass-border);
            cursor: pointer;
            transition: 0.25s;
        }

        .back-action:hover {
            background: rgba(0, 0, 0, 0.8);
            border-color: var(--glass-border-hover);
            transform: translateX(-6px);
        }

        .hero-card {
            background: var(--glass-base);
            backdrop-filter: blur(24px);
            border-radius: var(--radius-xl);
            padding: 32px;
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-premium);
            display: flex;
            gap: 32px;
            flex-wrap: wrap;
        }

        .app-icon {
            width: 120px;
            height: 120px;
            border-radius: 30px;
            object-fit: cover;
            background: #0a0a0a;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.5);
        }

        .app-info {
            flex: 1;
        }

        .app-name {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #ffffff, #bcbcbc);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 6px;
        }

        .app-description {
            font-size: 1rem;
            color: var(--text-dim);
            margin-bottom: 24px;
        }

        .install-zone {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 20px;
            margin-bottom: 16px;
        }

        .format-tabs {
            display: flex;
            gap: 10px;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px;
            border-radius: 100px;
        }

        .format-tab {
            background: transparent;
            border: none;
            padding: 8px 24px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-dim);
            cursor: pointer;
            transition: 0.2s;
        }

        .format-tab.active {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.2);
        }

        .btn-install {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.05));
            border: 1px solid rgba(255, 255, 255, 0.55);
            border-radius: 80px;
            padding: 12px 36px;
            font-weight: 800;
            font-size: 1rem;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-install:hover {
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.3);
            border-color: white;
            box-shadow: 0 18px 28px -12px black;
        }

        .version-tag {
            background: rgba(0, 0, 0, 0.6);
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: 500;
            margin-left: 8px;
        }

        .file-row {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: rgba(0, 0, 0, 0.5);
            padding: 6px 20px;
            border-radius: 60px;
            font-size: 0.8rem;
            margin-top: 10px;
        }

        .file-toggle {
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 0.7rem;
            cursor: pointer;
            text-decoration: underline;
        }

        .file-expand {
            display: none;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 24px;
            padding: 10px 16px;
            font-size: 0.75rem;
            word-break: break-all;
            margin-top: 8px;
        }

        /* универсальные карточки */
        .info-block {
            background: var(--glass-base);
            backdrop-filter: blur(18px);
            border-radius: var(--radius-md);
            padding: 22px 26px;
            border: 1px solid var(--glass-border);
        }

        .block-title {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--text-faint);
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .screenshot-scroll {
            display: flex;
            overflow-x: auto;
            gap: 16px;
            padding-bottom: 8px;
            scrollbar-width: thin;
        }

        .screenshot-scroll img {
            height: 200px;
            border-radius: 20px;
            flex-shrink: 0;
            border: 1px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: 0.2s;
        }

        .screenshot-scroll img:hover {
            transform: scale(1.02);
            border-color: white;
        }

        .desc-collapse {
            overflow: hidden;
            transition: max-height 0.45s var(--ease-spring);
        }

        .desc-content {
            color: var(--text-dim);
            line-height: 1.65;
            font-size: 0.95rem;
        }

        .expand-trigger {
            background: none;
            border: none;
            color: white;
            font-weight: 600;
            font-size: 0.8rem;
            margin-top: 12px;
            cursor: pointer;
            opacity: 0.7;
        }

        .perm-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .perm-item {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.9rem;
            color: var(--text-dim);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding: 8px 0;
        }

        .footer-links {
            text-align: center;
            padding: 20px 0 10px;
            font-size: 0.7rem;
            color: var(--text-faint);
        }

        .footer-links a {
            color: white;
            margin: 0 8px;
            text-decoration: none;
        }

        .toast-notify {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%) translateY(90px);
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(28px);
            padding: 12px 28px;
            border-radius: 80px;
            display: flex;
            gap: 12px;
            align-items: center;
            font-weight: 600;
            z-index: 300;
            transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .toast-notify.visible {
            transform: translateX(-50%) translateY(0);
        }

        .modal-overlay, .lightbox-layer {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(28px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: 0.3s;
        }

        .modal-overlay.visible, .lightbox-layer.visible {
            opacity: 1;
            visibility: visible;
        }

        .modal-card {
            background: rgba(0, 0, 0, 0.96);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 48px;
            max-width: 540px;
            width: 90%;
            padding: 32px;
            position: relative;
            transform: scale(0.95);
            transition: transform 0.3s;
        }

        .modal-overlay.visible .modal-card {
            transform: scale(1);
        }

        .lightbox-img {
            max-width: 90vw;
            max-height: 85vh;
            border-radius: 32px;
            box-shadow: 0 30px 50px black;
        }

        .close-icon {
            position: absolute;
            top: 20px;
            right: 28px;
            font-size: 32px;
            background: none;
            border: none;
            color: white;
            cursor: pointer;
        }

        @media (max-width: 680px) {
            .hero-card { flex-direction: column; align-items: center; text-align: center; }
            .install-zone { justify-content: center; }
            .app-name { font-size: 1.7rem; }
            .platform-tile { padding: 20px 32px; min-width: 140px; }
            .screenshot-scroll img { height: 140px; }
        }
    </style>
</head>

<canvas id="webgl-canvas"></canvas>
<div class="installer-core">

</div>

<script type="module">
import * as THREE from 'three';

let scene, camera, renderer, waveMesh, particleStars, waveGeometry, timeVal = 0, animFrame = null, glLost = false;
const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
let performanceMode = false;

const canvasEl = document.getElementById('webgl-canvas');

function initWebGL() {
    if (renderer) {
        if (animFrame) cancelAnimationFrame(animFrame);
        if (renderer.domElement?.parentNode) renderer.domElement.remove();
    }
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);
    scene.fog = new THREE.FogExp2(0x000000, 0.006);

    const aspect = window.innerWidth / window.innerHeight;
    camera = new THREE.PerspectiveCamera(44, aspect, 0.1, 1000);
    camera.position.set(9.5, 6, 11.5);
    camera.lookAt(0, 0.2, 0);

    renderer = new THREE.WebGLRenderer({ canvas: canvasEl, alpha: false, antialias: !isMobile, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, isMobile ? 1.2 : 2));

    canvasEl.addEventListener('webglcontextlost', (e) => { e.preventDefault(); glLost = true; if (animFrame) cancelAnimationFrame(animFrame); animFrame = null; });
    canvasEl.addEventListener('webglcontextrestored', () => { glLost = false; initWebGL(); });

    let segments = isMobile ? 22 : 34;
    if (performanceMode) segments = 18;
    const width = 16, height = 16;
    waveGeometry = new THREE.PlaneGeometry(width, height, segments, segments);
    waveGeometry.rotateX(-Math.PI / 2);
    const posAttr = waveGeometry.attributes.position.array;
    for (let i = 0; i < posAttr.length / 3; i++) posAttr[i*3+1] = 0;

    waveMesh = new THREE.Mesh(waveGeometry, new THREE.MeshStandardMaterial({ color: 0xffffff, wireframe: true, emissive: 0x111111, roughness: 0.55, metalness: 0.65 }));
    scene.add(waveMesh);

    const ambientLight = new THREE.AmbientLight(0x222222);
    scene.add(ambientLight);
    const mainLight = new THREE.DirectionalLight(0xffffff, 1.0);
    mainLight.position.set(4, 7, 5);
    scene.add(mainLight);
    const fillLight = new THREE.PointLight(0x666666, 0.4);
    fillLight.position.set(-2, 3, -3);
    scene.add(fillLight);

    const gridHelper = new THREE.GridHelper(22, 18, 0xffffff, 0x3a3a3a);
    gridHelper.position.y = -1.8;
    gridHelper.material.transparent = true;
    gridHelper.material.opacity = 0.12;
    scene.add(gridHelper);

    const starCount = isMobile ? 280 : 520;
    const starGeometry = new THREE.BufferGeometry();
    const starPositions = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount; i++) {
        starPositions[i*3] = (Math.random() - 0.5) * 210;
        starPositions[i*3+1] = (Math.random() - 0.5) * 55;
        starPositions[i*3+2] = (Math.random() - 0.5) * 85 - 35;
    }
    starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    particleStars = new THREE.Points(starGeometry, new THREE.PointsMaterial({ color: 0xffffff, size: isMobile ? 0.055 : 0.075, transparent: true, opacity: 0.55 }));
    scene.add(particleStars);

    animateGL();
}

function animateWavefield() {
    if (!waveGeometry || glLost) return;
    timeVal += 0.016;
    const positions = waveGeometry.attributes.position.array;
    const seg = isMobile ? 22 : 34;
    const size = 16;
    for (let i = 0; i <= seg; i++) {
        const x = (i / seg - 0.5) * size;
        for (let j = 0; j <= seg; j++) {
            const z = (j / seg - 0.5) * size;
            const idx = (j * (seg + 1) + i) * 3;
            const y1 = Math.sin(x * 0.8 + timeVal) * Math.cos(z * 0.7 + timeVal * 0.6) * 0.48;
            const y2 = Math.sin(x * 1.4 - timeVal * 1.0) * 0.24;
            const y3 = Math.cos(z * 1.3 + timeVal * 0.75) * 0.24;
            const y4 = Math.sin((x * 1.1 + z * 1.1) * 0.65 + timeVal * 1.2) * 0.18;
            positions[idx + 1] = y1 + y2 + y3 + y4;
        }
    }
    waveGeometry.attributes.position.needsUpdate = true;
    waveGeometry.computeVertexNormals();
}

function animateGL() {
    if (!glLost) {
        animateWavefield();
        if (particleStars) {
            particleStars.rotation.y += 0.0003;
            particleStars.rotation.x += 0.0002;
        }
        if (camera) camera.lookAt(0, 0.2, 0);
        if (renderer && scene && camera) renderer.render(scene, camera);
    }
    animFrame = requestAnimationFrame(animateGL);
}

window.addEventListener('resize', () => {
    if (camera) { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); }
    if (renderer) renderer.setSize(window.innerWidth, window.innerHeight);
});
document.addEventListener('visibilitychange', () => {
    if (document.hidden) { if (animFrame) cancelAnimationFrame(animFrame); animFrame = null; }
    else if (!animFrame && !glLost) animateGL();
});

try { initWebGL(); } catch(e) { performanceMode = true; initWebGL(); }

const store = {
    Windows: { title: 'Dynamic Browser for Windows', short: 'Молниеносная скорость и полная приватность.', fullDesc: 'Новейший браузер с нулевым слежением, встроенным VPN, блокировкой рекламы и энергоэффективным движком. Настраиваемый интерфейс, поддержка расширений и тем. Обновляется автоматически.', formats: ['exe','zip'], sizes: { exe: '48.2 MB', zip: '32.5 MB' }, defaultFormat: 'exe', permissions: ['Доступ в интернет', 'Чтение/запись файлов', 'Геолокация (опционально)'] },
    Android: { title: 'Dynamic Browser for Android', short: 'Лёгкий, безопасный, современный.', fullDesc: 'Мобильный браузер с оптимизацией трафика, ночной темой, встроенным менеджером загрузок и защитой от фишинга. Занимает минимум памяти, работает плавно.', formats: ['apk'], sizes: { apk: '28.3 MB' }, defaultFormat: 'apk', permissions: ['Интернет', 'Хранилище', 'Геопозиция', 'Уведомления'] }
};

let selectedOS = null, selectedFormat = 'exe', instructionCache = null, currentFileName = '', currentFileSize = '', lastDesc = '';
const platformPanel = document.getElementById('platformPanel'), productView = document.getElementById('productView');
const appNameSpan = document.getElementById('appName'), appDescSpan = document.getElementById('appDesc'), descContent = document.getElementById('descContent'), permContainer = document.getElementById('permContainer');
const formatTabs = document.getElementById('formatTabs'), installBtn = document.getElementById('installButton'), versionLabel = document.getElementById('versionLabel');
const fileRow = document.getElementById('fileRow'), fileNameShortSpan = document.getElementById('fileNameShort'), fileToggleBtn = document.getElementById('fileToggleBtn'), fileExpandBlock = document.getElementById('fileExpandBlock');
const screenshotStrip = document.getElementById('screenshotStrip'), descCollapse = document.getElementById('descCollapse'), expandDescBtn = document.getElementById('expandDesc');
const backButton = document.getElementById('backButton'), toastMsg = document.getElementById('toastMsg'), toastText = document.getElementById('toastText');
const privacyModal = document.getElementById('privacyModal'), privacyContentDiv = document.getElementById('privacyContent'), privacyLink = document.getElementById('privacyLink'), closeModalBtn = document.getElementById('closeModalBtn');
const lightboxLayer = document.getElementById('lightboxLayer'), lightboxImage = document.getElementById('lightboxImage'), closeLightboxBtn = document.getElementById('closeLightboxBtn');

function showToastMessage(msg) { toastText.innerText = msg; toastMsg.classList.add('visible'); clearTimeout(window._to); window._to = setTimeout(() => toastMsg.classList.remove('visible'), 2800); }
function truncNameLong(str, max=36) { return str.length <= max ? str : str.slice(0,max)+'…'; }
function updateFileSection() { if (!currentFileName) { fileRow.style.display = 'none'; return; } fileRow.style.display = 'flex'; fileNameShortSpan.innerText = truncNameLong(currentFileName); fileExpandBlock.innerText = `${currentFileName} (${currentFileSize})`; if (currentFileName.length <= 36) fileToggleBtn.style.display = 'none'; else { fileToggleBtn.style.display = 'inline-block'; fileExpandBlock.classList.remove('visible'); } }
fileToggleBtn.addEventListener('click', () => { if (fileExpandBlock.classList.contains('visible')) { fileExpandBlock.classList.remove('visible'); fileToggleBtn.innerText = 'подробнее'; } else { fileExpandBlock.classList.add('visible'); fileToggleBtn.innerText = 'свернуть'; } });
function resetDescStyle() { descCollapse.style.maxHeight = 'none'; expandDescBtn.style.display = 'none'; expandDescBtn.innerText = 'Развернуть'; expandDescBtn.dataset.exp = 'false'; }
function setupDescription() { if (descContent.innerText === lastDesc) return; lastDesc = descContent.innerText; resetDescStyle(); requestAnimationFrame(() => { const lh = parseFloat(getComputedStyle(descContent).lineHeight); if (!lh) return; const limit = lh * 5; if (descContent.scrollHeight > limit + 2) { descCollapse.style.maxHeight = limit + 'px'; expandDescBtn.style.display = 'inline-block'; expandDescBtn.dataset.exp = 'false'; expandDescBtn.innerText = 'Развернуть'; } else { descCollapse.style.maxHeight = 'none'; expandDescBtn.style.display = 'none'; } }); }
expandDescBtn.addEventListener('click', () => { const expanded = expandDescBtn.dataset.exp === 'true'; const lh = parseFloat(getComputedStyle(descContent).lineHeight); if (expanded) { descCollapse.style.maxHeight = (lh * 5) + 'px'; expandDescBtn.innerText = 'Развернуть'; expandDescBtn.dataset.exp = 'false'; } else { descCollapse.style.maxHeight = descContent.scrollHeight + 'px'; expandDescBtn.innerText = 'Свернуть'; expandDescBtn.dataset.exp = 'true'; } });
async function fetchJSON(url) { try { const r = await fetch(url); return r.ok ? await r.json() : null; } catch { return null; } }
async function fetchTextFile(url) { try { const r = await fetch(url); return r.ok ? await r.text() : null; } catch { return null; } }
async function loadInstruction(os) { return await fetchJSON(`${os}/instruction.json`); }
async function loadScreenshotArray(base, imagesMap) { if (!imagesMap) return []; const urls = []; for (const key of Object.keys(imagesMap).sort((a,b)=> (parseInt(a.match(/\d+/)?.[0]||0) - parseInt(b.match(/\d+/)?.[0]||0)))) { const src = `${base}/${imagesMap[key]}`; const imgTest = new Image(); await new Promise(res => { imgTest.onload = () => res(true); imgTest.onerror = () => res(false); imgTest.src = src; }); if (imgTest.complete && imgTest.naturalWidth) urls.push(src); } return urls; }
function renderScreenshots(images) { screenshotStrip.innerHTML = images.length ? images.map(src => `<img src="${src}" class="screenshot-item" loading="lazy">`).join('') : '<div style="color:rgba(255,255,255,0.4); padding:12px;">Скриншоты отсутствуют</div>'; document.querySelectorAll('.screenshot-item').forEach(img => img.addEventListener('click', () => { lightboxImage.src = img.src; lightboxLayer.classList.add('visible'); })); }
async function refreshUI() {
    if (!selectedOS) { if (!platformPanel.classList.contains('hidden')) return; productView.classList.remove('visible'); platformPanel.classList.remove('hidden'); platformPanel.style.opacity = '1'; platformPanel.style.transform = 'none'; return; }
    const osData = store[selectedOS];
    appNameSpan.innerText = osData.title; appDescSpan.innerText = osData.short;
    instructionCache = await loadInstruction(selectedOS);
    let desc = osData.fullDesc;
    if (instructionCache?.desc) { const fetched = await fetchTextFile(`${selectedOS}/${instructionCache.desc}`); if (fetched) desc = fetched; }
    descContent.innerText = desc;
    permContainer.innerHTML = osData.permissions.map(p => `<div class="perm-item"><i class="fas fa-lock"></i> ${p}</div>`).join('');
    const version = instructionCache?.version || '3.2.1';
    let fname = '';
    if (instructionCache?.app) { if (selectedOS === 'Windows') fname = selectedFormat === 'exe' ? instructionCache.exe : instructionCache.zip; else fname = instructionCache.app; }
    if (!fname) fname = selectedOS === 'Windows' ? (selectedFormat === 'exe' ? `dynamic-browser-setup-${version}.exe` : `dynamic-browser-portable-${version}.zip`) : `dynamic-browser-${version}.apk`;
    const fsize = osData.sizes[selectedFormat] || '';
    currentFileName = fname; currentFileSize = fsize;
    if (selectedOS === 'Windows') { formatTabs.style.display = 'flex'; document.querySelectorAll('.format-tab').forEach(tab => tab.classList.remove('active')); const activeTab = document.querySelector(`.format-tab[data-format="${selectedFormat}"]`); if (activeTab) activeTab.classList.add('active'); versionLabel.innerText = `v${version} · ${osData.sizes[selectedFormat]}`; } else { formatTabs.style.display = 'none'; selectedFormat = 'apk'; versionLabel.innerText = `v${version} · ${osData.sizes.apk}`; }
    updateFileSection();
    const screens = await loadScreenshotArray(selectedOS, instructionCache?.Images || null);
    renderScreenshots(screens);
    setupDescription();
    if (!platformPanel.classList.contains('hidden')) {
        platformPanel.style.transition = 'opacity 0.5s ease, transform 0.5s';
        platformPanel.style.opacity = '0'; platformPanel.style.transform = 'scale(0.97) translateY(-12px)';
        setTimeout(() => { platformPanel.classList.add('hidden'); productView.classList.add('visible'); productView.style.animation = 'none'; productView.offsetHeight; productView.style.animation = 'fadeUp 0.6s ease'; }, 480);
    }
}
document.querySelectorAll('.platform-tile').forEach(tile => { tile.addEventListener('click', () => { const os = tile.dataset.os; if (selectedOS === os) return; selectedOS = os; selectedFormat = store[os].defaultFormat; refreshUI(); }); });
backButton.addEventListener('click', () => { productView.style.transition = 'opacity 0.4s, transform 0.4s'; productView.style.opacity = '0'; productView.style.transform = 'translateY(20px)'; setTimeout(() => { productView.classList.remove('visible'); productView.style.opacity = ''; productView.style.transform = ''; platformPanel.classList.remove('hidden'); platformPanel.style.opacity = '0'; platformPanel.style.transform = 'translateY(-12px)'; platformPanel.style.transition = 'none'; platformPanel.offsetHeight; platformPanel.style.transition = 'opacity 0.5s ease, transform 0.5s'; platformPanel.style.opacity = '1'; platformPanel.style.transform = 'none'; selectedOS = null; }, 400); });
formatTabs.addEventListener('click', (e) => { if (selectedOS !== 'Windows') return; const btn = e.target.closest('.format-tab'); if (btn && btn.dataset.format) { selectedFormat = btn.dataset.format; refreshUI(); } });
installBtn.addEventListener('click', () => { if (!selectedOS || !currentFileName) return; showToastMessage(`Загрузка ${currentFileName} (${currentFileSize})`); const a = document.createElement('a'); a.href = `https://dynamicbrowser.app/dl/${currentFileName}`; a.download = currentFileName; a.style.display = 'none'; document.body.appendChild(a); a.click(); document.body.removeChild(a); });
privacyLink.addEventListener('click', (e) => { e.preventDefault(); fetch('POLITICS.txt').then(r => r.ok ? r.text() : Promise.reject()).then(txt => { const blocks = txt.split('\n\n').filter(b => b.trim()); privacyContentDiv.innerHTML = blocks.map(block => `<p style="margin-bottom:14px;">${block.replace(/\n/g, '<br>')}</p>`).join(''); }).catch(() => privacyContentDiv.innerHTML = '<p>Политика конфиденциальности временно недоступна.</p>'); privacyModal.classList.add('visible'); });
closeModalBtn.addEventListener('click', () => privacyModal.classList.remove('visible')); privacyModal.addEventListener('click', (e) => { if (e.target === privacyModal) privacyModal.classList.remove('visible'); });
closeLightboxBtn.addEventListener('click', () => { lightboxLayer.classList.remove('visible'); lightboxImage.src = ''; }); lightboxLayer.addEventListener('click', (e) => { if (e.target === lightboxLayer) { lightboxLayer.classList.remove('visible'); lightboxImage.src = ''; } });
refreshUI();
</script>
</body>
</html>
