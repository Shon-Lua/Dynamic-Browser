<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Dynamic Browser | Premium Installer</title>
    <link rel="icon" href="Logo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        :root {
            --bg: #000000;
            --surface: rgba(0, 0, 0, 0.6);
            --surface-hover: rgba(0, 0, 0, 0.8);
            --border-light: rgba(255, 255, 255, 0.08);
            --border-glow: rgba(255, 255, 255, 0.25);
            --accent: #ffffff;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --text-tertiary: rgba(255, 255, 255, 0.4);
            --radius-card: 28px;
            --radius-element: 60px;
            --transition: 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            --shadow-premium: 0 20px 35px -12px rgba(0,0,0,0.9), 0 0 0 1px rgba(255,255,255,0.03);
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
            overflow-x: hidden;
        }
        canvas#bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            opacity: 0.9;
        }
        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
        }
        .screen {
            transition: opacity 0.6s var(--transition), transform 0.6s var(--transition);
        }
        .screen-hidden {
            display: none;
        }
        .platform-selector {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 70vh;
            gap: 48px;
        }
        .brand {
            text-align: center;
        }
        .brand-icon {
            font-size: 3.2rem;
            background: linear-gradient(135deg, #fff, #aaa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 16px;
        }
        .brand-icon i {
            font-size: 3rem;
            background: none;
            -webkit-background-clip: unset;
            background-clip: unset;
            color: white;
        }
        .brand h1 {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.02em;
        }
        .options {
            display: flex;
            gap: 32px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .platform-card {
            background: var(--surface);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-card);
            padding: 28px 44px;
            text-align: center;
            cursor: pointer;
            transition: all var(--transition);
            min-width: 200px;
            box-shadow: var(--shadow-premium);
        }
        .platform-card i {
            font-size: 3rem;
            margin-bottom: 16px;
            display: block;
        }
        .platform-card span {
            font-weight: 700;
            font-size: 1.3rem;
        }
        .platform-card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: var(--border-glow);
            background: var(--surface-hover);
            box-shadow: 0 30px 40px -20px black, 0 0 0 1px rgba(255,255,255,0.15);
        }
        .store-interface {
            display: flex;
            flex-direction: column;
            gap: 28px;
            animation: fadeUp 0.7s var(--transition);
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); filter: blur(8px);}
            to { opacity: 1; transform: translateY(0); filter: blur(0);}
        }
        .back-action {
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(12px);
            width: fit-content;
            border-radius: var(--radius-element);
            padding: 10px 28px;
            font-weight: 500;
            border: 1px solid var(--border-light);
            cursor: pointer;
            transition: all 0.25s;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
        }
        .back-action:hover {
            background: rgba(0,0,0,0.8);
            border-color: var(--border-glow);
            transform: translateX(-6px);
        }
        .hero-panel {
            display: flex;
            gap: 32px;
            background: var(--surface);
            backdrop-filter: blur(24px);
            border-radius: var(--radius-card);
            padding: 32px;
            border: 1px solid var(--border-light);
            flex-wrap: wrap;
            box-shadow: var(--shadow-premium);
        }
        .app-icon {
            width: 110px;
            height: 110px;
            border-radius: 28px;
            object-fit: cover;
            border: 1px solid rgba(255,255,255,0.2);
            background: #0a0a0a;
            box-shadow: 0 12px 24px rgba(0,0,0,0.5);
        }
        .app-details {
            flex: 1;
        }
        .app-name {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #fff, #c0c0c0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 6px;
        }
        .app-tagline {
            color: var(--text-secondary);
            margin-bottom: 24px;
            font-size: 0.95rem;
        }
        .download-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 20px;
            margin-bottom: 16px;
        }
        .format-switch {
            display: flex;
            gap: 12px;
            background: rgba(0,0,0,0.5);
            padding: 5px;
            border-radius: 100px;
        }
        .format-btn {
            background: transparent;
            border: none;
            padding: 8px 22px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: 0.2s;
        }
        .format-btn.active {
            background: rgba(255,255,255,0.2);
            color: white;
            box-shadow: 0 0 8px rgba(255,255,255,0.2);
        }
        .btn-download {
            background: linear-gradient(145deg, rgba(255,255,255,0.18), rgba(255,255,255,0.05));
            border: 1px solid rgba(255,255,255,0.5);
            padding: 14px 36px;
            border-radius: 60px;
            font-weight: 800;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: 0.3s;
            backdrop-filter: blur(8px);
        }
        .btn-download:hover {
            transform: translateY(-3px);
            background: rgba(255,255,255,0.28);
            border-color: white;
            box-shadow: 0 15px 25px -10px black;
        }
        .version-chip {
            background: rgba(0,0,0,0.6);
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 500;
        }
        .file-info {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            background: rgba(0,0,0,0.5);
            border-radius: 60px;
            padding: 6px 20px;
            margin-top: 10px;
            font-size: 0.8rem;
        }
        .file-toggle {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 0.7rem;
            text-decoration: underline;
            cursor: pointer;
        }
        .file-detail-panel {
            display: none;
            background: rgba(0,0,0,0.7);
            border-radius: 24px;
            padding: 12px 20px;
            font-size: 0.75rem;
            word-break: break-all;
            margin-top: 10px;
        }
        .glass-card {
            background: var(--surface);
            backdrop-filter: blur(20px);
            border-radius: var(--radius-card);
            padding: 24px 28px;
            border: 1px solid var(--border-light);
        }
        .section-title {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--text-tertiary);
            margin-bottom: 20px;
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .screenshot-scroll {
            display: flex;
            overflow-x: auto;
            gap: 16px;
            padding-bottom: 10px;
        }
        .screenshot-scroll img {
            height: 220px;
            border-radius: 20px;
            flex-shrink: 0;
            border: 1px solid rgba(255,255,255,0.2);
            cursor: pointer;
            transition: 0.2s;
        }
        .screenshot-scroll img:hover {
            transform: scale(1.02);
            border-color: white;
        }
        .desc-wrapper {
            overflow: hidden;
            transition: max-height 0.45s var(--transition);
        }
        .desc-text {
            color: var(--text-secondary);
            line-height: 1.65;
            font-size: 0.95rem;
        }
        .expand-btn {
            background: none;
            border: none;
            color: white;
            font-weight: 600;
            font-size: 0.8rem;
            margin-top: 12px;
            cursor: pointer;
            opacity: 0.7;
        }
        .permissions-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .perm-item {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding: 8px 0;
        }
        .footer {
            text-align: center;
            padding: 24px 0 12px;
            font-size: 0.7rem;
            color: var(--text-tertiary);
        }
        .footer a {
            color: white;
            margin: 0 8px;
            text-decoration: none;
        }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(90px);
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(28px);
            padding: 12px 28px;
            border-radius: 60px;
            display: flex;
            gap: 12px;
            align-items: center;
            font-weight: 600;
            z-index: 300;
            transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.2);
            border: 1px solid rgba(255,255,255,0.3);
        }
        .toast.visible {
            transform: translateX(-50%) translateY(0);
        }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(24px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: 0.3s;
        }
        .modal-overlay.visible {
            opacity: 1;
            visibility: visible;
        }
        .modal-card {
            background: rgba(0,0,0,0.96);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 48px;
            max-width: 540px;
            width: 90%;
            padding: 28px;
            position: relative;
            transform: scale(0.96);
            transition: transform 0.3s;
        }
        .modal-overlay.visible .modal-card {
            transform: scale(1);
        }
        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1100;
            opacity: 0;
            visibility: hidden;
            transition: 0.3s;
        }
        .lightbox.visible {
            opacity: 1;
            visibility: visible;
        }
        .lightbox img {
            max-width: 90vw;
            max-height: 85vh;
            border-radius: 24px;
            box-shadow: 0 30px 50px black;
        }
        .close-btn {
            position: absolute;
            top: 20px;
            right: 28px;
            font-size: 32px;
            background: none;
            border: none;
            color: white;
            cursor: pointer;
        }
        @media (max-width: 680px) {
            body { padding: 16px; }
            .hero-panel { flex-direction: column; align-items: center; text-align: center; }
            .download-row { justify-content: center; }
            .platform-card { padding: 20px 32px; min-width: 150px; }
            .app-name { font-size: 1.6rem; }
        }
    </style>
</head>

<script type="module">
import * as THREE from 'three';

let scene, camera, renderer, waveMesh, stars, timeVal = 0, animFrame = null, webglActive = true;
let lowPerformance = false;
if (/Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) lowPerformance = true;

const canvasElem = document.getElementById('bg-canvas');
function initWebGL() {
    if (renderer) { if (animFrame) cancelAnimationFrame(animFrame); if (renderer.domElement?.parentNode) renderer.domElement.remove(); }
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);
    scene.fog = new THREE.FogExp2(0x000000, lowPerformance ? 0.02 : 0.012);
    camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(10, 6.5, 12);
    camera.lookAt(0, 0.2, 0);
    renderer = new THREE.WebGLRenderer({ canvas: canvasElem, alpha: false, antialias: !lowPerformance, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(lowPerformance ? Math.min(window.devicePixelRatio, 1.5) : Math.min(window.devicePixelRatio, 2));
    const seg = lowPerformance ? 28 : 36;
    const widthSeg = seg, heightSeg = seg, planeW = 18, planeH = 18;
    const geometry = new THREE.PlaneGeometry(planeW, planeH, widthSeg, heightSeg);
    geometry.rotateX(-Math.PI / 2);
    const material = new THREE.MeshStandardMaterial({ color: 0xffffff, wireframe: true, emissive: 0x111111, roughness: 0.5, metalness: 0.7 });
    waveMesh = new THREE.Mesh(geometry, material);
    scene.add(waveMesh);
    const ambient = new THREE.AmbientLight(0x222222); scene.add(ambient);
    const dirLight = new THREE.DirectionalLight(0xffffff, 1); dirLight.position.set(4, 8, 6); scene.add(dirLight);
    const fill = new THREE.PointLight(0x444444, 0.4); fill.position.set(-2, 3, 5); scene.add(fill);
    const grid = new THREE.GridHelper(24, 20, 0xffffff, 0x333333); grid.position.y = -1.8; grid.material.transparent = true; grid.material.opacity = 0.15; scene.add(grid);
    const starCount = lowPerformance ? 300 : 600;
    const starGeo = new THREE.BufferGeometry();
    const starPos = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount; i++) {
        starPos[i*3] = (Math.random() - 0.5) * 200;
        starPos[i*3+1] = (Math.random() - 0.5) * 55;
        starPos[i*3+2] = (Math.random() - 0.5) * 85 - 35;
    }
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: lowPerformance ? 0.06 : 0.08, transparent: true, opacity: 0.6 }));
    scene.add(stars);
    animate();
}
function animateWave() {
    if (!waveMesh || !waveMesh.geometry || !webglActive) return;
    timeVal += lowPerformance ? 0.014 : 0.018;
    const positions = waveMesh.geometry.attributes.position.array;
    const seg = lowPerformance ? 28 : 36;
    const planeW = 18, planeH = 18;
    for (let i = 0; i <= seg; i++) {
        const x = (i / seg - 0.5) * planeW;
        for (let j = 0; j <= seg; j++) {
            const z = (j / seg - 0.5) * planeH;
            const idx = (j * (seg + 1) + i) * 3;
            const y1 = Math.sin(x * 0.8 + timeVal) * Math.cos(z * 0.7 + timeVal * 0.6) * 0.5;
            const y2 = Math.sin(x * 1.5 - timeVal * 1.0) * 0.25;
            const y3 = Math.cos(z * 1.3 + timeVal * 0.8) * 0.25;
            const y4 = Math.sin((x * 1.1 + z * 1.1) * 0.7 + timeVal * 1.2) * 0.2;
            positions[idx + 1] = y1 + y2 + y3 + y4;
        }
    }
    waveMesh.geometry.attributes.position.needsUpdate = true;
    waveMesh.geometry.computeVertexNormals();
}
function animate() {
    if (!webglActive) { animFrame = requestAnimationFrame(animate); return; }
    animateWave();
    if (stars) { stars.rotation.y += 0.0004; stars.rotation.x += 0.0002; }
    if (camera) camera.lookAt(0, 0.3, 0);
    if (renderer && scene && camera) renderer.render(scene, camera);
    animFrame = requestAnimationFrame(animate);
}
window.addEventListener('resize', () => {
    if (camera) { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); }
    if (renderer) renderer.setSize(window.innerWidth, window.innerHeight);
});
document.addEventListener('visibilitychange', () => {
    if (document.hidden) { if (animFrame) cancelAnimationFrame(animFrame); animFrame = null; }
    else if (!animFrame && webglActive) animate();
});
initWebGL();

    Android: { title: 'Dynamic Browser for Android', tagline: 'Лёгкий, быстрый, современный веб-серфинг.', fullDesc: 'Адаптирован для мобильных устройств: экономия трафика, ночной режим, встроенный менеджер загрузок, защита от фишинга и плавная работа на любых устройствах.', formats: ['apk'], sizes: { apk: '28.3 MB' }, defaultFormat: 'apk', perms: ['Интернет', 'Хранилище', 'Геопозиция', 'Уведомления'] }
};

const closeLightboxBtn = document.getElementById('closeLightbox');

function showToast(msg) { toastMsgSpan.innerText = msg; toastEl.classList.add('visible'); clearTimeout(window.toastTimeout); window.toastTimeout = setTimeout(() => toastEl.classList.remove('visible'), 2800); }
function truncName(name, len=40) { return name.length <= len ? name : name.slice(0,len)+'…'; }
function updateFileUI() { if (!currentFileName) { fileInfoRow.style.display = 'none'; fileDetailPanel.classList.remove('visible'); return; } fileInfoRow.style.display = 'flex'; shortFileNameSpan.innerText = truncName(currentFileName); fileDetailPanel.innerText = `${currentFileName} (${currentFileSize})`; if (currentFileName.length <= 40) toggleFileBtn.style.display = 'none'; else { toggleFileBtn.style.display = 'inline-block'; fileDetailPanel.classList.remove('visible'); } }
toggleFileBtn.addEventListener('click', () => { if (fileDetailPanel.classList.contains('visible')) { fileDetailPanel.classList.remove('visible'); toggleFileBtn.innerText = 'подробнее'; } else { fileDetailPanel.classList.add('visible'); toggleFileBtn.innerText = 'свернуть'; } });
function resetDesc() { descWrapper.style.maxHeight = 'none'; expandDescBtn.style.display = 'none'; expandDescBtn.innerText = 'Развернуть'; expandDescBtn.dataset.exp = 'false'; }
function adjustDesc() { if (descTextSpan.innerText === lastDesc) return; lastDesc = descTextSpan.innerText; resetDesc(); requestAnimationFrame(() => { const lh = parseFloat(getComputedStyle(descTextSpan).lineHeight); if (!lh) return; const maxH = lh * 5; if (descTextSpan.scrollHeight > maxH + 3) { descWrapper.style.maxHeight = maxH + 'px'; expandDescBtn.style.display = 'inline-block'; expandDescBtn.dataset.exp = 'false'; expandDescBtn.innerText = 'Развернуть'; } else { descWrapper.style.maxHeight = 'none'; expandDescBtn.style.display = 'none'; } }); }
expandDescBtn.addEventListener('click', () => { const expanded = expandDescBtn.dataset.exp === 'true'; const lh = parseFloat(getComputedStyle(descTextSpan).lineHeight); if (expanded) { descWrapper.style.maxHeight = (lh * 5) + 'px'; expandDescBtn.innerText = 'Развернуть'; expandDescBtn.dataset.exp = 'false'; } else { descWrapper.style.maxHeight = descTextSpan.scrollHeight + 'px'; expandDescBtn.innerText = 'Свернуть'; expandDescBtn.dataset.exp = 'true'; } });
async function fetchJSON(url) { try { const r = await fetch(url); return r.ok ? await r.json() : null; } catch { return null; } }
async function fetchText(url) { try { const r = await fetch(url); return r.ok ? await r.text() : null; } catch { return null; } }
async function loadInstruction(os) { return await fetchJSON(`${os}/instruction.json`); }
async function loadScreenshots(base, imgMap) { if (!imgMap) return []; const urls = []; for (const key of Object.keys(imgMap).sort((a,b)=> (parseInt(a.match(/\d+/)?.[0]||0) - parseInt(b.match(/\d+/)?.[0]||0)))) { const src = `${base}/${imgMap[key]}`; const test = new Image(); await new Promise(res => { test.onload = () => res(true); test.onerror = () => res(false); test.src = src; }); if (test.complete && test.naturalWidth) urls.push(src); } return urls; }
function renderScreenshots(images) { screenshotScroll.innerHTML = images.length ? images.map(src => `<img src="${src}" class="screenshot-thumb" loading="lazy">`).join('') : '<div style="color:rgba(255,255,255,0.4); padding:12px;">Нет скриншотов</div>'; document.querySelectorAll('.screenshot-thumb').forEach(img => img.addEventListener('click', () => { lightboxImage.src = img.src; lightbox.classList.add('visible'); })); }
async function refreshUI() {
    if (!currentOS) { storeScreen.classList.add('screen-hidden'); platformScreen.classList.remove('screen-hidden'); platformScreen.style.opacity = '1'; platformScreen.style.transform = 'none'; return; }
    const data = storeData[currentOS];
    appNameSpan.innerText = data.title;
    appTaglineSpan.innerText = data.tagline;
    installInstruction = await loadInstruction(currentOS);
    let desc = data.fullDesc;
    if (installInstruction?.desc) { const fetched = await fetchText(`${currentOS}/${installInstruction.desc}`); if (fetched) desc = fetched; }
    descTextSpan.innerText = desc;
    permissionsDiv.innerHTML = data.perms.map(p => `<div class="perm-item"><i class="fas fa-check-circle"></i> ${p}</div>`).join('');
    const version = installInstruction?.version || '3.2.1';
    let fname = '';
    if (installInstruction?.app) { if (currentOS === 'Windows') fname = currentFormat === 'exe' ? installInstruction.exe : installInstruction.zip; else fname = installInstruction.app; }
    if (!fname) fname = currentOS === 'Windows' ? (currentFormat === 'exe' ? `dynamic-browser-setup-${version}.exe` : `dynamic-browser-portable-${version}.zip`) : `dynamic-browser-${version}.apk`;
    currentFileName = fname; currentFileSize = data.sizes[currentFormat] || '';
    if (currentOS === 'Windows') { formatSwitch.style.display = 'flex'; document.querySelectorAll('.format-btn').forEach(btn => btn.classList.remove('active')); const active = document.querySelector(`.format-btn[data-format="${currentFormat}"]`); if (active) active.classList.add('active'); versionBadgeSpan.innerText = `v${version} · ${data.sizes[currentFormat]}`; } else { formatSwitch.style.display = 'none'; currentFormat = 'apk'; versionBadgeSpan.innerText = `v${version} · ${data.sizes.apk}`; }
    updateFileUI();
    const screens = await loadScreenshots(currentOS, installInstruction?.Images || null);
    renderScreenshots(screens);
    adjustDesc();
    if (platformScreen.classList.contains('screen-hidden') === false) { platformScreen.style.transition = 'opacity 0.5s ease, transform 0.5s'; platformScreen.style.opacity = '0'; platformScreen.style.transform = 'scale(0.96) translateY(-15px)'; setTimeout(() => { platformScreen.classList.add('screen-hidden'); storeScreen.classList.remove('screen-hidden'); storeScreen.style.animation = 'none'; storeScreen.offsetHeight; storeScreen.style.animation = 'fadeUp 0.6s ease'; }, 480); }
}
document.querySelectorAll('.platform-card').forEach(card => { card.addEventListener('click', () => { const os = card.dataset.os; if (currentOS === os) return; currentOS = os; currentFormat = storeData[os].defaultFormat; refreshUI(); }); });
backBtn.addEventListener('click', () => { storeScreen.style.transition = 'opacity 0.4s, transform 0.4s'; storeScreen.style.opacity = '0'; storeScreen.style.transform = 'translateY(20px)'; setTimeout(() => { storeScreen.classList.add('screen-hidden'); storeScreen.style.opacity = ''; storeScreen.style.transform = ''; platformScreen.classList.remove('screen-hidden'); platformScreen.style.opacity = '0'; platformScreen.style.transform = 'translateY(-10px)'; platformScreen.style.transition = 'none'; platformScreen.offsetHeight; platformScreen.style.transition = 'opacity 0.5s ease, transform 0.5s'; platformScreen.style.opacity = '1'; platformScreen.style.transform = 'none'; currentOS = null; }, 400); });
formatSwitch.addEventListener('click', (e) => { if (currentOS !== 'Windows') return; const btn = e.target.closest('.format-btn'); if (btn && btn.dataset.format) { currentFormat = btn.dataset.format; refreshUI(); } });
downloadBtn.addEventListener('click', () => { if (!currentOS || !currentFileName) return; showToast(`Скачивание ${currentFileName} (${currentFileSize})`); const a = document.createElement('a'); a.href = `https://dynamicbrowser.app/dl/${currentFileName}`; a.download = currentFileName; a.style.display = 'none'; document.body.appendChild(a); a.click(); document.body.removeChild(a); });
privacyLink.addEventListener('click', (e) => { e.preventDefault(); fetch('POLITICS.txt').then(r => r.ok ? r.text() : Promise.reject()).then(txt => { const blocks = txt.split('\n\n').filter(b=>b.trim()); privacyContent.innerHTML = blocks.map(block => `<p style="margin-bottom:16px;">${block.replace(/\n/g, '<br>')}</p>`).join(''); }).catch(() => privacyContent.innerHTML = '<p>Не удалось загрузить политику.</p>'); privacyModal.classList.add('visible'); });
closePrivacy.addEventListener('click', () => privacyModal.classList.remove('visible'));
privacyModal.addEventListener('click', (e) => { if (e.target === privacyModal) privacyModal.classList.remove('visible'); });
closeLightboxBtn.addEventListener('click', () => { lightbox.classList.remove('visible'); lightboxImage.src = ''; });
lightbox.addEventListener('click', (e) => { if (e.target === lightbox) { lightbox.classList.remove('visible'); lightboxImage.src = ''; } });
refreshUI();
</script>
</body>
</html>
