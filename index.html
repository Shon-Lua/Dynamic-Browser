<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dynamic Browser</title>
    <link rel="icon" href="Logo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg: #000000;
            --surface: rgba(0, 0, 0, 0.65);
            --surface-2: rgba(0, 0, 0, 0.75);
            --surface-3: rgba(0, 0, 0, 0.85);
            --accent: #ffffff;
            --accent-2: #ffffff;
            --accent-glow: rgba(255, 255, 255, 0.2);
            --text: #ffffff;
            --text-2: rgba(255, 255, 255, 0.8);
            --text-3: rgba(255, 255, 255, 0.6);
            --border: rgba(255, 255, 255, 0.08);
            --border-2: rgba(255, 255, 255, 0.15);
            --radius-sm: 12px;
            --radius: 18px;
            --radius-lg: 28px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'Inter', system-ui, -apple-system, sans-serif;
            --glass-blur: 22px;
            --glass-bg: rgba(0, 0, 0, 0.55);
            --glass-border: rgba(255, 255, 255, 0.12);
        }

        html {
            scroll-behavior: smooth;
            font-size: 16px;
            height: 100%;
            color-scheme: dark;
        }

        body {
            font-family: var(--font);
            background: #000000;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 20px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            line-height: 1.6;
            position: relative;
            overflow-y: auto;
            isolation: isolate;
        }

        canvas#wave-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            justify-content: center;
            min-height: 100%;
        }

        .platform-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            gap: 32px;
            flex: 1;
            will-change: transform, opacity, filter;
        }
        .platform-screen.hidden {
            display: none;
        }
        .platform-title {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-3);
            text-align: center;
            background: rgba(0, 0, 0, 0.6);
            padding: 12px 24px;
            border-radius: 40px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transform: translateZ(0);
            backface-visibility: hidden;
            will-change: transform, backdrop-filter;
        }
        .platform-cards {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .platform-card {
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 36px 28px;
            cursor: pointer;
            transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1), box-shadow 0.3s ease, border-color 0.2s;
            text-align: center;
            user-select: none;
            min-width: 170px;
            flex: 1 1 170px;
            max-width: 200px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7);
            position: relative;
            overflow: hidden;
            transform: translateZ(0);
            backface-visibility: hidden;
            will-change: transform, backdrop-filter;
        }
        .platform-card::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15) 0%, transparent 50%);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .platform-card:hover::after {
            opacity: 1;
        }
        .platform-card:hover {
            border-color: rgba(255, 255, 255, 0.5);
            background: rgba(0, 0, 0, 0.8);
            transform: translateY(-8px) scale(1.02) translateZ(0);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 25px rgba(255, 255, 255, 0.15);
        }
        .platform-card:active {
            transform: scale(0.98);
            transition: transform 0.1s;
        }
        .platform-card i {
            font-size: 2.8rem;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 16px;
            display: block;
            transition: color 0.3s;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.2));
        }
        .platform-card:hover i {
            color: var(--accent);
        }
        .platform-card span {
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: -0.01em;
        }

        .store-view {
            display: none;
            flex-direction: column;
            width: 100%;
            gap: 20px;
            will-change: transform, opacity, filter;
        }
        .store-view.visible {
            display: flex;
        }

        .back-btn {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            color: var(--text-2);
            border-radius: 50px;
            padding: 8px 20px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            align-self: flex-start;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            letter-spacing: 0.02em;
            transform: translateZ(0);
            backface-visibility: hidden;
            will-change: transform, backdrop-filter;
        }
        .back-btn:hover {
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateX(-4px);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
        }

        .app-header {
            display: flex;
            gap: 20px;
            align-items: center;
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border-radius: var(--radius);
            padding: 24px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
            position: relative;
            transform: translateZ(0);
            backface-visibility: hidden;
            will-change: transform, backdrop-filter;
        }
        .app-icon {
            width: 88px;
            height: 88px;
            border-radius: 20px;
            object-fit: cover;
            background: rgba(0, 0, 0, 0.4);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .app-info {
            flex: 1;
        }
        .app-name {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 4px;
            line-height: 1.2;
        }
        .app-short-desc {
            font-size: 0.95rem;
            color: var(--text-2);
            margin-bottom: 12px;
        }
        .download-area {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        .format-selector {
            display: flex;
            gap: 8px;
        }
        .format-chip {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 40px;
            padding: 8px 16px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-2);
            user-select: none;
            transform: translateZ(0);
            backface-visibility: hidden;
        }
        .format-chip.active {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 14px rgba(255, 255, 255, 0.3);
        }
        .btn-install {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 40px;
            padding: 12px 28px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.02em;
            transform: translateZ(0);
            backface-visibility: hidden;
        }
        .btn-install:hover {
            transform: translateY(-3px) scale(1.02);
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.7);
            box-shadow: 0 14px 32px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 255, 255, 0.2);
        }
        .btn-install:active {
            transform: scale(0.97);
        }
        .install-meta {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.85);
            margin-top: 2px;
            display: block;
            font-weight: 500;
            letter-spacing: 0.02em;
        }
        .file-info-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
            font-size: 0.85rem;
            color: var(--text-2);
            background: rgba(0, 0, 0, 0.5);
            padding: 6px 12px;
            border-radius: 30px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: fit-content;
        }
        .file-name-short {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 220px;
            display: inline-block;
        }
        .file-toggle-btn {
            background: none;
            border: none;
            color: #ffffff;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: color 0.2s;
            white-space: nowrap;
        }
        .file-toggle-btn:hover {
            color: #ccc;
        }
        .file-full-info {
            display: none;
            margin-top: 6px;
            font-size: 0.85rem;
            color: var(--text-2);
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 12px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            word-break: break-all;
            max-width: 100%;
        }
        .file-full-info.visible {
            display: block;
        }

        .screenshots-section {
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border-radius: var(--radius);
            padding: 20px;
            border: 1px solid var(--glass-border);
            transform: translateZ(0);
            backface-visibility: hidden;
            will-change: transform, backdrop-filter;
        }
        .section-label {
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-3);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-label::before {
            content: '';
            width: 6px;
            height: 6px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 6px rgba(255, 255, 255, 0.5);
        }
        .screenshots-scroll {
            display: flex;
            overflow-x: auto;
            gap: 12px;
            padding-bottom: 6px;
        }
        .screenshot-img {
            border-radius: 12px;
            max-height: 260px;
            flex-shrink: 0;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.15);
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s;
        }
        .screenshot-img:hover {
            transform: scale(1.02);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .description-card {
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border-radius: var(--radius);
            padding: 20px;
            border: 1px solid var(--glass-border);
            transform: translateZ(0);
            backface-visibility: hidden;
            will-change: transform, backdrop-filter;
        }
        .description-text-wrapper {
            overflow: hidden;
            transition: max-height 0.35s ease;
        }
        .description-text {
            font-size: 0.95rem;
            color: var(--text-2);
            line-height: 1.7;
        }
        .expand-btn {
            display: inline-block;
            background: none;
            border: none;
            color: var(--accent-2);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            margin-top: 8px;
            padding: 4px 0;
            transition: color 0.2s;
            text-decoration: underline;
            text-underline-offset: 2px;
        }
        .expand-btn:hover {
            color: #ffffff;
        }

        .permissions-card {
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border-radius: var(--radius);
            padding: 20px;
            border: 1px solid var(--glass-border);
            transform: translateZ(0);
            backface-visibility: hidden;
            will-change: transform, backdrop-filter;
        }
        .permission-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 0.9rem;
            color: var(--text-2);
        }
        .permission-item:last-child {
            border-bottom: none;
        }
        .permission-item i {
            color: var(--accent-2);
            width: 18px;
            text-align: center;
        }

        .footer {
            text-align: center;
            padding: 20px 0 8px;
            color: var(--text-3);
            font-size: 0.75rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            margin-top: 8px;
        }
        .footer a {
            color: var(--accent-2);
            text-decoration: none;
            margin: 0 4px;
        }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(120px);
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 40px;
            padding: 14px 28px;
            color: #fff;
            font-weight: 600;
            font-size: 0.9rem;
            z-index: 100;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .toast.visible {
            transform: translateX(-50%) translateY(0);
        }
        .toast i {
            color: #ffffff;
        }

        .modal-overlay {
            display: flex;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s;
        }
        .modal-overlay.modal--visible {
            opacity: 1;
            visibility: visible;
        }
        .modal-content {
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: var(--radius-lg);
            max-width: 650px;
            width: 90%;
            position: relative;
            overflow: hidden;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.85);
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }
        .modal-overlay.modal--visible .modal-content {
            transform: scale(1);
        }
        .modal-scroll {
            overflow-y: auto;
            max-height: 80vh;
            padding: 28px;
        }
        .modal-close {
            position: absolute;
            top: 12px;
            right: 16px;
            background: none;
            border: none;
            color: var(--text-2);
            font-size: 1.8rem;
            cursor: pointer;
        }

        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.96);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .lightbox.visible {
            opacity: 1;
            visibility: visible;
        }
        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 2.5rem;
            color: #fff;
            cursor: pointer;
            z-index: 2001;
            background: none;
            border: none;
        }
        .lightbox-img {
            max-width: 90vw;
            max-height: 85vh;
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
        }

        @media (max-width: 640px) {
            body { padding: 16px; }
            .platform-cards { gap: 16px; }
            .platform-card { padding: 28px 16px; }
            .app-header { flex-direction: column; align-items: center; text-align: center; }
            .app-icon { width: 72px; height: 72px; }
            .download-area { justify-content: center; }
            .screenshots-scroll {
                flex-direction: column;
                overflow-x: visible;
            }
            .screenshot-img {
                width: 100%;
                max-width: 100%;
                height: auto;
                max-height: none;
            }
            .file-name-short {
                max-width: 160px;
            }
        }
    </style>
</head>
<body>
<canvas id="wave-canvas"></canvas>
<div class="container">
    <div class="platform-screen" id="platformScreen">
        <h2 class="platform-title">Выберите вашу платформу</h2>
        <div class="platform-cards" id="platformCards">
            <div class="platform-card" data-os="Windows">
                <i class="fab fa-windows"></i>
                <span>Windows</span>
            </div>
            <div class="platform-card" data-os="Android">
                <i class="fab fa-android"></i>
                <span>Android</span>
            </div>
        </div>
    </div>

    <div class="store-view" id="storeView">
        <button class="back-btn" id="backBtn"><i class="fas fa-arrow-left"></i> Назад</button>

        <div class="app-header">
            <img src="Logo.png" alt="Dynamic Browser" class="app-icon" id="appIcon">
            <div class="app-info">
                <h1 class="app-name" id="appName">Dynamic Browser</h1>
                <p class="app-short-desc" id="appShortDesc"></p>
                <div class="download-area">
                    <div class="format-selector" id="formatSelector" style="display: none;">
                        <span class="format-chip active" data-format="exe">EXE</span>
                        <span class="format-chip" data-format="zip">ZIP</span>
                    </div>
                    <button class="btn-install" id="btnInstall">
                        <i class="fas fa-download"></i> Скачать
                        <span class="install-meta" id="installMeta"></span>
                    </button>
                </div>
                <div class="file-info-row" id="fileInfoRow" style="display: none;">
                    <span class="file-name-short" id="fileNameShort"></span>
                    <button class="file-toggle-btn" id="fileToggleBtn">
                        <span>Подробнее</span>
                    </button>
                </div>
                <div class="file-full-info" id="fileFullInfo"></div>
            </div>
        </div>

        <div class="screenshots-section">
            <h3 class="section-label">Скриншоты</h3>
            <div class="screenshots-scroll" id="screenshotsContainer"></div>
        </div>

        <div class="description-card">
            <h3 class="section-label">Описание</h3>
            <div class="description-text-wrapper" id="descWrapper">
                <p class="description-text" id="fullDesc"></p>
            </div>
            <button class="expand-btn" id="expandDescBtn" style="display:none;">Ещё</button>
        </div>

        <div class="permissions-card">
            <h3 class="section-label">Права доступа</h3>
            <div id="permissionsList"></div>
        </div>

        <div class="footer">
            © 2026 Dynamic Browser.
            <a href="#" id="privacyLink">Политика конфиденциальности</a>
            <a href="https://github.com/Shon-Lua/Dynamic-Browser" target="_blank" rel="noopener noreferrer">GitHub</a>
        </div>
    </div>
</div>

<div class="toast" id="toast">
    <i class="fas fa-check-circle"></i>
    <span id="toastMessage"></span>
</div>

<div class="modal-overlay" id="privacyModal">
    <div class="modal-content">
        <button class="modal-close" id="modalClose">&times;</button>
        <div class="modal-scroll">
            <div class="modal-body" id="modalBody">Загрузка...</div>
        </div>
    </div>
</div>

<div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightboxClose">&times;</button>
    <img class="lightbox-img" id="lightboxImg" src="" alt="Скриншот">
</div>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';

    const canvas = document.getElementById('wave-canvas');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);
    scene.fog = new THREE.FogExp2(0x000000, 0.012);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(12, 8, 14);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ canvas, alpha: false, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);

    const widthSegments = 80;
    const heightSegments = 80;
    const planeWidth = 18;
    const planeHeight = 18;
    const geometry = new THREE.PlaneGeometry(planeWidth, planeHeight, widthSegments, heightSegments);
    geometry.rotateX(-Math.PI / 2);
    const positions = geometry.attributes.position.array;
    const originalY = new Float32Array(positions.length / 3);
    for (let i = 0; i < positions.length / 3; i++) {
        originalY[i] = positions[i*3 + 1];
    }

    const material = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        wireframe: true,
        emissive: 0x111111,
        roughness: 0.4,
        metalness: 0.8
    });
    const waveMesh = new THREE.Mesh(geometry, material);
    scene.add(waveMesh);

    const ambientLight = new THREE.AmbientLight(0x222222);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 1);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);
    const backLight = new THREE.DirectionalLight(0xffffff, 0.5);
    backLight.position.set(-3, 5, -5);
    scene.add(backLight);

    const gridHelper = new THREE.GridHelper(25, 20, 0xffffff, 0x444444);
    gridHelper.position.y = -2.2;
    gridHelper.material.transparent = true;
    gridHelper.material.opacity = 0.2;
    scene.add(gridHelper);

    const starGeometry = new THREE.BufferGeometry();
    const starCount = 1200;
    const starPositions = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount; i++) {
        starPositions[i*3] = (Math.random() - 0.5) * 200;
        starPositions[i*3+1] = (Math.random() - 0.5) * 60;
        starPositions[i*3+2] = (Math.random() - 0.5) * 80 - 40;
    }
    starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    const starMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.08, transparent: true, opacity: 0.6 });
    const stars = new THREE.Points(starGeometry, starMaterial);
    scene.add(stars);

    let time = 0;
    function animateWave() {
        time += 0.018;
        const positionsAttr = geometry.attributes.position;
        const array = positionsAttr.array;
        const width = widthSegments + 1;
        const height = heightSegments + 1;
        for (let i = 0; i <= widthSegments; i++) {
            const x = (i / widthSegments - 0.5) * planeWidth;
            for (let j = 0; j <= heightSegments; j++) {
                const z = (j / heightSegments - 0.5) * planeHeight;
                const idx = (j * width + i) * 3;
                const y1 = Math.sin(x * 0.9 + time) * Math.cos(z * 0.7 + time * 0.7) * 0.6;
                const y2 = Math.sin(x * 1.8 - time * 1.2) * 0.3;
                const y3 = Math.cos(z * 1.5 + time * 0.9) * 0.3;
                const y4 = Math.sin((x * 1.2 + z * 1.2) * 0.8 + time * 1.5) * 0.25;
                array[idx + 1] = y1 + y2 + y3 + y4;
            }
        }
        positionsAttr.needsUpdate = true;
        geometry.computeVertexNormals();
    }

    function animate() {
        requestAnimationFrame(animate);
        animateWave();
        stars.rotation.y += 0.0005;
        stars.rotation.x += 0.0003;
        camera.lookAt(0, 0.5, 0);
        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const state = {
        selectedOS: null,
        selectedFormat: 'exe'
    };

    const appData = {
        Windows: {
            title: 'Dynamic Browser для Windows',
            shortDesc: 'Быстрый, безопасный и современный браузер.',
            fullDesc: 'nil',
            formats: ['exe', 'zip'],
            sizes: { exe: 'nil MB', zip: 'nil MB' },
            defaultFormat: 'exe',
            permissions: ['Интернет-соединение', 'Доступ к файловой системе (при сохранении файлов)', 'Геолокация (по желанию)']
        },
        Android: {
            title: 'Dynamic Browser для Android',
            shortDesc: 'Лёгкий и удобный браузер.',
            fullDesc: 'nil',
            formats: ['apk'],
            sizes: { apk: 'nil MB' },
            defaultFormat: 'apk',
            permissions: ['Интернет-соединение', 'Доступ к хранилищу (для загрузок)', 'Геолокация (по желанию)', 'Управление уведомлениями']
        }
    };

    const platformScreen = document.getElementById('platformScreen');
    const storeView = document.getElementById('storeView');
    const formatSelector = document.getElementById('formatSelector');
    const appName = document.getElementById('appName');
    const appShortDesc = document.getElementById('appShortDesc');
    const fullDesc = document.getElementById('fullDesc');
    const descWrapper = document.getElementById('descWrapper');
    const expandDescBtn = document.getElementById('expandDescBtn');
    const permissionsList = document.getElementById('permissionsList');
    const installMeta = document.getElementById('installMeta');
    const screenshotsContainer = document.getElementById('screenshotsContainer');
    const platformCards = document.querySelectorAll('.platform-card');
    const backBtn = document.getElementById('backBtn');
    const btnInstall = document.getElementById('btnInstall');
    const fileInfoRow = document.getElementById('fileInfoRow');
    const fileNameShort = document.getElementById('fileNameShort');
    const fileToggleBtn = document.getElementById('fileToggleBtn');
    const fileFullInfo = document.getElementById('fileFullInfo');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    const lightboxClose = document.getElementById('lightboxClose');

    let currentInstruction = null;
    let isAnimating = false;
    let currentFileName = '';
    let currentFileSize = '';

    function truncateFileName(name, maxLen = 40) {
        if (name.length <= maxLen) return name;
        return name.substring(0, maxLen) + '...';
    }

    function updateFileDisplay() {
        if (!currentFileName) {
            fileInfoRow.style.display = 'none';
            fileFullInfo.classList.remove('visible');
            return;
        }
        fileInfoRow.style.display = 'flex';
        fileNameShort.textContent = truncateFileName(currentFileName);
        fileFullInfo.textContent = `${currentFileName} (${currentFileSize})`;
        if (currentFileName.length <= 40) {
            fileToggleBtn.style.display = 'none';
        } else {
            fileToggleBtn.style.display = 'inline-flex';
            fileToggleBtn.querySelector('span').textContent = 'Подробнее';
            fileFullInfo.classList.remove('visible');
        }
    }

    fileToggleBtn.addEventListener('click', () => {
        if (fileFullInfo.classList.contains('visible')) {
            fileFullInfo.classList.remove('visible');
            fileToggleBtn.querySelector('span').textContent = 'Подробнее';
        } else {
            fileFullInfo.classList.add('visible');
            fileToggleBtn.querySelector('span').textContent = 'Свернуть';
        }
    });

    function setupDescriptionExpand() {
        descWrapper.style.maxHeight = 'none';
        expandDescBtn.style.display = 'none';
        void descWrapper.offsetHeight;
        const computedStyle = getComputedStyle(fullDesc);
        const lineHeight = parseFloat(computedStyle.lineHeight);
        if (isNaN(lineHeight)) return;
        const maxHeight = lineHeight * 5;
        const scrollHeight = fullDesc.scrollHeight;
        if (scrollHeight > maxHeight + 2) {
            descWrapper.style.maxHeight = maxHeight + 'px';
            expandDescBtn.style.display = 'inline-block';
            expandDescBtn.textContent = 'Ещё';
            expandDescBtn.dataset.expanded = 'false';
        }
    }

    expandDescBtn.addEventListener('click', () => {
        const expanded = expandDescBtn.dataset.expanded === 'true';
        const computedStyle = getComputedStyle(fullDesc);
        const lineHeight = parseFloat(computedStyle.lineHeight);
        if (expanded) {
            descWrapper.style.maxHeight = (lineHeight * 5) + 'px';
            expandDescBtn.textContent = 'Ещё';
            expandDescBtn.dataset.expanded = 'false';
        } else {
            descWrapper.style.maxHeight = fullDesc.scrollHeight + 'px';
            expandDescBtn.textContent = 'Свернуть';
            expandDescBtn.dataset.expanded = 'true';
        }
    });

    async function safeFetchText(url) {
        try {
            const r = await fetch(url);
            return r.ok ? await r.text() : null;
        } catch { return null; }
    }

    async function safeFetchJson(url) {
        try {
            const r = await fetch(url);
            if (!r.ok) return null;
            return await r.json();
        } catch { return null; }
    }

    async function loadInstruction(os) {
        return await safeFetchJson(`${os}/instruction.json`);
    }

    async function loadDescription(base, descPath) {
        if (!descPath) return null;
        return await safeFetchText(`${base}/${descPath}`);
    }

    async function loadScreenshots(base, imagesObj) {
        const urls = [];
        if (!imagesObj || typeof imagesObj !== 'object') return urls;
        const keys = Object.keys(imagesObj).sort((a, b) => {
            const na = parseInt(a.match(/\d+/)?.[0] || 0);
            const nb = parseInt(b.match(/\d+/)?.[0] || 0);
            return na - nb;
        });
        for (const key of keys) {
            const src = `${base}/${imagesObj[key]}`;
            const loaded = await new Promise(resolve => {
                const img = new Image();
                img.onload = () => resolve(true);
                img.onerror = () => resolve(false);
                img.src = src;
            });
            if (loaded) urls.push(src);
        }
        return urls;
    }

    function renderScreenshots(images) {
        screenshotsContainer.innerHTML = '';
        if (!images.length) {
            screenshotsContainer.innerHTML = '<p style="color:rgba(255,255,255,0.6); text-align:center; width:100%">Скриншоты не найдены</p>';
            return;
        }
        images.forEach(src => {
            const img = document.createElement('img');
            img.src = src;
            img.className = 'screenshot-img';
            img.alt = 'Скриншот';
            img.addEventListener('click', () => {
                lightboxImg.src = src;
                lightbox.classList.add('visible');
            });
            screenshotsContainer.appendChild(img);
        });
    }

    function closeLightbox() {
        lightbox.classList.remove('visible');
        const onTransitionEnd = () => {
            if (!lightbox.classList.contains('visible')) {
                lightboxImg.src = '';
                lightbox.removeEventListener('transitionend', onTransitionEnd);
            }
        };
        lightbox.addEventListener('transitionend', onTransitionEnd, { once: true });
    }

    lightboxClose.addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', (e) => {
        if (e.target === lightbox) closeLightbox();
    });
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && lightbox.classList.contains('visible')) closeLightbox();
    });

    function getAppVersion() {
        if (currentInstruction && currentInstruction.version) return currentInstruction.version;
        return '3.2.1';
    }

    function transitionToStore() {
        if (isAnimating) return;
        isAnimating = true;
        
        platformScreen.style.transition = 'opacity 0.5s cubic-bezier(0.2, 0.9, 0.4, 1.1), transform 0.5s cubic-bezier(0.2, 0.9, 0.4, 1.1), filter 0.5s ease';
        platformScreen.style.opacity = '0';
        platformScreen.style.transform = 'scale(0.96) translateY(-15px)';
        platformScreen.style.filter = 'blur(12px)';
        
        setTimeout(() => {
            platformScreen.style.display = 'none';
            platformScreen.classList.add('hidden');
            platformScreen.style.transform = '';
            platformScreen.style.filter = '';
            platformScreen.style.opacity = '';
            
            storeView.style.display = 'flex';
            storeView.style.opacity = '0';
            storeView.style.transform = 'scale(0.96) translateY(20px)';
            storeView.style.filter = 'blur(12px)';
            storeView.style.transition = 'none';
            void storeView.offsetHeight;
            
            storeView.style.transition = 'opacity 0.6s cubic-bezier(0.2, 0.9, 0.4, 1.2), transform 0.6s cubic-bezier(0.2, 0.9, 0.4, 1.2), filter 0.6s ease';
            storeView.style.opacity = '1';
            storeView.style.transform = 'scale(1) translateY(0)';
            storeView.style.filter = 'blur(0px)';
            storeView.classList.add('visible');
            
            isAnimating = false;
        }, 500);
    }

    function transitionToPlatform() {
        if (isAnimating) return;
        isAnimating = true;
        
        storeView.style.transition = 'opacity 0.5s cubic-bezier(0.2, 0.9, 0.4, 1.1), transform 0.5s cubic-bezier(0.2, 0.9, 0.4, 1.1), filter 0.5s ease';
        storeView.style.opacity = '0';
        storeView.style.transform = 'scale(0.96) translateY(20px)';
        storeView.style.filter = 'blur(12px)';
        
        setTimeout(() => {
            storeView.style.display = 'none';
            storeView.classList.remove('visible');
            storeView.style.transform = '';
            storeView.style.filter = '';
            storeView.style.opacity = '';
            
            platformScreen.style.display = 'flex';
            platformScreen.style.opacity = '0';
            platformScreen.style.transform = 'scale(0.96) translateY(-15px)';
            platformScreen.style.filter = 'blur(12px)';
            platformScreen.style.transition = 'none';
            void platformScreen.offsetHeight;
            
            platformScreen.style.transition = 'opacity 0.6s cubic-bezier(0.2, 0.9, 0.4, 1.2), transform 0.6s cubic-bezier(0.2, 0.9, 0.4, 1.2), filter 0.6s ease';
            platformScreen.style.opacity = '1';
            platformScreen.style.transform = 'scale(1) translateY(0)';
            platformScreen.style.filter = 'blur(0px)';
            platformScreen.classList.remove('hidden');
            
            isAnimating = false;
        }, 500);
    }

    async function updateUI() {
        if (!state.selectedOS) {
            if (!platformScreen.classList.contains('hidden')) return;
            transitionToPlatform();
            return;
        }

        const osData = appData[state.selectedOS];
        appName.textContent = osData.title;
        appShortDesc.textContent = osData.shortDesc;

        currentInstruction = await loadInstruction(state.selectedOS);
        let desc = osData.fullDesc;
        if (currentInstruction?.desc) {
            const fetched = await loadDescription(state.selectedOS, currentInstruction.desc);
            if (fetched) desc = fetched;
        }
        fullDesc.textContent = desc;
        requestAnimationFrame(() => requestAnimationFrame(() => setupDescriptionExpand()));

        permissionsList.innerHTML = osData.permissions.map(p => `<div class="permission-item"><i class="fas fa-check-circle"></i>${p}</div>`).join('');

        const version = getAppVersion();
        let fileName = '';
        if (currentInstruction?.app) {
            if (state.selectedOS === 'Windows') fileName = state.selectedFormat === 'exe' ? currentInstruction.exe : currentInstruction.zip;
            else fileName = currentInstruction.app;
        }
        if (!fileName) {
            fileName = state.selectedOS === 'Windows' ? (state.selectedFormat === 'exe' ? `dynamic-browser-setup-${version}.exe` : `dynamic-browser-portable-${version}.zip`) : `dynamic-browser-${version}.apk`;
        }
        const size = osData.sizes[state.selectedFormat] || '';
        currentFileName = fileName;
        currentFileSize = size;

        if (state.selectedOS === 'Windows') {
            formatSelector.style.display = 'flex';
            document.querySelectorAll('.format-chip').forEach(c => c.classList.remove('active'));
            const activeChip = document.querySelector(`.format-chip[data-format="${state.selectedFormat}"]`);
            if (activeChip) activeChip.classList.add('active');
            installMeta.textContent = `v${version} · ${osData.sizes[state.selectedFormat]}`;
        } else {
            formatSelector.style.display = 'none';
            state.selectedFormat = 'apk';
            installMeta.textContent = `v${version} · ${osData.sizes.apk}`;
        }
        updateFileDisplay();

        let imagesObj = currentInstruction?.Images || null;
        const screenshots = await loadScreenshots(state.selectedOS, imagesObj);
        renderScreenshots(screenshots);

        if (platformScreen.classList.contains('hidden')) return;
        transitionToStore();
    }

    platformCards.forEach(card => {
        card.addEventListener('click', () => {
            const os = card.dataset.os;
            if (state.selectedOS === os) return;
            state.selectedOS = os;
            state.selectedFormat = appData[os].defaultFormat;
            updateUI();
        });
    });

    backBtn.addEventListener('click', () => {
        state.selectedOS = null;
        currentInstruction = null;
        currentFileName = '';
        updateUI();
    });

    formatSelector.addEventListener('click', e => {
        if (state.selectedOS !== 'Windows') return;
        const chip = e.target.closest('.format-chip');
        if (!chip) return;
        state.selectedFormat = chip.dataset.format;
        updateUI();
    });

    btnInstall.addEventListener('click', () => {
        if (!state.selectedOS || !currentFileName) return;
        const link = `https://dynamicbrowser.app/dl/${currentFileName}`;
        showToast(`Загрузка ${currentFileName} (${currentFileSize}) началась!`);
        const a = document.createElement('a');
        a.href = link;
        a.download = currentFileName;
        a.style.display = 'none';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    });

    function showToast(msg) {
        const toastEl = document.getElementById('toast');
        document.getElementById('toastMessage').textContent = msg;
        toastEl.classList.add('visible');
        clearTimeout(toastEl._timeout);
        toastEl._timeout = setTimeout(() => toastEl.classList.remove('visible'), 3000);
    }

    document.addEventListener('keydown', e => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
            e.preventDefault();
            btnInstall.click();
        }
    });

    const privacyLink = document.getElementById('privacyLink');
    const privacyModal = document.getElementById('privacyModal');
    const modalClose = document.getElementById('modalClose');
    const modalBody = document.getElementById('modalBody');

    function loadPrivacy() {
        fetch('POLITICS.txt')
            .then(r => r.ok ? r.text() : Promise.reject())
            .then(t => {
                const ps = t.split('\n\n').filter(p => p.trim());
                modalBody.innerHTML = ps.map(p => `<p>${p.replace(/\n/g, '<br>')}</p>`).join('');
            })
            .catch(() => modalBody.innerHTML = '<p>Не удалось загрузить политику.</p>');
    }
    loadPrivacy();

    privacyLink.addEventListener('click', e => {
        e.preventDefault();
        privacyModal.classList.add('modal--visible');
    });
    modalClose.addEventListener('click', () => privacyModal.classList.remove('modal--visible'));
    privacyModal.addEventListener('click', e => { if (e.target === privacyModal) privacyModal.classList.remove('modal--visible'); });
    document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && privacyModal.classList.contains('modal--visible')) privacyModal.classList.remove('modal--visible');
    });

    updateUI();
</script>
</body>
</html>
