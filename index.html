<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Dynamic Browser — Professional Installer</title>
    <link rel="icon" href="Logo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        :root {
            --bg: #000000;
            --surface-1: rgba(0, 0, 0, 0.6);
            --surface-2: rgba(0, 0, 0, 0.75);
            --border-light: rgba(255, 255, 255, 0.08);
            --border-glow: rgba(255, 255, 255, 0.25);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --text-tertiary: rgba(255, 255, 255, 0.5);
            --radius-xl: 36px;
            --radius-lg: 28px;
            --radius-md: 20px;
            --shadow-premium: 0 20px 40px -12px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.03);
            --transition: 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
            overflow-x: hidden;
        }
        canvas#webgl-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            opacity: 0.9;
        }
        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 1280px;
            margin: 0 auto;
        }
        .screen-selector {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 70vh;
            gap: 48px;
            transition: opacity 0.5s var(--transition), transform 0.5s var(--transition);
        }
        .screen-selector.hidden {
            display: none;
        }
        .badge-premium {
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(12px);
            padding: 10px 28px;
            border-radius: 60px;
            font-weight: 600;
            letter-spacing: 0.1em;
            font-size: 0.8rem;
            border: 1px solid var(--border-light);
            color: var(--text-secondary);
        }
        .platform-grid {
            display: flex;
            gap: 36px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .platform-card {
            background: var(--surface-1);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-xl);
            padding: 32px 44px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s var(--transition);
            min-width: 210px;
            box-shadow: var(--shadow-premium);
        }
        .platform-card i {
            font-size: 3.4rem;
            margin-bottom: 16px;
            display: block;
            filter: drop-shadow(0 0 6px rgba(255,255,255,0.2));
        }
        .platform-card span {
            font-weight: 700;
            font-size: 1.5rem;
            letter-spacing: -0.01em;
        }
        .platform-card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: var(--border-glow);
            background: rgba(0,0,0,0.8);
            box-shadow: 0 30px 45px -20px black, 0 0 0 1px rgba(255,255,255,0.15);
        }
        .screen-detail {
            display: none;
            flex-direction: column;
            gap: 28px;
            animation: slideUp 0.7s var(--transition);
        }
        .screen-detail.visible {
            display: flex;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); filter: blur(8px);}
            to { opacity: 1; transform: translateY(0); filter: blur(0);}
        }
        .nav-row {
            display: flex;
            align-items: center;
        }
        .btn-back {
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-light);
            border-radius: 60px;
            padding: 8px 24px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: 0.25s;
        }
        .btn-back:hover {
            background: rgba(0,0,0,0.8);
            border-color: var(--border-glow);
            transform: translateX(-6px);
        }
        .hero-panel {
            background: var(--surface-1);
            backdrop-filter: blur(20px);
            border-radius: var(--radius-xl);
            padding: 32px;
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-premium);
            display: flex;
            gap: 32px;
            flex-wrap: wrap;
        }
        .app-icon-lg {
            width: 120px;
            height: 120px;
            border-radius: 28px;
            object-fit: cover;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
        }
        .app-details {
            flex: 1;
        }
        .app-title {
            font-size: 2.3rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #fff 20%, #b0b0b0 80%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 6px;
        }
        .app-sub {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }
        .action-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 20px;
            margin-bottom: 16px;
        }
        .format-switch {
            background: rgba(0,0,0,0.5);
            border-radius: 100px;
            padding: 6px;
            display: flex;
            gap: 8px;
        }
        .format-btn {
            background: transparent;
            border: none;
            padding: 8px 24px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: 0.2s;
        }
        .format-btn.active {
            background: rgba(255,255,255,0.2);
            color: white;
            box-shadow: 0 0 12px rgba(255,255,255,0.2);
        }
        .btn-download {
            background: linear-gradient(135deg, rgba(255,255,255,0.2), rgba(255,255,255,0.05));
            border: 1px solid rgba(255,255,255,0.5);
            padding: 12px 36px;
            border-radius: 60px;
            font-weight: 800;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: 0.3s;
            backdrop-filter: blur(8px);
        }
        .btn-download:hover {
            transform: translateY(-4px);
            background: rgba(255,255,255,0.3);
            border-color: white;
            box-shadow: 0 18px 30px -12px black;
        }
        .version-tag {
            background: rgba(0,0,0,0.6);
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 500;
            margin-left: 6px;
        }
        .file-meta-bar {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: rgba(0,0,0,0.5);
            border-radius: 60px;
            padding: 5px 18px;
            margin-top: 12px;
            font-size: 0.8rem;
        }
        .file-toggle {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 0.7rem;
            text-decoration: underline;
            cursor: pointer;
        }
        .file-expand {
            display: none;
            background: rgba(0,0,0,0.7);
            border-radius: 20px;
            padding: 10px 16px;
            margin-top: 8px;
            font-size: 0.75rem;
            word-break: break-all;
        }
        .glass-card {
            background: var(--surface-1);
            backdrop-filter: blur(20px);
            border-radius: var(--radius-lg);
            padding: 24px 28px;
            border: 1px solid var(--border-light);
        }
        .card-header {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--text-tertiary);
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .screenshot-strip {
            display: flex;
            overflow-x: auto;
            gap: 16px;
            padding-bottom: 8px;
        }
        .screenshot-strip img {
            height: 220px;
            border-radius: 20px;
            flex-shrink: 0;
            border: 1px solid rgba(255,255,255,0.2);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .screenshot-strip img:hover {
            transform: scale(1.02);
            border-color: white;
        }
        .desc-wrapper {
            overflow: hidden;
            transition: max-height 0.45s var(--transition);
        }
        .desc-text {
            color: var(--text-secondary);
            line-height: 1.6;
            font-size: 0.95rem;
        }
        .expand-btn {
            background: none;
            border: none;
            color: white;
            font-weight: 500;
            margin-top: 12px;
            cursor: pointer;
            font-size: 0.8rem;
            opacity: 0.7;
        }
        .perm-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .perm-item {
            display: flex;
            align-items: center;
            gap: 14px;
            color: var(--text-secondary);
            font-size: 0.9rem;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .footer {
            text-align: center;
            padding: 24px 0 12px;
            font-size: 0.7rem;
            color: var(--text-tertiary);
        }
        .footer a {
            color: white;
            margin: 0 10px;
            text-decoration: none;
        }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(24px);
            border-radius: 60px;
            padding: 12px 28px;
            display: flex;
            gap: 12px;
            align-items: center;
            font-weight: 600;
            z-index: 300;
            transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.2);
            border: 1px solid rgba(255,255,255,0.3);
        }
        .toast.visible {
            transform: translateX(-50%) translateY(0);
        }
        .modal, .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(28px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: 0.3s;
        }
        .modal.visible, .lightbox.visible {
            opacity: 1;
            visibility: visible;
        }
        .modal-card {
            background: rgba(0,0,0,0.96);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 48px;
            max-width: 560px;
            width: 90%;
            padding: 28px;
            position: relative;
            transform: scale(0.95);
            transition: transform 0.3s;
        }
        .modal.visible .modal-card {
            transform: scale(1);
        }
        .lightbox-img {
            max-width: 90vw;
            max-height: 85vh;
            border-radius: 28px;
        }
        .close-icon {
            position: absolute;
            top: 20px;
            right: 24px;
            font-size: 32px;
            background: none;
            border: none;
            color: white;
            cursor: pointer;
        }
        @media (max-width: 720px) {
            body { padding: 20px; }
            .hero-panel { flex-direction: column; align-items: center; text-align: center; }
            .action-row { justify-content: center; }
            .app-title { font-size: 1.8rem; }
            .platform-card { padding: 24px 32px; min-width: 160px; }
        }
    </style>
</head>

<script type="module">
import * as THREE from 'three';

let scene, camera, renderer, waveMesh, stars, geometry, timeVal = 0, animId = null, glLost = false;
const canvasEl = document.getElementById('webgl-bg');
const isMobile = window.innerWidth < 768;
const segCount = isMobile ? 24 : 42;
const starCountVal = isMobile ? 280 : 650;

function initWebGL() {
    if (renderer) { if (animId) cancelAnimationFrame(animId); if (renderer.domElement?.parentNode) renderer.domElement.remove(); }
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);
    scene.fog = new THREE.FogExp2(0x000000, 0.008);
    camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(11, 7, 13);
    camera.lookAt(0, 0.3, 0);
    renderer = new THREE.WebGLRenderer({ canvas: canvasEl, alpha: false, antialias: !isMobile, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    const maxPx = isMobile ? 1 : Math.min(window.devicePixelRatio, 2);
    renderer.setPixelRatio(maxPx);
    canvasEl.addEventListener('webglcontextlost', (e) => { e.preventDefault(); glLost = true; if (animId) cancelAnimationFrame(animId); animId = null; });
    canvasEl.addEventListener('webglcontextrestored', () => { glLost = false; initWebGL(); });
    
    const widthSeg = segCount, heightSeg = segCount, planeW = 18, planeH = 18;
    geometry = new THREE.PlaneGeometry(planeW, planeH, widthSeg, heightSeg);
    geometry.rotateX(-Math.PI / 2);
    const material = new THREE.MeshStandardMaterial({ color: 0xffffff, wireframe: true, emissive: 0x111111, roughness: 0.5, metalness: 0.7 });
    waveMesh = new THREE.Mesh(geometry, material);
    scene.add(waveMesh);
    
    const ambient = new THREE.AmbientLight(0x222222);
    scene.add(ambient);
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
    dirLight.position.set(5, 9, 6);
    scene.add(dirLight);
    const backLight = new THREE.PointLight(0x555555, 0.4);
    backLight.position.set(-2, 3, 5);
    scene.add(backLight);
    const gridHelper = new THREE.GridHelper(26, 20, 0xffffff, 0x3a3a3a);
    gridHelper.position.y = -2.0;
    gridHelper.material.transparent = true;
    gridHelper.material.opacity = 0.15;
    scene.add(gridHelper);
    
    const starGeo = new THREE.BufferGeometry();
    const starPositions = new Float32Array(starCountVal * 3);
    for (let i = 0; i < starCountVal; i++) {
        starPositions[i*3] = (Math.random() - 0.5) * 200;
        starPositions[i*3+1] = (Math.random() - 0.5) * 60;
        starPositions[i*3+2] = (Math.random() - 0.5) * 80 - 40;
    }
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: isMobile ? 0.05 : 0.07, transparent: true, opacity: 0.6 }));
    scene.add(stars);
    animate();
}

function animateWave() {
    if (!geometry || glLost) return;
    timeVal += 0.016;
    const posAttr = geometry.attributes.position;
    const array = posAttr.array;
    const wSeg = segCount, hSeg = segCount, pW = 18, pH = 18;
    for (let i = 0; i <= wSeg; i++) {
        const x = (i / wSeg - 0.5) * pW;
        for (let j = 0; j <= hSeg; j++) {
            const z = (j / hSeg - 0.5) * pH;
            const idx = (j * (wSeg + 1) + i) * 3;
            const y1 = Math.sin(x * 0.9 + timeVal) * Math.cos(z * 0.75 + timeVal * 0.65) * 0.55;
            const y2 = Math.sin(x * 1.6 - timeVal * 1.1) * 0.25;
            const y3 = Math.cos(z * 1.4 + timeVal * 0.85) * 0.25;
            const y4 = Math.sin((x * 1.2 + z * 1.2) * 0.7 + timeVal * 1.3) * 0.2;
            array[idx + 1] = y1 + y2 + y3 + y4;
        }
    }
    posAttr.needsUpdate = true;
    geometry.computeVertexNormals();
}

function animate() {
    if (!glLost) {
        animateWave();
        if (stars) { stars.rotation.y += 0.0004; stars.rotation.x += 0.0002; }
        if (camera) camera.lookAt(0, 0.4, 0);
        if (renderer && scene && camera) renderer.render(scene, camera);
    }
    animId = requestAnimationFrame(animate);
}

window.addEventListener('resize', () => {
    if (camera) { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); }
    if (renderer) renderer.setSize(window.innerWidth, window.innerHeight);
});
document.addEventListener('visibilitychange', () => {
    if (document.hidden) { if (animId) cancelAnimationFrame(animId); animId = null; }
    else if (!animId && !glLost) animate();
});
initWebGL();

const appDatabase = {
    Windows: {
        title: 'Dynamic Browser for Windows',
        short: 'Революционный веб-серфер с ИИ-защитой.',

        formats: ['exe', 'zip'],
        sizes: { exe: '48.2 MB', zip: '32.5 MB' },
        defaultFormat: 'exe',
        permissions: ['Доступ к сети', 'Управление файлами (сохранение загрузок)', 'Геолокация (опционально)']
    },
    Android: {
        title: 'Dynamic Browser for Android',
        short: 'Лёгкий, быстрый, конфиденциальный.',
        fullDesc: 'Идеален для мобильного сёрфинга: экономный трафик, ночная тема, встроенный загрузчик, режим инкогнито и защита от фишинга. Занимает минимум ресурсов.',
        formats: ['apk'],
        sizes: { apk: '28.3 MB' },
        defaultFormat: 'apk',
        permissions: ['Интернет', 'Хранилище', 'Геопозиция', 'Уведомления']
    }
};

let selectedOS = null, currentFormat = 'exe', instructionCache = null, currentFileName = '', currentFileSize = '', lastDescContent = null;
const platformScreen = document.getElementById('screenPlatform'), detailScreen = document.getElementById('screenDetail');
const appTitleSpan = document.getElementById('appTitle'), appSubSpan = document.getElementById('appSubtitle'), descSpan = document.getElementById('descText'), permContainer = document.getElementById('permList');
const formatSwitch = document.getElementById('formatSwitch'), downloadBtn = document.getElementById('downloadBtn'), versionMetaSpan = document.getElementById('versionMeta');
const fileMetaBar = document.getElementById('fileMetaBar'), shortFileSpan = document.getElementById('shortFileName'), toggleFileBtn = document.getElementById('toggleFileBtn'), fileExpandDiv = document.getElementById('fileExpand');
const screenshotStripDiv = document.getElementById('screenshotStrip'), descWrapDiv = document.getElementById('descWrap'), expandDescBtn = document.getElementById('expandDescBtn');
const backButton = document.getElementById('backBtn'), toastDiv = document.getElementById('toast'), toastMsgSpan = document.getElementById('toastMsg');
const privacyModal = document.getElementById('privacyModal'), privacyContentDiv = document.getElementById('privacyContent'), privacyLink = document.getElementById('privacyLink'), closePrivacyBtn = document.getElementById('closePrivacyBtn');
const lightboxDiv = document.getElementById('lightbox'), lightboxImg = document.getElementById('lightboxImg'), closeLightboxBtn = document.getElementById('closeLightboxBtn');

function showToastMessage(msg) { toastMsgSpan.innerText = msg; toastDiv.classList.add('visible'); clearTimeout(window.toastTimer); window.toastTimer = setTimeout(() => toastDiv.classList.remove('visible'), 2700); }
function truncName(name, len=40) { return name.length <= len ? name : name.slice(0,len)+'…'; }
function updateFileSection() { if (!currentFileName) { fileMetaBar.style.display = 'none'; fileExpandDiv.classList.remove('visible'); return; } fileMetaBar.style.display = 'inline-flex'; shortFileSpan.innerText = truncName(currentFileName); fileExpandDiv.innerText = `${currentFileName} (${currentFileSize})`; if (currentFileName.length <= 40) toggleFileBtn.style.display = 'none'; else { toggleFileBtn.style.display = 'inline-block'; fileExpandDiv.classList.remove('visible'); } }
toggleFileBtn.addEventListener('click', () => { if (fileExpandDiv.classList.contains('visible')) { fileExpandDiv.classList.remove('visible'); toggleFileBtn.innerText = 'подробнее'; } else { fileExpandDiv.classList.add('visible'); toggleFileBtn.innerText = 'свернуть'; } });
function resetDesc() { descWrapDiv.style.maxHeight = 'none'; expandDescBtn.style.display = 'none'; expandDescBtn.innerText = 'Показать полностью'; expandDescBtn.dataset.expanded = 'false'; }
function setupDescExpand() { if (descSpan.innerText === lastDescContent) return; lastDescContent = descSpan.innerText; resetDesc(); requestAnimationFrame(() => { const lineH = parseFloat(getComputedStyle(descSpan).lineHeight); if (!lineH) return; const maxH = lineH * 5; if (descSpan.scrollHeight > maxH + 3) { descWrapDiv.style.maxHeight = maxH + 'px'; expandDescBtn.style.display = 'inline-block'; expandDescBtn.dataset.expanded = 'false'; expandDescBtn.innerText = 'Показать полностью'; } else { descWrapDiv.style.maxHeight = 'none'; expandDescBtn.style.display = 'none'; } }); }
expandDescBtn.addEventListener('click', () => { const expanded = expandDescBtn.dataset.expanded === 'true'; const lineH = parseFloat(getComputedStyle(descSpan).lineHeight); if (expanded) { descWrapDiv.style.maxHeight = (lineH * 5) + 'px'; expandDescBtn.innerText = 'Показать полностью'; expandDescBtn.dataset.expanded = 'false'; } else { descWrapDiv.style.maxHeight = descSpan.scrollHeight + 'px'; expandDescBtn.innerText = 'Свернуть'; expandDescBtn.dataset.expanded = 'true'; } });
async function fetchJSON(url) { try { const r = await fetch(url); return r.ok ? await r.json() : null; } catch { return null; } }
async function fetchTextFile(url) { try { const r = await fetch(url); return r.ok ? await r.text() : null; } catch { return null; } }
async function loadInstruction(os) { return await fetchJSON(`${os}/instruction.json`); }
async function loadScreenshots(base, imgMap) { if (!imgMap) return []; const urls = []; for (const key of Object.keys(imgMap).sort((a,b)=> (parseInt(a.match(/\d+/)?.[0]||0) - parseInt(b.match(/\d+/)?.[0]||0)))) { const src = `${base}/${imgMap[key]}`; const testImg = new Image(); await new Promise(res => { testImg.onload = () => res(true); testImg.onerror = () => res(false); testImg.src = src; }); if (testImg.complete && testImg.naturalWidth) urls.push(src); } return urls; }
function renderScreenshotList(imgs) { screenshotStripDiv.innerHTML = imgs.length ? imgs.map(src => `<img src="${src}" class="screenshot-preview" loading="lazy">`).join('') : '<div style="color:rgba(255,255,255,0.4);">Нет скриншотов</div>'; document.querySelectorAll('.screenshot-preview').forEach(img => img.addEventListener('click', () => { lightboxImg.src = img.src; lightboxDiv.classList.add('visible'); })); }

async function refreshDetailUI() {
    if (!selectedOS) {
        if (!platformScreen.classList.contains('hidden')) return;
        detailScreen.classList.remove('visible');
        platformScreen.classList.remove('hidden');
        platformScreen.style.opacity = '1';
        platformScreen.style.transform = 'none';
        return;
    }
    const osData = appDatabase[selectedOS];
    appTitleSpan.innerText = osData.title;
    appSubSpan.innerText = osData.short;
    instructionCache = await loadInstruction(selectedOS);
    let description = osData.fullDesc;
    if (instructionCache?.desc) { const fetchedDesc = await fetchTextFile(`${selectedOS}/${instructionCache.desc}`); if (fetchedDesc) description = fetchedDesc; }
    descSpan.innerText = description;
    permContainer.innerHTML = osData.permissions.map(p => `<div class="perm-item"><i class="fas fa-shield-alt"></i> ${p}</div>`).join('');
    const appVersion = instructionCache?.version || '3.2.1';
    let fileName = '';
    if (instructionCache?.app) {
        if (selectedOS === 'Windows') fileName = currentFormat === 'exe' ? instructionCache.exe : instructionCache.zip;
        else fileName = instructionCache.app;
    }
    if (!fileName) fileName = selectedOS === 'Windows' ? (currentFormat === 'exe' ? `dynamic-browser-setup-${appVersion}.exe` : `dynamic-browser-portable-${appVersion}.zip`) : `dynamic-browser-${appVersion}.apk`;
    const fileSize = osData.sizes[currentFormat] || '';
    currentFileName = fileName; currentFileSize = fileSize;
    if (selectedOS === 'Windows') {
        formatSwitch.style.display = 'flex';
        document.querySelectorAll('.format-btn').forEach(btn => btn.classList.remove('active'));
        const activeFormatBtn = document.querySelector(`.format-btn[data-format="${currentFormat}"]`);
        if (activeFormatBtn) activeFormatBtn.classList.add('active');
        versionMetaSpan.innerText = `v${appVersion} · ${osData.sizes[currentFormat]}`;
    } else {
        formatSwitch.style.display = 'none';
        currentFormat = 'apk';
        versionMetaSpan.innerText = `v${appVersion} · ${osData.sizes.apk}`;
    }
    updateFileSection();
    const screens = await loadScreenshots(selectedOS, instructionCache?.Images || null);
    renderScreenshotList(screens);
    setupDescExpand();
    if (!platformScreen.classList.contains('hidden')) {
        platformScreen.style.transition = 'opacity 0.5s ease, transform 0.5s';
        platformScreen.style.opacity = '0';
        platformScreen.style.transform = 'scale(0.96) translateY(-12px)';
        setTimeout(() => {
            platformScreen.classList.add('hidden');
            detailScreen.classList.add('visible');
            detailScreen.style.animation = 'none';
            detailScreen.offsetHeight;
            detailScreen.style.animation = 'slideUp 0.6s ease';
        }, 450);
    }
}

document.querySelectorAll('.platform-card').forEach(card => {
    card.addEventListener('click', () => {
        const os = card.dataset.os;
        if (selectedOS === os) return;
        selectedOS = os;
        currentFormat = appDatabase[os].defaultFormat;
        refreshDetailUI();
    });
});
backButton.addEventListener('click', () => {
    if (!selectedOS) return;
    detailScreen.style.transition = 'opacity 0.4s, transform 0.4s';
    detailScreen.style.opacity = '0';
    detailScreen.style.transform = 'translateY(20px)';
    setTimeout(() => {
        detailScreen.classList.remove('visible');
        detailScreen.style.opacity = '';
        detailScreen.style.transform = '';
        platformScreen.classList.remove('hidden');
        platformScreen.style.opacity = '0';
        platformScreen.style.transform = 'translateY(-12px)';
        platformScreen.style.transition = 'none';
        platformScreen.offsetHeight;
        platformScreen.style.transition = 'opacity 0.5s ease, transform 0.5s';
        platformScreen.style.opacity = '1';
        platformScreen.style.transform = 'none';
        selectedOS = null;
    }, 350);
});
formatSwitch.addEventListener('click', (e) => {
    if (selectedOS !== 'Windows') return;
    const btn = e.target.closest('.format-btn');
    if (btn && btn.dataset.format) {
        currentFormat = btn.dataset.format;
        refreshDetailUI();
    }
});
downloadBtn.addEventListener('click', () => {
    if (!selectedOS || !currentFileName) return;
    showToastMessage(`Начинаем загрузку ${currentFileName} (${currentFileSize})`);
    const a = document.createElement('a');
    a.href = `https://dynamicbrowser.app/dl/${currentFileName}`;
    a.download = currentFileName;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
});
privacyLink.addEventListener('click', (e) => {
    e.preventDefault();
    fetch('POLITICS.txt')
        .then(r => r.ok ? r.text() : Promise.reject())
        .then(txt => { const paragraphs = txt.split('\n\n').filter(p => p.trim()); privacyContentDiv.innerHTML = paragraphs.map(p => `<p style="margin-bottom:14px;">${p.replace(/\n/g, '<br>')}</p>`).join(''); })
        .catch(() => privacyContentDiv.innerHTML = '<p>Политика конфиденциальности временно недоступна.</p>');
    privacyModal.classList.add('visible');
});
closePrivacyBtn.addEventListener('click', () => privacyModal.classList.remove('visible'));
privacyModal.addEventListener('click', (e) => { if (e.target === privacyModal) privacyModal.classList.remove('visible'); });
closeLightboxBtn.addEventListener('click', () => { lightboxDiv.classList.remove('visible'); lightboxImg.src = ''; });
lightboxDiv.addEventListener('click', (e) => { if (e.target === lightboxDiv) { lightboxDiv.classList.remove('visible'); lightboxImg.src = ''; } });
refreshDetailUI();
</script>
</body>
</html>
