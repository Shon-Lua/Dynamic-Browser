<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Dynamic Installer</title>
    <link rel="icon" href="Logo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        :root {
            --bg-deep: #000000;
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-border-glow: rgba(255, 255, 255, 0.3);
            --card-bg: rgba(0, 0, 0, 0.65);
            --text-main: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.7);
            --text-faint: rgba(255, 255, 255, 0.45);
            --radius-card: 32px;
            --transition-smooth: cubic-bezier(0.2, 0.9, 0.4, 1.1);
            --shadow-premium: 0 20px 35px -12px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.03);
        }
        html {
            height: 100%;
            font-size: 16px;
            color-scheme: dark;
            scrollbar-color: rgba(255,255,255,0.25) transparent;
            scrollbar-width: thin;
        }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 28px 24px;
            position: relative;
            overflow-x: hidden;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.25);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255,255,255,0.45);
        }
        canvas#wave-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            filter: brightness(1.1) contrast(1.3);
        }
        .app-wrapper {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }
        .platform-stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 70vh;
            gap: 56px;
            transition: opacity 0.6s var(--transition-smooth), transform 0.6s var(--transition-smooth);
        }
        .platform-stage.hidden {
            display: none;
        }
        .hero-icon {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #fff 20%, #aaa 80%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-align: center;
        }
        .hero-icon i {
            background: none;
            -webkit-background-clip: unset;
            background-clip: unset;
            color: white;
            font-size: 2.8rem;
            margin-bottom: 16px;
            display: block;
        }
        .platform-selector {
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .platform-pill {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 80px;
            padding: 20px 48px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.4s var(--transition-smooth);
            min-width: 220px;
            box-shadow: var(--shadow-premium);
        }
        .platform-pill i {
            font-size: 3rem;
            transition: transform 0.2s;
        }
        .platform-pill span {
            font-weight: 700;
            font-size: 1.4rem;
            letter-spacing: -0.01em;
        }
        .platform-pill:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: var(--glass-border-glow);
            background: rgba(0, 0, 0, 0.8);
            box-shadow: 0 30px 40px -20px black, 0 0 0 1px rgba(255,255,255,0.2);
        }
        .platform-pill:active {
            transform: scale(0.98);
        }
        .store-dashboard {
            display: none;
            flex-direction: column;
            gap: 28px;
            animation: fadeSlideUp 0.7s var(--transition-smooth);
        }
        .store-dashboard.visible {
            display: flex;
        }
        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(30px); filter: blur(6px);}
            to { opacity: 1; transform: translateY(0); filter: blur(0);}
        }
        .nav-back {
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(12px);
            width: fit-content;
            border-radius: 60px;
            padding: 8px 24px;
            font-weight: 500;
            border: 1px solid var(--glass-border);
            cursor: pointer;
            transition: all 0.25s;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }
        .nav-back:hover {
            background: rgba(0,0,0,0.8);
            border-color: var(--glass-border-glow);
            transform: translateX(-6px);
        }
        .hero-product {
            display: flex;
            gap: 32px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border-radius: var(--radius-card);
            padding: 32px;
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-premium);
            flex-wrap: wrap;
        }
        .product-icon {
            width: 120px;
            height: 120px;
            border-radius: 28px;
            object-fit: cover;
            background: #0c0c0c;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 15px 30px rgba(0,0,0,0.6);
        }
        .product-info {
            flex: 1;
        }
        .product-title {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #fff, #c0c0c0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 8px;
        }
        .product-sub {
            font-size: 1rem;
            color: var(--text-dim);
            margin-bottom: 24px;
        }
        .action-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 20px;
            margin-bottom: 16px;
        }
        .format-group {
            display: flex;
            gap: 12px;
            background: rgba(0,0,0,0.5);
            padding: 6px;
            border-radius: 100px;
        }
        .format-option {
            background: transparent;
            border: none;
            padding: 8px 24px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-dim);
            cursor: pointer;
            transition: all 0.2s;
        }
        .format-option.active {
            background: rgba(255,255,255,0.2);
            color: white;
            box-shadow: 0 0 10px rgba(255,255,255,0.2);
        }
        .download-prime {
            background: linear-gradient(145deg, rgba(255,255,255,0.2), rgba(255,255,255,0.05));
            border: 1px solid rgba(255,255,255,0.5);
            padding: 14px 36px;
            border-radius: 60px;
            font-weight: 800;
            font-size: 1rem;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: 0.3s;
            backdrop-filter: blur(10px);
        }
        .download-prime:hover {
            transform: translateY(-4px);
            background: rgba(255,255,255,0.3);
            border-color: white;
            box-shadow: 0 20px 30px -12px black;
        }
        .glass-panel {
            background: var(--card-bg);
            backdrop-filter: blur(18px);
            border-radius: var(--radius-card);
            padding: 24px 28px;
            border: 1px solid var(--glass-border);
            transition: all 0.2s;
        }
        .panel-header {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--text-faint);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .screenshot-strip {
            display: flex;
            overflow-x: auto;
            gap: 18px;
            padding: 6px;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.25) transparent;
        }
        .screenshot-strip img {
            height: 240px;
            border-radius: 20px;
            flex-shrink: 0;
            border: 1px solid rgba(255,255,255,0.2);
            cursor: pointer;
            transition: outline-color 0.2s ease;
            outline: 2px solid transparent;
            outline-offset: 2px;
        }
        .screenshot-strip img:hover {
            outline-color: white;
        }
        @media (max-width: 720px) {
            .screenshot-strip {
                flex-direction: column;
                overflow-x: visible;
                align-items: center;
            }
            .screenshot-strip img {
                height: auto;
                width: 100%;
                max-width: 100%;
                object-fit: contain;
                border-radius: 20px;
            }
        }
        .desc-wrapper {
            overflow: hidden;
            transition: max-height 0.45s var(--transition-smooth);
        }
        .desc-text {
            color: var(--text-dim);
            line-height: 1.6;
            font-size: 0.95rem;
        }
        .expand-trigger {
            background: none;
            border: none;
            color: white;
            font-weight: 600;
            font-size: 0.8rem;
            margin-top: 12px;
            cursor: pointer;
            opacity: 0.7;
        }
        .permission-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .permission-row {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 0.9rem;
            color: var(--text-dim);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding: 8px 0;
        }
        .footer-links {
            text-align: center;
            padding: 24px 0 12px;
            font-size: 0.7rem;
            color: var(--text-faint);
        }
        .footer-links a {
            color: white;
            margin: 0 10px;
            text-decoration: none;
        }
        .toast-message {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(90px);
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(28px);
            padding: 12px 28px;
            border-radius: 60px;
            display: flex;
            gap: 12px;
            align-items: center;
            font-weight: 600;
            z-index: 300;
            transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.2);
            border: 1px solid rgba(255,255,255,0.3);
        }
        .toast-message.visible {
            transform: translateX(-50%) translateY(0);
        }
        .modal-privacy, .lightbox-modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(24px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1100;
            opacity: 0;
            visibility: hidden;
            transition: 0.3s;
        }
        .modal-privacy.visible, .lightbox-modal.visible {
            opacity: 1;
            visibility: visible;
        }
        .privacy-card {
            background: rgba(0,0,0,0.96);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 48px;
            max-width: 560px;
            width: 90%;
            padding: 28px;
            position: relative;
            transform: scale(0.95);
            transition: transform 0.3s;
            overflow: hidden;
        }
        .modal-privacy.visible .privacy-card {
            transform: scale(1);
        }
        .privacy-scroll {
            max-height: 60vh;
            overflow-y: auto;
            margin-right: -28px;
            padding-right: 28px;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.25) transparent;
        }
        .privacy-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .privacy-scroll::-webkit-scrollbar-track {
            background: transparent;
        }
        .privacy-scroll::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.25);
            border-radius: 3px;
        }
        .lightbox-img {
            max-width: 90vw;
            max-height: 85vh;
            border-radius: 28px;
            box-shadow: 0 30px 50px black;
        }
        .lightbox-close, .modal-close {
            position: absolute;
            top: 20px;
            right: 28px;
            font-size: 32px;
            background: none;
            border: none;
            color: white;
            cursor: pointer;
        }
        @media (max-width: 720px) {
            .hero-product { flex-direction: column; align-items: center; text-align: center; }
            .action-bar { justify-content: center; }
            .product-title { font-size: 1.8rem; }
            .platform-pill { padding: 16px 32px; min-width: 160px; }
        }
    </style>
</head>
<body>
<canvas id="wave-canvas"></canvas>
<div class="app-wrapper">
    <div class="platform-stage" id="platformStage">
        <div class="hero-icon"><i class="fas fa-bolt"></i><span>DYNAMIC INSTALLER</span></div>
        <div class="platform-selector" id="platformSelector">
            <div class="platform-pill" data-os="Windows"><i class="fab fa-windows"></i><span>Windows</span></div>
            <div class="platform-pill" data-os="Android"><i class="fab fa-android"></i><span>Android</span></div>
        </div>
    </div>
    <div class="store-dashboard" id="storeDashboard">
        <div class="nav-back" id="backBtn"><i class="fas fa-arrow-left"></i> Назад</div>
        <div class="hero-product">
            <img src="Logo.png" alt="Dynamic Browser" class="product-icon" id="appIcon">
            <div class="product-info">
                <div class="product-title" id="appName">Dynamic Browser</div>
                <div class="product-sub" id="appSub"></div>
                <div class="action-bar">
                    <div class="format-group" id="formatGroup" style="display:none">
                        <button class="format-option" data-format="exe">EXE</button>
                        <button class="format-option" data-format="zip">ZIP</button>
                    </div>
                    <button class="download-prime" id="installBtn"><i class="fas fa-download"></i> Скачать</button>
                </div>
            </div>
        </div>
        <div class="glass-panel">
            <div class="panel-header"><i class="fas fa-camera"></i> ГАЛЕРЕЯ</div>
            <div class="screenshot-strip" id="screenshotStrip"></div>
        </div>
        <div class="glass-panel">
            <div class="panel-header"><i class="fas fa-info-circle"></i> ОПИСАНИЕ</div>
            <div class="desc-wrapper" id="descWrap"><div class="desc-text" id="descText"></div></div>
            <button class="expand-trigger" id="expandDescBtn" style="display:none">Показать полностью</button>
        </div>
        <div class="glass-panel">
            <div class="panel-header"><i class="fas fa-shield-alt"></i> РАЗРЕШЕНИЯ</div>
            <div class="permission-list" id="permissionList"></div>
        </div>
        <div class="footer-links">
            © 2026 Dynamic Browser — 
            <a href="#" id="privacyBtn">Политика конфиденциальности</a>
            <a href="https://github.com/Shon-Lua/Dynamic-Browser" target="_blank">GitHub</a>
        </div>
    </div>
</div>
<div class="toast-message" id="toastMsg"><i class="fas fa-check-circle"></i> <span id="toastText"></span></div>
<div class="modal-privacy" id="privacyModal">
    <div class="privacy-card">
        <button class="modal-close" id="closePrivacy">&times;</button>
        <div class="privacy-scroll">
            <div id="privacyContent" style="padding-right:8px;"></div>
        </div>
    </div>
</div>
<div class="lightbox-modal" id="lightboxModal"><button class="lightbox-close" id="closeLightbox">&times;</button><img class="lightbox-img" id="lightboxImg" alt=""></div>

<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.128.0/build/three.module.js" } }</script>
<script type="module">
import * as THREE from 'three';

const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth <= 768;
let scene, camera, renderer, geometry, timeVal = 0, animFrame = null, contextLostFlag = false;
const canvas = document.getElementById('wave-canvas');
let starsFar, starsNear;
let shootingStars = [];
let flashSprites = [];

function initThree() {
    if (renderer) {
        if (animFrame) cancelAnimationFrame(animFrame);
        if (renderer.domElement?.parentNode) renderer.domElement.remove();
    }
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);
    if (!isMobile) scene.fog = new THREE.FogExp2(0x000000, 0.005);
    
    camera = new THREE.PerspectiveCamera(isMobile ? 50 : 42, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(isMobile ? 10 : 11, isMobile ? 6.5 : 7.5, isMobile ? 12 : 13);
    camera.lookAt(0, 0.2, 0);
    
    const pixelRatio = isMobile ? Math.min(window.devicePixelRatio, 1.2) : Math.min(window.devicePixelRatio, 2);
    renderer = new THREE.WebGLRenderer({ canvas, alpha: false, antialias: !isMobile, powerPreference: isMobile ? "low-power" : "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(pixelRatio);
    
    canvas.addEventListener('webglcontextlost', (e) => {
        e.preventDefault();
        contextLostFlag = true;
        if (animFrame) cancelAnimationFrame(animFrame);
        animFrame = null;
    });
    canvas.addEventListener('webglcontextrestored', () => {
        contextLostFlag = false;
        initThree();
    });
    
    const widthSeg = isMobile ? 20 : 50;
    const heightSeg = isMobile ? 20 : 50;
    const planeSize = isMobile ? 16 : 20;
    geometry = new THREE.PlaneGeometry(planeSize, planeSize, widthSeg, heightSeg);
    geometry.rotateX(-Math.PI / 2);
    const positions = geometry.attributes.position.array;
    for (let i = 0; i < positions.length / 3; i++) positions[i*3+1] = 0;
    
    const solidMat = new THREE.MeshStandardMaterial({
        color: 0xcccccc,
        metalness: 0.9,
        roughness: 0.7,
        emissive: 0x000000,
        side: THREE.DoubleSide
    });
    const solidMesh = new THREE.Mesh(geometry, solidMat);
    scene.add(solidMesh);
    
    const wireframeMat = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        wireframe: true,
        emissive: 0x222222,
        roughness: 0.5,
        metalness: 0.8
    });
    const wireframeMesh = new THREE.Mesh(geometry, wireframeMat);
    scene.add(wireframeMesh);
    
    const ambient = new THREE.AmbientLight(0x444444);
    scene.add(ambient);
    const dirLight = new THREE.DirectionalLight(0xffffff, isMobile ? 1.2 : 1.0);
    dirLight.position.set(4, 9, 6);
    scene.add(dirLight);
    
    const grid = new THREE.GridHelper(isMobile ? 20 : 28, isMobile ? 16 : 24, 0xffffff, 0x3a3a3a);
    grid.position.y = -2.0;
    grid.material.transparent = true;
    grid.material.opacity = isMobile ? 0.1 : 0.18;
    scene.add(grid);
    
    if (!isMobile) {
        const starGeoFar = new THREE.BufferGeometry();
        const starCountFar = 800;
        const posFar = new Float32Array(starCountFar * 3);
        for (let i = 0; i < starCountFar; i++) {
            posFar[i*3] = (Math.random() - 0.5) * 220;
            posFar[i*3+1] = (Math.random() - 0.5) * 65;
            posFar[i*3+2] = (Math.random() - 0.5) * 90 - 40;
        }
        starGeoFar.setAttribute('position', new THREE.BufferAttribute(posFar, 3));
        starsFar = new THREE.Points(starGeoFar, new THREE.PointsMaterial({ color: 0xffffff, size: 0.12, transparent: true, opacity: 0.65 }));
        scene.add(starsFar);
        
        const starGeoNear = new THREE.BufferGeometry();
        const starCountNear = 400;
        const posNear = new Float32Array(starCountNear * 3);
        for (let i = 0; i < starCountNear; i++) {
            posNear[i*3] = (Math.random() - 0.5) * 160;
            posNear[i*3+1] = (Math.random() - 0.5) * 45;
            posNear[i*3+2] = (Math.random() - 0.5) * 60 - 20;
        }
        starGeoNear.setAttribute('position', new THREE.BufferAttribute(posNear, 3));
        starsNear = new THREE.Points(starGeoNear, new THREE.PointsMaterial({ color: 0xffffff, size: 0.22, transparent: true, opacity: 0.8 }));
        scene.add(starsNear);
    }

    const shootingStarGeo = new THREE.SphereGeometry(0.03, 2, 2);
    const shootingStarMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    for (let i = 0; i < 40; i++) {
        const star = new THREE.Mesh(shootingStarGeo, shootingStarMat);
        star.visible = false;
        star.userData = {
            velocity: new THREE.Vector3(0, -0.08 - Math.random() * 0.12, 0),
            life: 0,
            maxLife: 60 + Math.floor(Math.random() * 60)
        };
        scene.add(star);
        shootingStars.push(star);
    }

    const flashTexture = createFlashTexture();
    for (let i = 0; i < 20; i++) {
        const material = new THREE.SpriteMaterial({
            map: flashTexture,
            color: 0xffffff,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            depthTest: true
        });
        const sprite = new THREE.Sprite(material);
        sprite.visible = false;
        sprite.scale.set(0.5, 0.5, 1);
        sprite.userData = { life: 0, maxLife: 30 };
        scene.add(sprite);
        flashSprites.push(sprite);
    }
    
    animate();
}

function createFlashTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 32;
    canvas.height = 32;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, 32, 32);
    ctx.beginPath();
    ctx.arc(16, 16, 14, 0, 2*Math.PI);
    const gradient = ctx.createRadialGradient(16, 16, 0, 16, 16, 14);
    gradient.addColorStop(0, 'rgba(255,255,255,1)');
    gradient.addColorStop(0.4, 'rgba(255,255,255,0.8)');
    gradient.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = gradient;
    ctx.fill();
    return new THREE.CanvasTexture(canvas);
}

function spawnShootingStar() {
    for (let star of shootingStars) {
        if (!star.visible) {
            const angle = Math.random() * Math.PI * 2;
            const radius = 10 + Math.random() * 8;
            star.position.set(
                Math.cos(angle) * radius,
                5 + Math.random() * 4,
                Math.sin(angle) * radius
            );
            star.visible = true;
            star.userData.life = star.userData.maxLife;
            break;
        }
    }
}

function updateShootingStars() {
    for (let star of shootingStars) {
        if (!star.visible) continue;
        star.position.add(star.userData.velocity);
        star.userData.life--;
        if (star.position.y < -2.1 || star.userData.life <= 0) {
            if (star.position.y < -2.1 && star.position.y > -3.0) {
                triggerFlash(star.position.clone());
            }
            star.visible = false;
        }
    }
}

function triggerFlash(position) {
    for (let sprite of flashSprites) {
        if (!sprite.visible) {
            sprite.position.copy(position);
            sprite.position.y = -2.0;
            sprite.visible = true;
            sprite.userData.life = sprite.userData.maxLife;
            break;
        }
    }
}

function updateFlashes() {
    for (let sprite of flashSprites) {
        if (!sprite.visible) continue;
        sprite.userData.life--;
        const progress = 1 - (sprite.userData.life / sprite.userData.maxLife);
        sprite.material.opacity = 1 - progress;
        sprite.scale.set(0.5 + progress * 1.5, 0.5 + progress * 1.5, 1);
        if (sprite.userData.life <= 0) {
            sprite.visible = false;
        }
    }
}

let frameCounter = 0;
let spawnTimer = 0;

function animateWavefield() {
    if (!geometry || contextLostFlag) return;
    if (isMobile) {
        frameCounter++;
        if (frameCounter % 2 !== 0) return;
    }
    timeVal += 0.008;
    const posAttr = geometry.attributes.position;
    const arr = posAttr.array;
    const segW = isMobile ? 20 : 50;
    const segH = isMobile ? 20 : 50;
    const planeW = isMobile ? 16 : 20;
    const planeH = isMobile ? 16 : 20;
    for (let i = 0; i <= segW; i++) {
        const x = (i / segW - 0.5) * planeW;
        for (let j = 0; j <= segH; j++) {
            const z = (j / segH - 0.5) * planeH;
            const idx = (j * (segW + 1) + i) * 3;
            const y1 = Math.sin(x * 1.2 + timeVal * 0.7) * Math.cos(z * 1.1 + timeVal * 0.5) * 0.2;
            const y2 = Math.sin(x * 2.3 - timeVal * 1.3) * 0.1;
            const y3 = Math.cos(z * 2.1 + timeVal * 0.9) * 0.1;
            const y4 = Math.sin((x * 1.8 + z * 1.6) * 0.8 + timeVal * 1.1) * 0.08;
            const y5 = Math.sin(x * 0.6 + z * 0.7 + timeVal * 0.4) * 0.12;
            const y6 = Math.cos(x * 0.9 - z * 0.8 + timeVal * 0.6) * 0.06;
            arr[idx + 1] = y1 + y2 + y3 + y4 + y5 + y6;
        }
    }
    posAttr.needsUpdate = true;
    geometry.computeVertexNormals();
}

function animate() {
    if (!contextLostFlag) {
        animateWavefield();
        if (starsFar) {
            starsFar.rotation.y += 0.0002;
            starsFar.rotation.x += 0.0001;
        }
        if (starsNear) {
            starsNear.rotation.y -= 0.0004;
            starsNear.rotation.x += 0.00025;
        }
        spawnTimer++;
        if (spawnTimer % 20 === 0) spawnShootingStar();
        updateShootingStars();
        updateFlashes();
        if (camera) camera.lookAt(0, 0.4, 0);
        if (renderer && scene && camera) renderer.render(scene, camera);
    }
    animFrame = requestAnimationFrame(animate);
}

window.addEventListener('resize', () => {
    if (camera) {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
    }
    if (renderer) renderer.setSize(window.innerWidth, window.innerHeight);
});
document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
        if (animFrame) cancelAnimationFrame(animFrame);
        animFrame = null;
    } else if (!animFrame && !contextLostFlag) animate();
});

initThree();

const appMeta = {
    Windows: { title: 'Dynamic Browser for Windows', short: 'Молниеносный, безопасный, минималистичный.', fullDesc: 'nil', formats: ['exe','zip'], defaultFormat: 'exe', permissions: ['Интернет', 'Хранилище'] },
    Android: { title: 'Dynamic Browser for Android', short: 'Лёгкий, быстрый, современный браузер.', fullDesc: 'nil', formats: ['apk'], defaultFormat: 'apk', permissions: ['Интернет', 'Хранилище'] }
};
let currentOS = null, currentFormat = 'exe', currentFileName = '';
const platformStage = document.getElementById('platformStage'), storeDash = document.getElementById('storeDashboard');
const appNameSpan = document.getElementById('appName'), appSubSpan = document.getElementById('appSub'), descTextSpan = document.getElementById('descText'), permListDiv = document.getElementById('permissionList');
const formatGroup = document.getElementById('formatGroup'), installBtn = document.getElementById('installBtn');
const screenshotStrip = document.getElementById('screenshotStrip'), descWrap = document.getElementById('descWrap'), expandDescBtn = document.getElementById('expandDescBtn');
const backButton = document.getElementById('backBtn'), toastDiv = document.getElementById('toastMsg'), toastTextSpan = document.getElementById('toastText');
const privacyModal = document.getElementById('privacyModal'), privacyContent = document.getElementById('privacyContent'), privacyBtn = document.getElementById('privacyBtn'), closePrivacy = document.getElementById('closePrivacy');
const lightboxModal = document.getElementById('lightboxModal'), lightboxImg = document.getElementById('lightboxImg'), closeLightbox = document.getElementById('closeLightbox');

let currentInstruction = null, isTransitioning = false, lastDesc = null;

function showToastMessage(msg) { toastTextSpan.innerText = msg; toastDiv.classList.add('visible'); clearTimeout(window.toastTimer); window.toastTimer = setTimeout(() => toastDiv.classList.remove('visible'), 2800); }
function resetDescription() { descWrap.style.maxHeight = 'none'; expandDescBtn.style.display = 'none'; expandDescBtn.innerText = 'Показать полностью'; expandDescBtn.dataset.exp = 'false'; }
function setupDescription() {
    if (descTextSpan.innerText === lastDesc) return;
    lastDesc = descTextSpan.innerText;
    resetDescription();
    requestAnimationFrame(() => {
        const lineH = parseFloat(getComputedStyle(descTextSpan).lineHeight);
        if (!lineH) return;
        const maxH = lineH * 5;
        if (descTextSpan.scrollHeight > maxH + 3) {
            descWrap.style.maxHeight = maxH + 'px';
            expandDescBtn.style.display = 'inline-block';
            expandDescBtn.dataset.exp = 'false';
            expandDescBtn.innerText = 'Показать полностью';
        } else {
            descWrap.style.maxHeight = 'none';
            expandDescBtn.style.display = 'none';
        }
    });
}
expandDescBtn.addEventListener('click', () => {
    const expanded = expandDescBtn.dataset.exp === 'true';
    const lineH = parseFloat(getComputedStyle(descTextSpan).lineHeight);
    if (expanded) {
        descWrap.style.maxHeight = (lineH * 5) + 'px';
        expandDescBtn.innerText = 'Показать полностью';
        expandDescBtn.dataset.exp = 'false';
    } else {
        descWrap.style.maxHeight = descTextSpan.scrollHeight + 'px';
        expandDescBtn.innerText = 'Свернуть';
        expandDescBtn.dataset.exp = 'true';
    }
});
async function fetchJSON(url) { try { const r = await fetch(url); return r.ok ? await r.json() : null; } catch { return null; } }
async function fetchText(url) { try { const r = await fetch(url); return r.ok ? await r.text() : null; } catch { return null; } }
async function loadInstruction(os) { return await fetchJSON(`${os}/instruction.json`); }
async function loadScreenshots(base, imagesMap) { if (!imagesMap) return []; const urls = []; for (const key of Object.keys(imagesMap).sort((a,b)=> (parseInt(a.match(/\d+/)?.[0]||0) - parseInt(b.match(/\d+/)?.[0]||0)))) { const src = `${base}/${imagesMap[key]}`; const imgTest = new Image(); await new Promise(res => { imgTest.onload = () => res(true); imgTest.onerror = () => res(false); imgTest.src = src; }); if (imgTest.complete && imgTest.naturalWidth) urls.push(src); } return urls; }
function renderScreenshots(images) { screenshotStrip.innerHTML = images.length ? images.map(src => `<img src="${src}" class="screenshot-item" loading="lazy">`).join('') : '<div style="color:rgba(255,255,255,0.4); padding:20px;">Нет скриншотов</div>'; document.querySelectorAll('.screenshot-item').forEach(img => img.addEventListener('click', (e) => { lightboxImg.src = img.src; lightboxModal.classList.add('visible'); })); }
async function refreshUI() { if (!currentOS) { if (!platformStage.classList.contains('hidden')) return; storeDash.classList.remove('visible'); platformStage.classList.remove('hidden'); platformStage.style.opacity = '1'; platformStage.style.transform = 'none'; return; }
const osData = appMeta[currentOS]; appNameSpan.innerText = osData.title; appSubSpan.innerText = osData.short; currentInstruction = await loadInstruction(currentOS); let desc = osData.fullDesc; if (currentInstruction?.desc) { const fetched = await fetchText(`${currentOS}/${currentInstruction.desc}`); if (fetched) desc = fetched; } descTextSpan.innerText = desc; permListDiv.innerHTML = osData.permissions.map(p => `<div class="permission-row"><i class="fas fa-check-circle"></i> ${p}</div>`).join('');
const ver = currentInstruction?.version || '3.2.1'; if (currentInstruction?.app) { if (currentOS === 'Windows') currentFileName = currentFormat === 'exe' ? currentInstruction.exe : currentInstruction.zip; else currentFileName = currentInstruction.app; } else { currentFileName = currentOS === 'Windows' ? (currentFormat === 'exe' ? `dynamic-browser-setup-${ver}.exe` : `dynamic-browser-portable-${ver}.zip`) : `dynamic-browser-${ver}.apk`; }
if (currentOS === 'Windows') { formatGroup.style.display = 'flex'; document.querySelectorAll('.format-option').forEach(opt => opt.classList.remove('active')); const activeOpt = document.querySelector(`.format-option[data-format="${currentFormat}"]`); if (activeOpt) activeOpt.classList.add('active'); } else { formatGroup.style.display = 'none'; currentFormat = 'apk'; }
const screens = await loadScreenshots(currentOS, currentInstruction?.Images || null); renderScreenshots(screens);
if (platformStage.classList.contains('hidden') === false) {
    platformStage.style.transition = 'opacity 0.5s ease, transform 0.5s';
    platformStage.style.opacity = '0';
    platformStage.style.transform = 'scale(0.96) translateY(-15px)';
    setTimeout(() => {
        platformStage.classList.add('hidden');
        storeDash.classList.add('visible');
        storeDash.style.animation = 'none';
        storeDash.offsetHeight;
        storeDash.style.animation = 'fadeSlideUp 0.6s ease';
        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                setupDescription();
            });
        });
    }, 480);
} else {
    setupDescription();
}
}

document.querySelectorAll('.platform-pill').forEach(card => { card.addEventListener('click', () => { const os = card.dataset.os; if (currentOS === os) return; currentOS = os; currentFormat = appMeta[os].defaultFormat; refreshUI(); }); });
backButton.addEventListener('click', () => { if (isTransitioning) return; isTransitioning = true; storeDash.style.transition = 'opacity 0.4s, transform 0.4s'; storeDash.style.opacity = '0'; storeDash.style.transform = 'translateY(20px)'; setTimeout(() => { storeDash.classList.remove('visible'); storeDash.style.opacity = ''; storeDash.style.transform = ''; platformStage.classList.remove('hidden'); platformStage.style.opacity = '0'; platformStage.style.transform = 'translateY(-10px)'; platformStage.style.transition = 'none'; platformStage.offsetHeight; platformStage.style.transition = 'opacity 0.5s ease, transform 0.5s'; platformStage.style.opacity = '1'; platformStage.style.transform = 'none'; currentOS = null; isTransitioning = false; }, 400); });
formatGroup.addEventListener('click', (e) => { if (currentOS !== 'Windows') return; const btn = e.target.closest('.format-option'); if (btn && btn.dataset.format) { currentFormat = btn.dataset.format; refreshUI(); } });
installBtn.addEventListener('click', () => { if (!currentOS || !currentFileName) return; showToastMessage(`Начинается загрузка`); const link = document.createElement('a'); link.href = `https://dynamicbrowser.app/dl/${currentFileName}`; link.download = currentFileName; link.style.display = 'none'; document.body.appendChild(link); link.click(); document.body.removeChild(link); });
privacyBtn.addEventListener('click', (e) => { e.preventDefault(); fetch('POLITICS.txt').then(r => r.ok ? r.text() : Promise.reject()).then(txt => { const blocks = txt.split('\n\n').filter(b => b.trim()); privacyContent.innerHTML = blocks.map(block => `<p style="margin-bottom:16px;">${block.replace(/\n/g, '<br>')}</p>`).join(''); }).catch(() => privacyContent.innerHTML = '<p>Политика временно недоступна.</p>'); privacyModal.classList.add('visible'); });
closePrivacy.addEventListener('click', () => privacyModal.classList.remove('visible')); privacyModal.addEventListener('click', (e) => { if (e.target === privacyModal) privacyModal.classList.remove('visible'); });
closeLightbox.addEventListener('click', () => { lightboxModal.classList.remove('visible'); lightboxImg.src = ''; }); lightboxModal.addEventListener('click', (e) => { if (e.target === lightboxModal) { lightboxModal.classList.remove('visible'); lightboxImg.src = ''; } });
refreshUI();
</script>
