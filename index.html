<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Dynamic Installer</title>
    <link rel="icon" href="Logo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        :root {
            --bg-deep: #000000;
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-border-glow: rgba(255, 255, 255, 0.3);
            --card-bg: rgba(0, 0, 0, 0.65);
            --text-main: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.7);
            --text-faint: rgba(255, 255, 255, 0.45);
            --radius-card: 32px;
            --transition-smooth: cubic-bezier(0.2, 0.9, 0.4, 1.1);
            --shadow-premium: 0 20px 35px -12px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.03);
        }
        html {
            height: 100%;
            font-size: 16px;
            color-scheme: dark;
            scrollbar-color: rgba(255, 255, 255, 0.25) transparent;
            scrollbar-width: thin;
        }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg-deep);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            position: relative;
        }
        body.modal-open {
            overflow: hidden;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.25);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.45);
        }

        canvas#wave-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            filter: brightness(0.9) contrast(1.2);
        }

        .page-container {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        .sections-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .section {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: translateY(50px);
            transition: opacity 0.7s cubic-bezier(0.2, 0.9, 0.4, 1.1), transform 0.7s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            pointer-events: none;
            padding: 24px;
        }
        .section.active {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
            z-index: 1;
        }
        .section.leaving {
            opacity: 0;
            transform: translateY(-50px);
            transition: opacity 0.5s ease, transform 0.5s ease;
            z-index: 0;
        }
        .section.entering {
            opacity: 0;
            transform: translateY(50px);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .fixed-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            z-index: 100;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(14px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 24px;
            text-align: center;
            font-size: 0.7rem;
            color: var(--text-faint);
        }
        .fixed-footer a {
            color: white;
            margin: 0 10px;
            text-decoration: none;
        }

        .hero-product {
            display: flex;
            gap: 32px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border-radius: var(--radius-card);
            padding: 32px;
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-premium);
            flex-wrap: wrap;
            max-width: 720px;
            width: 100%;
        }
        .product-icon {
            width: 120px;
            height: 120px;
            border-radius: 28px;
            object-fit: cover;
            background: #0c0c0c;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.6);
        }
        .product-info {
            flex: 1;
        }
        .product-title {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #fff, #c0c0c0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 8px;
        }
        .product-sub {
            font-size: 1rem;
            color: var(--text-dim);
            margin-bottom: 24px;
        }
        .action-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 20px;
            margin-bottom: 16px;
        }
        .format-group {
            display: flex;
            gap: 12px;
            background: rgba(0, 0, 0, 0.5);
            padding: 6px;
            border-radius: 100px;
        }
        .format-option {
            background: transparent;
            border: none;
            padding: 8px 24px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-dim);
            cursor: pointer;
            transition: all 0.2s;
        }
        .format-option.active {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }
        .download-prime {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.05));
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 14px 36px;
            border-radius: 60px;
            font-weight: 800;
            font-size: 1rem;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: 0.3s;
            backdrop-filter: blur(10px);
        }
        .download-prime:hover {
            transform: translateY(-4px);
            background: rgba(255, 255, 255, 0.3);
            border-color: white;
            box-shadow: 0 20px 30px -12px black;
        }

        .glass-panel {
            background: var(--card-bg);
            backdrop-filter: blur(18px);
            border-radius: var(--radius-card);
            padding: 24px 28px;
            border: 1px solid var(--glass-border);
            width: 100%;
            max-width: 800px;
        }
        .panel-header {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--text-faint);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .gallery-wrapper {
            position: relative;
            overflow: hidden;
        }
        .screenshot-strip {
            display: flex;
            gap: 18px;
            overflow-x: auto;
            scroll-behavior: smooth;
            padding: 6px 12px;
            scrollbar-width: none;
        }
        .screenshot-strip::-webkit-scrollbar {
            display: none;
        }
        .screenshot-strip img {
            height: 240px;
            width: auto;
            flex-shrink: 0;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: outline-color 0.2s ease;
            outline: 2px solid transparent;
            outline-offset: 2px;
        }
        .screenshot-strip img:hover {
            outline-color: white;
        }
        .screenshot-strip .spinner-wrap {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            min-height: 80px;
        }
        .screenshot-strip .spinner-wrap i {
            font-size: 2.5rem;
            color: rgba(255, 255, 255, 0.4);
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .gallery-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 24px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 5;
            backdrop-filter: blur(4px);
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
        }
        .gallery-arrow.visible {
            opacity: 1;
            pointer-events: auto;
        }
        .gallery-arrow:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        .gallery-arrow.left {
            left: 8px;
        }
        .gallery-arrow.right {
            right: 8px;
        }
        .gallery-arrow:disabled {
            opacity: 0.3;
            pointer-events: none;
        }

        .desc-wrapper {
            overflow: hidden;
            transition: max-height 0.45s var(--transition-smooth);
        }
        .desc-text {
            color: var(--text-dim);
            line-height: 1.6;
            font-size: 0.95rem;
        }
        .expand-trigger {
            background: none;
            border: none;
            color: white;
            font-weight: 600;
            font-size: 0.8rem;
            margin-top: 12px;
            cursor: pointer;
            opacity: 0.7;
        }

        .permission-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .permission-row {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 0.9rem;
            color: var(--text-dim);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding: 8px 0;
        }

        .toast-message {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(90px);
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(28px);
            padding: 12px 28px;
            border-radius: 60px;
            display: flex;
            gap: 12px;
            align-items: center;
            font-weight: 600;
            z-index: 300;
            transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .toast-message.visible {
            transform: translateX(-50%) translateY(0);
        }

        .modal-privacy,
        .lightbox-modal,
        .modal-notification {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(24px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: 0.3s;
        }
        .modal-privacy.visible,
        .lightbox-modal.visible,
        .modal-notification.visible {
            opacity: 1;
            visibility: visible;
        }

        .privacy-card,
        .notification-card {
            background: rgba(0, 0, 0, 0.96);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 48px;
            max-width: 620px;
            width: 92%;
            padding: 36px 32px 28px;
            position: relative;
            transform: scale(0.95);
            transition: transform 0.3s;
            display: flex;
            flex-direction: column;
            max-height: 85vh;
            overflow: hidden;
        }
        .modal-privacy.visible .privacy-card,
        .modal-notification.visible .notification-card {
            transform: scale(1);
        }
        .notification-card {
            text-align: center;
            gap: 16px;
            padding: 32px;
        }
        .notification-card h2 {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #c0c0c0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 4px;
            flex-shrink: 0;
        }
        .notif-body {
            margin: 0 0 8px;
            padding: 0;
        }
        .notif-body p {
            color: var(--text-dim);
            line-height: 1.6;
            font-size: 1rem;
            margin: 0;
        }
        .notif-ok-btn {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.05));
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 14px 48px;
            border-radius: 60px;
            font-weight: 800;
            font-size: 1rem;
            color: white;
            cursor: pointer;
            transition: 0.3s;
            backdrop-filter: blur(10px);
            align-self: center;
            flex-shrink: 0;
        }
        .notif-ok-btn:hover {
            transform: translateY(-4px);
            background: rgba(255, 255, 255, 0.3);
            border-color: white;
            box-shadow: 0 20px 30px -12px black;
        }
        .privacy-card {
            text-align: left;
            gap: 16px;
            padding: 36px 32px 24px;
        }
        .privacy-title {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #c0c0c0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 4px;
            flex-shrink: 0;
        }
        .privacy-scroll {
            flex: 1;
            overflow-y: auto;
            margin-right: -12px;
            padding-right: 20px;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.3) transparent;
            margin-bottom: 8px;
        }
        .privacy-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .privacy-scroll::-webkit-scrollbar-track {
            background: transparent;
        }
        .privacy-scroll::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
        }
        .privacy-scroll p {
            color: var(--text-dim);
            line-height: 1.7;
            margin-bottom: 18px;
            font-size: 0.95rem;
        }
        .privacy-close-btn {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.03));
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 12px 32px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 0.9rem;
            color: white;
            cursor: pointer;
            transition: 0.3s;
            backdrop-filter: blur(10px);
            align-self: center;
            flex-shrink: 0;
        }
        .privacy-close-btn:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.25);
            border-color: white;
            box-shadow: 0 12px 24px -10px black;
        }

        .lightbox-img {
            max-width: 90vw;
            max-height: 85vh;
            border-radius: 28px;
            box-shadow: 0 30px 50px black;
            transition: opacity 0.35s ease;
            opacity: 1;
        }
        .lightbox-img.fade-out {
            opacity: 0;
        }
        .lightbox-close {
            position: absolute;
            top: 12px;
            right: 12px;
            font-size: 32px;
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            z-index: 10;
        }
        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 28px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 11;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            backdrop-filter: blur(4px);
        }
        .lightbox-nav:hover {
            background: rgba(255, 255, 255, 0.25);
        }
        .lightbox-nav.left {
            left: 20px;
        }
        .lightbox-nav.right {
            right: 20px;
        }
        .lightbox-nav.hidden {
            display: none;
        }

        #loadingOverlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            transition: opacity 0.6s ease;
            pointer-events: none;
        }
        #loadingOverlay.hidden {
            opacity: 0;
        }
        #loadingOverlay .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        #loadingOverlay p {
            color: var(--text-dim);
            font-size: 1rem;
            font-weight: 400;
            letter-spacing: 0.06em;
        }

        @media (max-width: 720px) {
            .hero-product {
                flex-direction: column;
                align-items: center;
                text-align: center;
                padding: 20px;
            }
            .action-bar {
                justify-content: center;
            }
            .product-title {
                font-size: 1.8rem;
            }
            .privacy-card,
            .notification-card {
                padding: 24px 20px 20px;
            }
            .privacy-title {
                font-size: 1.4rem;
            }
            .screenshot-strip img {
                height: 160px;
            }
            .gallery-arrow {
                display: none;
            }
            .glass-panel {
                padding: 16px 18px;
            }
            .section {
                padding: 16px 12px;
            }
        }
    </style>
</head>
<body>
<canvas id="wave-canvas"></canvas>

<div id="loadingOverlay">
    <div class="spinner"></div>
    <p>Загрузка данных...</p>
</div>

<div class="page-container" id="pageContainer">
    <div class="sections-wrapper">
        <section class="section active" id="heroSection">
            <div class="hero-product">
                <img src="Logo.png" alt="Dynamic Browser" class="product-icon" id="appIcon">
                <div class="product-info">
                    <div class="product-title" id="appName">Dynamic Browser</div>
                    <div class="product-sub" id="appSub"></div>
                    <div class="action-bar">
                        <div class="format-group" id="formatGroup">
                            <button class="format-option active" data-format="exe">EXE</button>
                            <button class="format-option" data-format="zip">ZIP</button>
                        </div>
                        <button class="download-prime" id="installBtn"><i class="fas fa-download"></i> Скачать</button>
                    </div>
                </div>
            </div>
        </section>

        <section class="section" id="gallerySection">
            <div class="glass-panel">
                <div class="panel-header"><i class="fas fa-camera"></i> ГАЛЕРЕЯ</div>
                <div class="gallery-wrapper">
                    <div class="screenshot-strip" id="screenshotStrip"></div>
                    <button class="gallery-arrow left" id="galleryLeft"><i class="fas fa-chevron-left"></i></button>
                    <button class="gallery-arrow right" id="galleryRight"><i class="fas fa-chevron-right"></i></button>
                </div>
            </div>
        </section>

        <section class="section" id="descSection">
            <div class="glass-panel">
                <div class="panel-header"><i class="fas fa-info-circle"></i> ОПИСАНИЕ</div>
                <div class="desc-wrapper" id="descWrap">
                    <div class="desc-text" id="descText"></div>
                </div>
                <button class="expand-trigger" id="expandDescBtn" style="display:none">Ещё</button>
            </div>
        </section>

        <section class="section" id="permSection">
            <div class="glass-panel">
                <div class="panel-header"><i class="fas fa-shield-alt"></i> РАЗРЕШЕНИЯ И ОСОБЕННОСТИ</div>
                <div class="permission-list" id="permissionList"></div>
            </div>
        </section>
    </div>
</div>

<footer class="fixed-footer">
    © 2026 Dynamic Browser —
    <a href="#" id="privacyBtn">Политика конфиденциальности</a>
    <a href="https://github.com/Shon-Lua/Dynamic-Browser" target="_blank">GitHub</a>
</footer>

<div class="toast-message" id="toastMsg"><i class="fas fa-check-circle"></i> <span id="toastText"></span></div>

<div class="modal-privacy" id="privacyModal">
    <div class="privacy-card">
        <h2 class="privacy-title">Политика конфиденциальности</h2>
        <div class="privacy-scroll">
            <div id="privacyContent"></div>
        </div>
        <button class="privacy-close-btn" id="closePrivacyBtn">Закрыть</button>
    </div>
</div>

<div class="lightbox-modal" id="lightboxModal">
    <button class="lightbox-close" id="closeLightbox">&times;</button>
    <button class="lightbox-nav left" id="lightboxPrev"><i class="fas fa-chevron-left"></i></button>
    <img class="lightbox-img" id="lightboxImg" alt="">
    <button class="lightbox-nav right" id="lightboxNext"><i class="fas fa-chevron-right"></i></button>
</div>

<div class="modal-notification" id="notificationModal">
    <div class="notification-card">
        <h2 id="notifTitle"></h2>
        <div class="notif-body">
            <p id="notifText"></p>
        </div>
        <button class="notif-ok-btn" id="notifOkBtn">Ок</button>
    </div>
</div>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.128.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth <= 768;
let scene, camera, renderer, waveMesh, stars, geometry, timeVal = 0, animFrame = null, contextLostFlag = false;
const canvas = document.getElementById('wave-canvas');

function initThree() {
    if (renderer) {
        if (animFrame) cancelAnimationFrame(animFrame);
        if (renderer.domElement?.parentNode) renderer.domElement.remove();
    }
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);
    if (!isMobile) scene.fog = new THREE.FogExp2(0x000000, 0.008);

    camera = new THREE.PerspectiveCamera(isMobile ? 50 : 42, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(isMobile ? 10 : 11, isMobile ? 6.5 : 7.5, isMobile ? 12 : 13);
    camera.lookAt(0, 0.2, 0);

    const pixelRatio = isMobile ? Math.min(window.devicePixelRatio, 1.2) : Math.min(window.devicePixelRatio, 2);
    renderer = new THREE.WebGLRenderer({ canvas, alpha: false, antialias: !isMobile, powerPreference: isMobile ? "low-power" : "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(pixelRatio);

    canvas.addEventListener('webglcontextlost', (e) => {
        e.preventDefault();
        contextLostFlag = true;
        if (animFrame) cancelAnimationFrame(animFrame);
        animFrame = null;
    });
    canvas.addEventListener('webglcontextrestored', () => {
        contextLostFlag = false;
        initThree();
    });

    const widthSeg = isMobile ? 20 : 45;
    const heightSeg = isMobile ? 20 : 45;
    const planeSize = isMobile ? 16 : 19;
    geometry = new THREE.PlaneGeometry(planeSize, planeSize, widthSeg, heightSeg);
    geometry.rotateX(-Math.PI / 2);
    const positions = geometry.attributes.position.array;
    for (let i = 0; i < positions.length / 3; i++) positions[i*3+1] = 0;

    const wireframeMat = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        wireframe: true,
        emissive: 0x111111,
        roughness: 0.5,
        metalness: 0.7
    });
    waveMesh = new THREE.Mesh(geometry, wireframeMat);
    scene.add(waveMesh);

    const ambient = new THREE.AmbientLight(0x222222);
    scene.add(ambient);
    const dirLight = new THREE.DirectionalLight(0xffffff, isMobile ? 0.9 : 1.2);
    dirLight.position.set(4, 9, 6);
    scene.add(dirLight);
    if (!isMobile) {
        const fillLight = new THREE.PointLight(0x555555, 0.4);
        fillLight.position.set(-2, 3, 4);
        scene.add(fillLight);
    }

    const grid = new THREE.GridHelper(isMobile ? 20 : 28, isMobile ? 16 : 24, 0xffffff, 0x3a3a3a);
    grid.position.y = -2.0;
    grid.material.transparent = true;
    grid.material.opacity = isMobile ? 0.1 : 0.18;
    scene.add(grid);

    if (!isMobile) {
        const starCount = 500;
        const starGeo = new THREE.BufferGeometry();
        const starPos = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount; i++) {
            starPos[i*3] = (Math.random() - 0.5) * 220;
            starPos[i*3+1] = (Math.random() - 0.5) * 65;
            starPos[i*3+2] = (Math.random() - 0.5) * 90 - 40;
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.07, transparent: true, opacity: 0.55 }));
        scene.add(stars);
    }

    animate();
}

let frameCounter = 0;

function animateWavefield() {
    if (!geometry || contextLostFlag) return;
    if (isMobile) {
        frameCounter++;
        if (frameCounter % 2 !== 0) return;
    }
    timeVal += isMobile ? 0.014 : 0.019;
    const posAttr = geometry.attributes.position;
    const arr = posAttr.array;
    const segW = isMobile ? 20 : 45;
    const segH = isMobile ? 20 : 45;
    const planeW = isMobile ? 16 : 19;
    const planeH = isMobile ? 16 : 19;
    for (let i = 0; i <= segW; i++) {
        const x = (i / segW - 0.5) * planeW;
        for (let j = 0; j <= segH; j++) {
            const z = (j / segH - 0.5) * planeH;
            const idx = (j * (segW + 1) + i) * 3;
            const y1 = Math.sin(x * 0.85 + timeVal) * Math.cos(z * 0.75 + timeVal * 0.65) * (isMobile ? 0.45 : 0.55);
            const y2 = Math.sin(x * 1.7 - timeVal * 1.1) * (isMobile ? 0.2 : 0.28);
            const y3 = Math.cos(z * 1.45 + timeVal * 0.85) * (isMobile ? 0.2 : 0.28);
            const y4 = Math.sin((x * 1.25 + z * 1.2) * 0.7 + timeVal * 1.4) * (isMobile ? 0.15 : 0.22);
            arr[idx + 1] = y1 + y2 + y3 + y4;
        }
    }
    posAttr.needsUpdate = true;
    geometry.computeVertexNormals();
}

function animate() {
    if (!contextLostFlag) {
        animateWavefield();
        if (stars) {
            stars.rotation.y += 0.0003;
            stars.rotation.x += 0.00015;
        }
        if (camera) camera.lookAt(0, 0.4, 0);
        if (renderer && scene && camera) renderer.render(scene, camera);
    }
    animFrame = requestAnimationFrame(animate);
}

window.addEventListener('resize', () => {
    if (camera) {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
    }
    if (renderer) renderer.setSize(window.innerWidth, window.innerHeight);
});
document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
        if (animFrame) cancelAnimationFrame(animFrame);
        animFrame = null;
    } else if (!animFrame && !contextLostFlag) animate();
});

initThree();

const appMeta = {
    App: {
        title: 'Dynamic Browser',
        short: 'Молниеносный, безопасный, минималистичный.',
        fullDesc: 'nil',
        formats: ['exe', 'zip'],
        defaultFormat: 'exe',
        permissions: ['Интернет', 'Хранилище', 'Поверх всех приложений']
    }
};
let currentOS = 'App';
let currentFormat = 'exe';
let currentFileName = '';

const appNameSpan = document.getElementById('appName');
const appSubSpan = document.getElementById('appSub');
const descTextSpan = document.getElementById('descText');
const permListDiv = document.getElementById('permissionList');
const formatGroup = document.getElementById('formatGroup');
const installBtn = document.getElementById('installBtn');
const screenshotStrip = document.getElementById('screenshotStrip');
const descWrap = document.getElementById('descWrap');
const expandDescBtn = document.getElementById('expandDescBtn');
const toastDiv = document.getElementById('toastMsg');
const toastTextSpan = document.getElementById('toastText');
const privacyModal = document.getElementById('privacyModal');
const privacyContent = document.getElementById('privacyContent');
const privacyBtn = document.getElementById('privacyBtn');
const closePrivacyBtn = document.getElementById('closePrivacyBtn');
const lightboxModal = document.getElementById('lightboxModal');
const lightboxImg = document.getElementById('lightboxImg');
const closeLightbox = document.getElementById('closeLightbox');
const lightboxPrev = document.getElementById('lightboxPrev');
const lightboxNext = document.getElementById('lightboxNext');
const notificationModal = document.getElementById('notificationModal');
const notifTitle = document.getElementById('notifTitle');
const notifText = document.getElementById('notifText');
const notifOkBtn = document.getElementById('notifOkBtn');
const loadingOverlay = document.getElementById('loadingOverlay');
const galleryLeft = document.getElementById('galleryLeft');
const galleryRight = document.getElementById('galleryRight');

let currentInstruction = null;
let lastDesc = null;
const versionURL = 'ITVC%3F';
let loadedPolicy = '';
let loadedDesc = '';

let currentScreenshots = [];
let lightboxIndex = 0;
let isLightboxTransitioning = false;
let galleryAnimationId = null;

const sections = [
    document.getElementById('heroSection'),
    document.getElementById('gallerySection'),
    document.getElementById('descSection'),
    document.getElementById('permSection')
];
let currentSectionIndex = 0;
let isTransitioning = false;

function changeSection(direction) {
    if (isTransitioning) return;
    const newIndex = currentSectionIndex + direction;
    if (newIndex < 0 || newIndex >= sections.length) return;

    const currentSection = sections[currentSectionIndex];
    const nextSection = sections[newIndex];

    isTransitioning = true;

    currentSection.classList.add('leaving');
    currentSection.classList.remove('active');
    nextSection.classList.add('entering');

    const onTransitionEnd = (e) => {
        if (e.target !== nextSection) return;
        nextSection.removeEventListener('transitionend', onTransitionEnd);
        nextSection.classList.remove('entering');
        nextSection.classList.add('active');
        currentSection.classList.remove('leaving');
        currentSectionIndex = newIndex;
        isTransitioning = false;
    };

    nextSection.addEventListener('transitionend', onTransitionEnd, { once: false });
    requestAnimationFrame(() => {
        nextSection.classList.remove('entering');
    });
}

function handleWheel(e) {
    if (e.target.closest('.screenshot-strip') || e.target.closest('.privacy-scroll') || e.target.closest('.desc-wrapper')) return;
    if (isTransitioning) return;
    if (Math.abs(e.deltaY) < 30) return;
    if (e.deltaY > 0) changeSection(1);
    else if (e.deltaY < 0) changeSection(-1);
}

let touchStartY = 0;
function handleTouchStart(e) {
    if (e.target.closest('.screenshot-strip') || e.target.closest('.privacy-scroll') || e.target.closest('.desc-wrapper')) return;
    touchStartY = e.changedTouches[0].screenY;
}
function handleTouchEnd(e) {
    if (isTransitioning) return;
    const deltaY = touchStartY - e.changedTouches[0].screenY;
    if (Math.abs(deltaY) > 50) {
        if (deltaY > 0) changeSection(1);
        else changeSection(-1);
    }
}

document.addEventListener('wheel', handleWheel, { passive: false });
document.addEventListener('touchstart', handleTouchStart, { passive: true });
document.addEventListener('touchend', handleTouchEnd, { passive: true });

function toggleBodyScroll(modalVisible) {
    document.body.classList.toggle('modal-open', modalVisible);
}

function showToastMessage(msg) {
    toastTextSpan.innerText = msg;
    toastDiv.classList.add('visible');
    clearTimeout(window.toastTimer);
    window.toastTimer = setTimeout(() => toastDiv.classList.remove('visible'), 2800);
}

function resetDescription() {
    descWrap.style.maxHeight = 'none';
    expandDescBtn.style.display = 'none';
    expandDescBtn.innerText = 'Ещё';
    expandDescBtn.dataset.exp = 'false';
}

function setupDescription() {
    if (descTextSpan.innerText === lastDesc) return;
    lastDesc = descTextSpan.innerText;
    resetDescription();
    requestAnimationFrame(() => {
        const lineH = parseFloat(getComputedStyle(descTextSpan).lineHeight);
        if (!lineH) return;
        const maxH = lineH * 5;
        if (descTextSpan.scrollHeight > maxH + 3) {
            descWrap.style.maxHeight = maxH + 'px';
            expandDescBtn.style.display = 'inline-block';
            expandDescBtn.dataset.exp = 'false';
            expandDescBtn.innerText = 'Ещё';
        } else {
            descWrap.style.maxHeight = 'none';
            expandDescBtn.style.display = 'none';
        }
    });
}

expandDescBtn.addEventListener('click', () => {
    const expanded = expandDescBtn.dataset.exp === 'true';
    const lineH = parseFloat(getComputedStyle(descTextSpan).lineHeight);
    if (expanded) {
        descWrap.style.maxHeight = (lineH * 5) + 'px';
        expandDescBtn.innerText = 'Ещё';
        expandDescBtn.dataset.exp = 'false';
    } else {
        descWrap.style.maxHeight = descTextSpan.scrollHeight + 'px';
        expandDescBtn.innerText = 'Свернуть';
        expandDescBtn.dataset.exp = 'true';
    }
});

async function fetchJSON(url) {
    try {
        const r = await fetch(url);
        return r.ok ? await r.json() : null;
    } catch {
        return null;
    }
}

async function fetchText(url) {
    try {
        const r = await fetch(url);
        return r.ok ? await r.text() : null;
    } catch {
        return null;
    }
}

async function loadInstruction(os) {
    return await fetchJSON(`${os}/instruction.json`);
}

async function loadScreenshots(base, imagesMap) {
    if (!imagesMap) return [];
    const urls = [];
    const keys = Object.keys(imagesMap).sort((a, b) => (parseInt(a.match(/\d+/)?.[0] || 0) - parseInt(b.match(/\d+/)?.[0] || 0)));
    for (const key of keys) {
        const src = `${base}/${imagesMap[key]}`;
        const imgTest = new Image();
        await new Promise(res => {
            imgTest.onload = () => res(true);
            imgTest.onerror = () => res(false);
            imgTest.src = src;
        });
        if (imgTest.complete && imgTest.naturalWidth) urls.push(src);
    }
    return urls;
}

function updateGalleryArrows() {
    const el = screenshotStrip;
    if (!el || !el.children.length || el.children.length === 1 && el.children[0].classList.contains('spinner-wrap')) {
        galleryLeft.classList.remove('visible');
        galleryRight.classList.remove('visible');
        return;
    }
    const canScrollLeft = el.scrollLeft > 10;
    const canScrollRight = el.scrollLeft + el.clientWidth < el.scrollWidth - 10;
    galleryLeft.classList.toggle('visible', canScrollLeft);
    galleryRight.classList.toggle('visible', canScrollRight);
}

function animateScroll(element, target, duration = 400) {
    const start = element.scrollLeft;
    const change = target - start;
    if (Math.abs(change) < 1) return;
    const startTime = performance.now();
    if (galleryAnimationId) cancelAnimationFrame(galleryAnimationId);
    function step(currentTime) {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const ease = progress < 0.5 ? 4 * progress * progress * progress : 1 - Math.pow(-2 * progress + 2, 3) / 2;
        element.scrollLeft = start + change * ease;
        if (progress < 1) {
            galleryAnimationId = requestAnimationFrame(step);
        } else {
            galleryAnimationId = null;
            updateGalleryArrows();
        }
    }
    galleryAnimationId = requestAnimationFrame(step);
}

function scrollGallery(direction) {
    const el = screenshotStrip;
    if (!el) return;
    const step = el.clientWidth * 0.85;
    const maxScroll = el.scrollWidth - el.clientWidth;
    const target = Math.max(0, Math.min(el.scrollLeft + direction * step, maxScroll));
    animateScroll(el, target, 400);
}

function renderScreenshots(images) {
    currentScreenshots = images;
    screenshotStrip.innerHTML = images.length
        ? images.map(src => `<img src="${src}" class="screenshot-item" loading="lazy">`).join('')
        : '<div style="color:rgba(255,255,255,0.4); padding:20px;">Нет скриншотов</div>';

    const imgs = document.querySelectorAll('.screenshot-item');
    imgs.forEach((img, idx) => {
        img.addEventListener('click', () => {
            lightboxIndex = idx;
            openLightbox(idx);
        });
        img.onload = () => updateGalleryArrows();
        img.onerror = () => updateGalleryArrows();
    });

    requestAnimationFrame(() => updateGalleryArrows());
    setTimeout(updateGalleryArrows, 300);
    setTimeout(updateGalleryArrows, 800);
}

function showScreenshotSpinner() {
    screenshotStrip.innerHTML = `<div class="spinner-wrap"><i class="fas fa-spinner"></i></div>`;
    galleryLeft.classList.remove('visible');
    galleryRight.classList.remove('visible');
}

async function loadScreenshotsAsync() {
    showScreenshotSpinner();
    const screens = await loadScreenshots(currentOS, currentInstruction?.Images || null);
    renderScreenshots(screens);
}

function updateFormatSpecifics() {
    const ver = currentInstruction?.version || '3.2.1';
    if (currentInstruction?.app) {
        currentFileName = currentFormat === 'exe' ? currentInstruction.exe : currentInstruction.zip;
    } else {
        currentFileName = currentFormat === 'exe' ? `dynamic-browser-setup-${ver}.exe` : `dynamic-browser-portable-${ver}.zip`;
    }
    document.querySelectorAll('.format-option').forEach(opt => opt.classList.remove('active'));
    const activeOpt = document.querySelector(`.format-option[data-format="${currentFormat}"]`);
    if (activeOpt) activeOpt.classList.add('active');
}

function refreshUI() {
    const osData = appMeta[currentOS];
    appNameSpan.innerText = osData.title;
    appSubSpan.innerText = osData.short;
    const desc = loadedDesc || osData.fullDesc;
    descTextSpan.innerText = desc;
    permListDiv.innerHTML = osData.permissions.map(p => `<div class="permission-row"><i class="fas fa-check-circle"></i> ${p}</div>`).join('');
    updateFormatSpecifics();
    setupDescription();
    loadScreenshotsAsync();
}

formatGroup.addEventListener('click', (e) => {
    const btn = e.target.closest('.format-option');
    if (btn && btn.dataset.format) {
        currentFormat = btn.dataset.format;
        updateFormatSpecifics();
    }
});

installBtn.addEventListener('click', () => {
    if (!currentFileName) return;
    showToastMessage(`Начинается загрузка`);
    const link = document.createElement('a');
    link.href = `https://dynamicbrowser.app/dl/${currentFileName}`;
    link.download = currentFileName;
    link.style.display = 'none';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
});

function openPrivacyModal() {
    if (loadedPolicy) {
        const blocks = loadedPolicy.split('\n\n').filter(b => b.trim());
        privacyContent.innerHTML = blocks.map(block => `<p>${block.replace(/\n/g, '<br>')}</p>`).join('');
    } else {
        privacyContent.innerHTML = '<p>Политика временно недоступна.</p>';
    }
    privacyModal.classList.add('visible');
    toggleBodyScroll(true);
}

function closePrivacyModal() {
    privacyModal.classList.remove('visible');
    toggleBodyScroll(false);
}

privacyBtn.addEventListener('click', (e) => {
    e.preventDefault();
    openPrivacyModal();
});
closePrivacyBtn.addEventListener('click', closePrivacyModal);
privacyModal.addEventListener('click', (e) => {
    if (e.target === privacyModal) closePrivacyModal();
});

function setLightboxImage(src, callback) {
    if (isLightboxTransitioning) return;
    isLightboxTransitioning = true;
    lightboxImg.classList.add('fade-out');
    setTimeout(() => {
        lightboxImg.src = src;
        lightboxImg.onload = () => {
            lightboxImg.classList.remove('fade-out');
            isLightboxTransitioning = false;
            if (callback) callback();
        };
        setTimeout(() => {
            if (isLightboxTransitioning) {
                lightboxImg.classList.remove('fade-out');
                isLightboxTransitioning = false;
                if (callback) callback();
            }
        }, 600);
    }, 300);
}

function openLightbox(index) {
    if (!currentScreenshots.length) return;
    lightboxIndex = Math.max(0, Math.min(index, currentScreenshots.length - 1));
    lightboxImg.src = currentScreenshots[lightboxIndex];
    lightboxImg.classList.remove('fade-out');
    lightboxModal.classList.add('visible');
    toggleBodyScroll(true);
    updateLightboxNav();
}

function closeLightboxFn() {
    lightboxModal.classList.remove('visible');
    lightboxImg.src = '';
    toggleBodyScroll(false);
}

function updateLightboxNav() {
    if (currentScreenshots.length <= 1) {
        lightboxPrev.classList.add('hidden');
        lightboxNext.classList.add('hidden');
        return;
    }
    lightboxPrev.classList.toggle('hidden', lightboxIndex === 0);
    lightboxNext.classList.toggle('hidden', lightboxIndex === currentScreenshots.length - 1);
}

function lightboxPrevImage() {
    if (lightboxIndex > 0 && !isLightboxTransitioning) {
        lightboxIndex--;
        setLightboxImage(currentScreenshots[lightboxIndex], updateLightboxNav);
    }
}

function lightboxNextImage() {
    if (lightboxIndex < currentScreenshots.length - 1 && !isLightboxTransitioning) {
        lightboxIndex++;
        setLightboxImage(currentScreenshots[lightboxIndex], updateLightboxNav);
    }
}

lightboxPrev.addEventListener('click', lightboxPrevImage);
lightboxNext.addEventListener('click', lightboxNextImage);
closeLightbox.addEventListener('click', closeLightboxFn);
lightboxModal.addEventListener('click', (e) => {
    if (e.target === lightboxModal) closeLightboxFn();
});

document.addEventListener('keydown', (e) => {
    if (!lightboxModal.classList.contains('visible')) return;
    if (e.key === 'ArrowLeft') lightboxPrevImage();
    else if (e.key === 'ArrowRight') lightboxNextImage();
    else if (e.key === 'Escape') closeLightboxFn();
});

galleryLeft.addEventListener('click', () => scrollGallery(-1));
galleryRight.addEventListener('click', () => scrollGallery(1));
screenshotStrip.addEventListener('scroll', () => updateGalleryArrows());
window.addEventListener('resize', () => updateGalleryArrows());

async function prepareApp() {
    loadingOverlay.classList.remove('hidden');
    let remoteVersion = null;
    try {
        const resp = await fetch(versionURL);
        const text = await resp.text();
        remoteVersion = parseInt(text.trim(), 10);
        if (isNaN(remoteVersion)) remoteVersion = null;
    } catch {}

    const storedVersion = localStorage.getItem('app_version');
    const storedNum = storedVersion ? parseInt(storedVersion, 10) : null;

    const policyText = await fetchText('POLITICS.txt');
    if (policyText) loadedPolicy = policyText;

    currentInstruction = await loadInstruction(currentOS);
    if (currentInstruction?.desc) {
        const fetched = await fetchText(`${currentOS}/${currentInstruction.desc}`);
        if (fetched) loadedDesc = fetched;
    }
    if (!loadedDesc) loadedDesc = appMeta[currentOS].fullDesc;

    loadingOverlay.classList.add('hidden');

    if (remoteVersion !== null) {
        if (storedNum === null) {
            showNotification('Добро пожаловать в Dynamic Installer',
                'Dynamic Browser - это лёгкий браузер, который работает без трекинга, телеметрии и скрытых процессов.',
                () => {
                    localStorage.setItem('app_version', remoteVersion);
                    refreshUI();
                });
            return;
        }
        if (storedNum !== remoteVersion) {
            showNotification('Доступна новая версия!',
                'В этой версии были исправлены некоторые ошибки и добавлены новые функции.',
                () => {
                    localStorage.setItem('app_version', remoteVersion);
                    refreshUI();
                });
            return;
        }
    }
    refreshUI();
}

function showNotification(title, message, callback) {
    notifTitle.innerText = title;
    notifText.innerText = message;
    notificationModal.classList.add('visible');
    toggleBodyScroll(true);
    notifOkBtn.onclick = () => {
        notificationModal.classList.remove('visible');
        toggleBodyScroll(false);
        if (callback) callback();
    };
}

prepareApp();
