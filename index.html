<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Dynamic Browser | Professional Installer</title>
    <link rel="icon" href="Logo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-void: #000000;
            --glass-matte: rgba(0, 0, 0, 0.55);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-border-active: rgba(255, 255, 255, 0.25);
            --accent-white: #ffffff;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --text-tertiary: rgba(255, 255, 255, 0.4);
            --radius-xl: 36px;
            --radius-lg: 28px;
            --radius-md: 20px;
            --shadow-elevated: 0 20px 35px -12px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.05);
            --transition-smooth: cubic-bezier(0.2, 0.9, 0.4, 1.1);
            --glow-effect: 0 0 12px rgba(255, 255, 255, 0.2);
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg-void);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        canvas#bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 0;
            pointer-events: none;
            will-change: transform;
        }

        .installer-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
        }

        /* platform selection */
        .platform-view {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 70vh;
            gap: 56px;
            transition: opacity 0.5s var(--transition-smooth), transform 0.5s var(--transition-smooth);
        }

        .platform-view.hidden {
            display: none;
        }

        .brand-mark {
            text-align: center;
        }

        .brand-mark i {
            font-size: 3.2rem;
            background: linear-gradient(135deg, #fff, #aaa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 16px;
            display: inline-block;
        }

        .brand-mark h2 {
            font-weight: 600;
            letter-spacing: 0.15em;
            font-size: 0.9rem;
            color: var(--text-tertiary);
            text-transform: uppercase;
        }

        .platform-grid {
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .platform-card {
            background: var(--glass-matte);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 56px;
            padding: 32px 48px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            cursor: pointer;
            transition: all 0.4s var(--transition-smooth);
            min-width: 220px;
            box-shadow: var(--shadow-elevated);
        }

        .platform-card i {
            font-size: 3rem;
            transition: transform 0.2s;
        }

        .platform-card span {
            font-weight: 700;
            font-size: 1.5rem;
            letter-spacing: -0.02em;
        }

        .platform-card:hover {
            transform: translateY(-8px);
            border-color: var(--glass-border-active);
            background: rgba(0, 0, 0, 0.75);
            box-shadow: 0 30px 45px -15px black, 0 0 0 1px rgba(255, 255, 255, 0.15);
        }

        /* store detail view */
        .store-view {
            display: none;
            flex-direction: column;
            gap: 28px;
            animation: revealUp 0.6s var(--transition-smooth);
        }

        .store-view.visible {
            display: flex;
        }

        @keyframes revealUp {
            from {
                opacity: 0;
                transform: translateY(30px);
                filter: blur(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        .nav-control {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
            width: fit-content;
            border-radius: 60px;
            padding: 8px 24px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
            border: 1px solid var(--glass-border);
            cursor: pointer;
            transition: all 0.25s;
        }

        .nav-control:hover {
            background: rgba(0, 0, 0, 0.8);
            border-color: var(--glass-border-active);
            transform: translateX(-6px);
        }

        .hero-section {
            background: var(--glass-matte);
            backdrop-filter: blur(24px);
            border-radius: var(--radius-xl);
            padding: 32px;
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-elevated);
            display: flex;
            gap: 32px;
            flex-wrap: wrap;
        }

        .app-icon-lg {
            width: 124px;
            height: 124px;
            border-radius: 32px;
            object-fit: cover;
            background: #0a0a0a;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.6);
        }

        .app-details {
            flex: 1;
        }

        .app-title {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #ffffff, #c0c0c0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 8px;
        }

        .app-tagline {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 28px;
        }

        .install-actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .format-switch {
            display: flex;
            gap: 12px;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px;
            border-radius: 60px;
        }

        .format-btn {
            background: transparent;
            border: none;
            padding: 8px 24px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: 0.2s;
        }

        .format-btn.active {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            box-shadow: var(--glow-effect);
        }

        .btn-download {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.05));
            border: 1px solid rgba(255, 255, 255, 0.55);
            border-radius: 60px;
            padding: 14px 36px;
            font-weight: 800;
            font-size: 1rem;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(8px);
        }

        .btn-download:hover {
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.28);
            border-color: white;
            box-shadow: 0 15px 25px -10px black;
        }

        .version-chip {
            background: rgba(0, 0, 0, 0.6);
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: 500;
            margin-left: 8px;
        }

        .file-meta {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: rgba(0, 0, 0, 0.5);
            padding: 6px 20px;
            border-radius: 60px;
            font-size: 0.8rem;
            margin-top: 10px;
        }

        .file-toggle {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 0.7rem;
            cursor: pointer;
            text-decoration: underline;
        }

        .file-full {
            display: none;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 24px;
            padding: 10px 18px;
            font-size: 0.75rem;
            word-break: break-all;
            margin-top: 8px;
        }

        /* cards */
        .info-card {
            background: var(--glass-matte);
            backdrop-filter: blur(18px);
            border-radius: var(--radius-lg);
            padding: 24px 28px;
            border: 1px solid var(--glass-border);
        }

        .card-header {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--text-tertiary);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .screenshot-strip {
            display: flex;
            overflow-x: auto;
            gap: 18px;
            padding-bottom: 12px;
            scrollbar-width: thin;
        }

        .screenshot-strip img {
            height: 210px;
            border-radius: 20px;
            flex-shrink: 0;
            border: 1px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: all 0.2s;
        }

        .screenshot-strip img:hover {
            transform: scale(1.02);
            border-color: white;
        }

        .desc-wrapper {
            overflow: hidden;
            transition: max-height 0.45s var(--transition-smooth);
        }

        .desc-text {
            color: var(--text-secondary);
            line-height: 1.65;
            font-size: 0.95rem;
        }

        .expand-btn {
            background: none;
            border: none;
            color: white;
            font-weight: 600;
            font-size: 0.8rem;
            margin-top: 12px;
            cursor: pointer;
            opacity: 0.7;
        }

        .permissions-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .perm-item {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 0.9rem;
            color: var(--text-secondary);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding: 8px 0;
        }

        .footer {
            text-align: center;
            padding: 20px 0 10px;
            font-size: 0.7rem;
            color: var(--text-tertiary);
        }

        .footer a {
            color: white;
            margin: 0 10px;
            text-decoration: none;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(90px);
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(28px);
            padding: 12px 28px;
            border-radius: 60px;
            display: flex;
            gap: 12px;
            align-items: center;
            font-weight: 600;
            z-index: 300;
            transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.2);
            border: 1px solid rgba(255, 255, 255, 0.25);
        }

        .toast.visible {
            transform: translateX(-50%) translateY(0);
        }

        .modal, .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(24px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: 0.3s;
        }

        .modal.visible, .lightbox.visible {
            opacity: 1;
            visibility: visible;
        }

        .modal-card {
            background: rgba(0, 0, 0, 0.96);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 48px;
            max-width: 560px;
            width: 90%;
            padding: 32px;
            position: relative;
            transform: scale(0.95);
            transition: transform 0.3s;
        }

        .modal.visible .modal-card {
            transform: scale(1);
        }

        .lightbox-img {
            max-width: 90vw;
            max-height: 85vh;
            border-radius: 28px;
            box-shadow: 0 30px 50px black;
        }

        .close-icon {
            position: absolute;
            top: 20px;
            right: 28px;
            font-size: 32px;
            background: none;
            border: none;
            color: white;
            cursor: pointer;
        }

        @media (max-width: 720px) {
            .hero-section { flex-direction: column; align-items: center; text-align: center; }
            .install-actions { justify-content: center; }
            .app-title { font-size: 1.8rem; }
            .platform-card { padding: 24px 32px; min-width: 160px; }
            .screenshot-strip img { height: 150px; }
        }
    </style>
</head>
<body>
<canvas id="bg-canvas"></canvas>
<div class="installer-container">
    <div class="platform-view" id="platformView">
        <div class="brand-mark">

        <div class="info-card">

</div>

<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.128.0/build/three.module.js" } }</script>
<script type="module">
import * as THREE from 'three';

let scene, camera, renderer, waveMesh, stars, geometry, time = 0, animId = null, contextLost = false;
let isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
let lowPerformance = false;

const canvas = document.getElementById('bg-canvas');

function initThree() {
    if (renderer) {
        if (animId) cancelAnimationFrame(animId);
        if (renderer.domElement?.parentNode) renderer.domElement.remove();
    }
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);
    scene.fog = new THREE.FogExp2(0x000000, 0.008);
    
    const aspect = window.innerWidth / window.innerHeight;
    camera = new THREE.PerspectiveCanvas(42, aspect, 0.1, 1000);
    camera.position.set(10, 6.5, 12);
    camera.lookAt(0, 0.2, 0);
    
    renderer = new THREE.WebGLRenderer({ canvas, alpha: false, antialias: !isMobile, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, isMobile ? 1.2 : 2));
    
    canvas.addEventListener('webglcontextlost', (e) => { e.preventDefault(); contextLost = true; if (animId) cancelAnimationFrame(animId); animId = null; });
    canvas.addEventListener('webglcontextrestored', () => { contextLost = false; initThree(); });
    
    let segments = isMobile ? 22 : 32;
    if (lowPerformance) segments = 18;
    const planeSize = 18;
    geometry = new THREE.PlaneGeometry(planeSize, planeSize, segments, segments);
    geometry.rotateX(-Math.PI / 2);
    const positions = geometry.attributes.position.array;
    for (let i = 0; i < positions.length / 3; i++) positions[i*3+1] = 0;
    
    waveMesh = new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({ color: 0xffffff, wireframe: true, emissive: 0x111111, roughness: 0.5, metalness: 0.7 }));
    scene.add(waveMesh);
    
    const ambient = new THREE.AmbientLight(0x222222);
    scene.add(ambient);
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.1);
    dirLight.position.set(5, 8, 6);
    scene.add(dirLight);
    const backLight = new THREE.PointLight(0x555555, 0.4);
    backLight.position.set(-2, 3, -4);
    scene.add(backLight);
    
    const grid = new THREE.GridHelper(24, 20, 0xffffff, 0x3a3a3a);
    grid.position.y = -2.0;
    grid.material.transparent = true;
    grid.material.opacity = 0.15;
    scene.add(grid);
    
    const starCount = isMobile ? 280 : 550;
    const starGeo = new THREE.BufferGeometry();
    const starPositions = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount; i++) {
        starPositions[i*3] = (Math.random() - 0.5) * 200;
        starPositions[i*3+1] = (Math.random() - 0.5) * 55;
        starPositions[i*3+2] = (Math.random() - 0.5) * 80 - 35;
    }
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: isMobile ? 0.06 : 0.08, transparent: true, opacity: 0.55 }));
    scene.add(stars);
    
    animate();
}

function animateWave() {
    if (!geometry || contextLost) return;
    time += 0.016;
    const posAttr = geometry.attributes.position;
    const array = posAttr.array;
    const seg = isMobile ? 22 : 32;
    const planeW = 18, planeH = 18;
    for (let i = 0; i <= seg; i++) {
        const x = (i / seg - 0.5) * planeW;
        for (let j = 0; j <= seg; j++) {
            const z = (j / seg - 0.5) * planeH;
            const idx = (j * (seg + 1) + i) * 3;
            const y1 = Math.sin(x * 0.8 + time) * Math.cos(z * 0.7 + time * 0.65) * 0.5;
            const y2 = Math.sin(x * 1.5 - time * 1.0) * 0.25;
            const y3 = Math.cos(z * 1.3 + time * 0.8) * 0.25;
            const y4 = Math.sin((x * 1.1 + z * 1.1) * 0.6 + time * 1.2) * 0.2;
            array[idx + 1] = y1 + y2 + y3 + y4;
        }
    }
    posAttr.needsUpdate = true;
    geometry.computeVertexNormals();
}

function animate() {
    if (!contextLost) {
        animateWave();
        if (stars) {
            stars.rotation.y += 0.0003;
            stars.rotation.x += 0.0002;
        }
        if (camera) camera.lookAt(0, 0.3, 0);
        if (renderer && scene && camera) renderer.render(scene, camera);
    }
    animId = requestAnimationFrame(animate);
}

window.addEventListener('resize', () => {
    if (camera) {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
    }
    if (renderer) renderer.setSize(window.innerWidth, window.innerHeight);
});

document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
        if (animId) cancelAnimationFrame(animId);
        animId = null;
    } else if (!animId && !contextLost) animate();
});

try {
    initThree();
} catch(e) {
    lowPerformance = true;
    initThree();
}

const appData = {
    Windows: {
        title: 'Dynamic Browser for Windows',
        short: 'Максимальная скорость, приватность и стиль.',
        fullDesc: 'Полностью переработанный браузер с нулевым слежением, встроенным VPN-модулем, энергоэффективным режимом и адаптивным интерфейсом. Поддержка тем, расширений и жестов мыши. Идеален для работы и развлечений.',
        formats: ['exe', 'zip'],
        sizes: { exe: '48.2 MB', zip: '32.5 MB' },
        defaultFormat: 'exe',
        permissions: ['Доступ в сеть', 'Сохранение файлов', 'Геолокация (по запросу)']
    },
    Android: {
        title: 'Dynamic Browser for Android',
        short: 'Лёгкий, безопасный, современный.',
        fullDesc: 'Мобильный браузер с интеллектуальной экономией трафика, ночной темой, блокировщиком рекламы и надёжной защитой от фишинга. Работает плавно даже на старых устройствах.',
        formats: ['apk'],
        sizes: { apk: '28.3 MB' },
        defaultFormat: 'apk',
        permissions: ['Интернет', 'Хранилище', 'Геопозиция', 'Уведомления']
    }
};

let currentOS = null, currentFormat = 'exe', instructionData = null, fileName = '', fileSize = '', lastDescText = '';
const platformView = document.getElementById('platformView'), storeView = document.getElementById('storeView');
const appTitle = document.getElementById('appTitle'), appTagline = document.getElementById('appTagline'), descText = document.getElementById('descText'), permList = document.getElementById('permissionsList');
const formatSwitch = document.getElementById('formatSwitch'), downloadBtn = document.getElementById('downloadBtn'), versionBadge = document.getElementById('versionBadge');
const fileMetaDiv = document.getElementById('fileMeta'), fileNameShortSpan = document.getElementById('fileNameShort'), fileToggle = document.getElementById('fileToggle'), fileFullDiv = document.getElementById('fileFull');
const screenshotStrip = document.getElementById('screenshotStrip'), descWrapper = document.getElementById('descWrapper'), expandDescBtn = document.getElementById('expandDescBtn');
const backBtn = document.getElementById('backBtn'), toastMsg = document.getElementById('toastMsg'), toastTextSpan = document.getElementById('toastText');
const privacyModal = document.getElementById('privacyModal'), privacyContent = document.getElementById('privacyContent'), privacyLink = document.getElementById('privacyLink'), closeModal = document.getElementById('closeModal');
const lightbox = document.getElementById('lightbox'), lightboxImg = document.getElementById('lightboxImg'), closeLightbox = document.getElementById('closeLightbox');

function showToast(msg) { toastTextSpan.innerText = msg; toastMsg.classList.add('visible'); clearTimeout(window._toastTimer); window._toastTimer = setTimeout(() => toastMsg.classList.remove('visible'), 2700); }
function truncName(str, len=38) { return str.length <= len ? str : str.slice(0,len)+'…'; }
function updateFileUI() { if (!fileName) { fileMetaDiv.style.display = 'none'; return; } fileMetaDiv.style.display = 'flex'; fileNameShortSpan.innerText = truncName(fileName); fileFullDiv.innerText = `${fileName} (${fileSize})`; if (fileName.length <= 38) fileToggle.style.display = 'none'; else { fileToggle.style.display = 'inline-block'; fileFullDiv.classList.remove('visible'); } }
fileToggle.addEventListener('click', () => { if (fileFullDiv.classList.contains('visible')) { fileFullDiv.classList.remove('visible'); fileToggle.innerText = 'подробнее'; } else { fileFullDiv.classList.add('visible'); fileToggle.innerText = 'свернуть'; } });
function resetDesc() { descWrapper.style.maxHeight = 'none'; expandDescBtn.style.display = 'none'; expandDescBtn.innerText = 'Развернуть'; expandDescBtn.dataset.exp = 'false'; }
function setupDesc() { if (descText.innerText === lastDescText) return; lastDescText = descText.innerText; resetDesc(); requestAnimationFrame(() => { const lineH = parseFloat(getComputedStyle(descText).lineHeight); if (!lineH) return; const maxH = lineH * 5; if (descText.scrollHeight > maxH + 2) { descWrapper.style.maxHeight = maxH + 'px'; expandDescBtn.style.display = 'inline-block'; expandDescBtn.dataset.exp = 'false'; expandDescBtn.innerText = 'Развернуть'; } else { descWrapper.style.maxHeight = 'none'; expandDescBtn.style.display = 'none'; } }); }
expandDescBtn.addEventListener('click', () => { const expanded = expandDescBtn.dataset.exp === 'true'; const lineH = parseFloat(getComputedStyle(descText).lineHeight); if (expanded) { descWrapper.style.maxHeight = (lineH * 5) + 'px'; expandDescBtn.innerText = 'Развернуть'; expandDescBtn.dataset.exp = 'false'; } else { descWrapper.style.maxHeight = descText.scrollHeight + 'px'; expandDescBtn.innerText = 'Свернуть'; expandDescBtn.dataset.exp = 'true'; } });
async function fetchJSON(url) { try { const r = await fetch(url); return r.ok ? await r.json() : null; } catch { return null; } }
async function fetchText(url) { try { const r = await fetch(url); return r.ok ? await r.text() : null; } catch { return null; } }
async function loadInstruction(os) { return await fetchJSON(`${os}/instruction.json`); }
async function loadScreenshots(base, imagesMap) { if (!imagesMap) return []; const urls = []; for (const key of Object.keys(imagesMap).sort((a,b)=> (parseInt(a.match(/\d+/)?.[0]||0) - parseInt(b.match(/\d+/)?.[0]||0)))) { const src = `${base}/${imagesMap[key]}`; const tester = new Image(); await new Promise(res => { tester.onload = () => res(true); tester.onerror = () => res(false); tester.src = src; }); if (tester.complete && tester.naturalWidth) urls.push(src); } return urls; }
function renderScreenshots(images) { screenshotStrip.innerHTML = images.length ? images.map(src => `<img src="${src}" class="screenshot-img" loading="lazy">`).join('') : '<div style="color:rgba(255,255,255,0.4); padding:12px;">Нет скриншотов</div>'; document.querySelectorAll('.screenshot-img').forEach(img => img.addEventListener('click', (e) => { lightboxImg.src = img.src; lightbox.classList.add('visible'); })); }
async function updateUI() {
    if (!currentOS) {
        if (!platformView.classList.contains('hidden')) return;
        storeView.classList.remove('visible'); platformView.classList.remove('hidden'); platformView.style.opacity = '1'; platformView.style.transform = 'none';
        return;
    }
    const data = appData[currentOS];
    appTitle.innerText = data.title; appTagline.innerText = data.short;
    instructionData = await loadInstruction(currentOS);
    let desc = data.fullDesc;
    if (instructionData?.desc) { const fetched = await fetchText(`${currentOS}/${instructionData.desc}`); if (fetched) desc = fetched; }
    descText.innerText = desc;
    permList.innerHTML = data.permissions.map(p => `<div class="perm-item"><i class="fas fa-check-circle"></i> ${p}</div>`).join('');
    const ver = instructionData?.version || '3.2.1';
    let fname = '';
    if (instructionData?.app) { if (currentOS === 'Windows') fname = currentFormat === 'exe' ? instructionData.exe : instructionData.zip; else fname = instructionData.app; }
    if (!fname) fname = currentOS === 'Windows' ? (currentFormat === 'exe' ? `dynamic-browser-setup-${ver}.exe` : `dynamic-browser-portable-${ver}.zip`) : `dynamic-browser-${ver}.apk`;
    const size = data.sizes[currentFormat] || '';
    fileName = fname; fileSize = size;
    if (currentOS === 'Windows') { formatSwitch.style.display = 'flex'; document.querySelectorAll('.format-btn').forEach(btn => btn.classList.remove('active')); document.querySelector(`.format-btn[data-format="${currentFormat}"]`)?.classList.add('active'); versionBadge.innerText = `v${ver} · ${data.sizes[currentFormat]}`; } else { formatSwitch.style.display = 'none'; currentFormat = 'apk'; versionBadge.innerText = `v${ver} · ${data.sizes.apk}`; }
    updateFileUI();
    const screens = await loadScreenshots(currentOS, instructionData?.Images || null);
    renderScreenshots(screens);
    setupDesc();
    if (platformView.classList.contains('hidden') === false) {
        platformView.style.transition = 'opacity 0.5s ease, transform 0.5s';
        platformView.style.opacity = '0'; platformView.style.transform = 'scale(0.96) translateY(-15px)';
        setTimeout(() => { platformView.classList.add('hidden'); storeView.classList.add('visible'); storeView.style.animation = 'none'; storeView.offsetHeight; storeView.style.animation = 'revealUp 0.6s ease'; }, 480);
    }
}
document.querySelectorAll('.platform-card').forEach(card => { card.addEventListener('click', () => { const os = card.dataset.os; if (currentOS === os) return; currentOS = os; currentFormat = appData[os].defaultFormat; updateUI(); }); });
backBtn.addEventListener('click', () => { storeView.style.transition = 'opacity 0.4s, transform 0.4s'; storeView.style.opacity = '0'; storeView.style.transform = 'translateY(20px)'; setTimeout(() => { storeView.classList.remove('visible'); storeView.style.opacity = ''; storeView.style.transform = ''; platformView.classList.remove('hidden'); platformView.style.opacity = '0'; platformView.style.transform = 'translateY(-10px)'; platformView.style.transition = 'none'; platformView.offsetHeight; platformView.style.transition = 'opacity 0.5s ease, transform 0.5s'; platformView.style.opacity = '1'; platformView.style.transform = 'none'; currentOS = null; }, 400); });
formatSwitch.addEventListener('click', (e) => { if (currentOS !== 'Windows') return; const btn = e.target.closest('.format-btn'); if (btn && btn.dataset.format) { currentFormat = btn.dataset.format; updateUI(); } });
downloadBtn.addEventListener('click', () => { if (!currentOS || !fileName) return; showToast(`Загрузка ${fileName} (${fileSize})`); const a = document.createElement('a'); a.href = `https://dynamicbrowser.app/dl/${fileName}`; a.download = fileName; a.style.display = 'none'; document.body.appendChild(a); a.click(); document.body.removeChild(a); });
privacyLink.addEventListener('click', (e) => { e.preventDefault(); fetch('POLITICS.txt').then(r => r.ok ? r.text() : Promise.reject()).then(txt => { const blocks = txt.split('\n\n').filter(b => b.trim()); privacyContent.innerHTML = blocks.map(block => `<p style="margin-bottom:16px;">${block.replace(/\n/g, '<br>')}</p>`).join(''); }).catch(() => privacyContent.innerHTML = '<p>Не удалось загрузить политику.</p>'); privacyModal.classList.add('visible'); });
closeModal.addEventListener('click', () => privacyModal.classList.remove('visible')); privacyModal.addEventListener('click', (e) => { if (e.target === privacyModal) privacyModal.classList.remove('visible'); });
closeLightbox.addEventListener('click', () => { lightbox.classList.remove('visible'); lightboxImg.src = ''; }); lightbox.addEventListener('click', (e) => { if (e.target === lightbox) { lightbox.classList.remove('visible'); lightboxImg.src = ''; } });
updateUI();
</script>
</body>
</html>
