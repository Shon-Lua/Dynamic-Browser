<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Dynamic Browser | Ultimate Installer</title>
    <link rel="icon" href="Logo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        :root {
            --bg: #000000;
            --surface: rgba(0, 0, 0, 0.68);
            --surface-2: rgba(0, 0, 0, 0.82);
            --glass-blur: 24px;
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-border-active: rgba(255, 255, 255, 0.35);
            --accent: #ffffff;
            --text: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.75);
            --text-tertiary: rgba(255, 255, 255, 0.55);
            --radius-md: 20px;
            --radius-xl: 32px;
            --transition-smooth: cubic-bezier(0.2, 0.9, 0.4, 1.1);
            --shadow-strong: 0 25px 40px -12px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.05);
            --shadow-glow: 0 0 18px rgba(255, 255, 255, 0.15);
        }
        html {
            scroll-behavior: smooth;
            font-size: 16px;
            height: 100%;
            color-scheme: dark;
        }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #000000;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 32px 24px;
            -webkit-font-smoothing: antialiased;
            position: relative;
            overflow-y: auto;
            isolation: isolate;
        }
        canvas#wave-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 0;
            pointer-events: none;
            will-change: transform;
        }
        .container {
            position: relative;
            z-index: 3;
            width: 100%;
            max-width: 920px;
            margin: 0 auto;
        }
        .platform-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 48px;
            width: 100%;
            min-height: 70vh;
            will-change: transform, opacity;
        }
        .platform-screen.hidden {
            display: none;
        }
        .platform-badge {
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 100px;
            padding: 12px 32px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-size: 0.85rem;
            color: var(--text-secondary);
            box-shadow: var(--shadow-glow);
        }
        .platform-cards {
            display: flex;
            gap: 32px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }
        .platform-card {
            background: var(--surface);
            backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            padding: 42px 36px;
            cursor: pointer;
            transition: all 0.4s var(--transition-smooth);
            text-align: center;
            min-width: 220px;
            flex: 1 1 220px;
            max-width: 260px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
            position: relative;
            transform: translateY(0);
        }
        .platform-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1px;
            background: radial-gradient(circle at 30% 20%, rgba(255,255,255,0.3), transparent 70%);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.4s;
        }
        .platform-card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: var(--glass-border-active);
            background: rgba(0, 0, 0, 0.85);
            box-shadow: 0 30px 45px -15px black, 0 0 0 1px rgba(255,255,255,0.2);
        }
        .platform-card:hover::before {
            opacity: 1;
        }
        .platform-card:active {
            transform: scale(0.98);
        }
        .platform-card i {
            font-size: 3.4rem;
            filter: drop-shadow(0 0 8px rgba(255,255,255,0.3));
            margin-bottom: 20px;
            display: block;
            transition: transform 0.2s;
        }
        .platform-card:hover i {
            transform: scale(1.02);
        }
        .platform-card span {
            font-weight: 700;
            font-size: 1.5rem;
            letter-spacing: -0.02em;
        }
        .store-view {
            display: none;
            flex-direction: column;
            gap: 28px;
            width: 100%;
            will-change: transform, opacity;
        }
        .store-view.visible {
            display: flex;
        }
        .back-btn {
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            color: var(--text-secondary);
            border-radius: 60px;
            padding: 10px 24px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            width: fit-content;
            letter-spacing: 0.01em;
        }
        .back-btn i {
            font-size: 0.9rem;
            transition: transform 0.2s;
        }
        .back-btn:hover {
            background: rgba(0, 0, 0, 0.85);
            border-color: var(--glass-border-active);
            color: white;
            transform: translateX(-5px);
        }
        .back-btn:hover i {
            transform: translateX(-3px);
        }
        .app-header {
            display: flex;
            gap: 28px;
            align-items: center;
            background: var(--surface);
            backdrop-filter: blur(var(--glass-blur));
            border-radius: var(--radius-xl);
            padding: 28px 32px;
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-strong);
        }
        .app-icon {
            width: 100px;
            height: 100px;
            border-radius: 24px;
            object-fit: cover;
            background: #0a0a0a;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.3s ease;
        }
        .app-icon:hover {
            transform: scale(1.02);
        }
        .app-info {
            flex: 1;
        }
        .app-name {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #fff 30%, #aaaaaa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 6px;
        }
        .app-short-desc {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 20px;
            font-weight: 450;
        }
        .download-area {
            display: flex;
            gap: 18px;
            align-items: center;
            flex-wrap: wrap;
        }
        .format-selector {
            display: flex;
            gap: 12px;
            background: rgba(0,0,0,0.4);
            padding: 4px;
            border-radius: 60px;
            backdrop-filter: blur(4px);
        }
        .format-chip {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            padding: 8px 20px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-secondary);
        }
        .format-chip.active {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            border-color: var(--glass-border-active);
            box-shadow: 0 0 12px rgba(255,255,255,0.3);
        }
        .btn-install {
            background: linear-gradient(135deg, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0.08) 100%);
            backdrop-filter: blur(16px);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.45);
            border-radius: 60px;
            padding: 14px 34px;
            font-weight: 800;
            font-size: 1.05rem;
            cursor: pointer;
            transition: all 0.35s var(--transition-smooth);
            display: inline-flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            position: relative;
            overflow: hidden;
        }
        .btn-install::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -60%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.5s;
        }
        .btn-install:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.8);
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 20px 35px -8px black, 0 0 20px rgba(255,255,255,0.25);
        }
        .btn-install:hover::after {
            opacity: 1;
        }
        .btn-install:active {
            transform: scale(0.97);
        }
        .install-meta {
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 0.02em;
            background: rgba(0,0,0,0.5);
            padding: 2px 8px;
            border-radius: 40px;
        }
        .file-info-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 12px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(12px);
            padding: 6px 16px;
            border-radius: 50px;
            width: fit-content;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .file-name-short {
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.01em;
        }
        .file-toggle-btn {
            background: none;
            border: none;
            color: #ccc;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: color 0.2s;
        }
        .file-toggle-btn:hover {
            color: white;
            text-decoration: underline;
        }
        .file-full-info {
            display: none;
            margin-top: 8px;
            font-size: 0.8rem;
            background: rgba(0,0,0,0.7);
            padding: 10px 16px;
            border-radius: 24px;
            word-break: break-all;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .file-full-info.visible {
            display: block;
        }
        .screenshots-section, .description-card, .permissions-card {
            background: var(--surface);
            backdrop-filter: blur(var(--glass-blur));
            border-radius: var(--radius-xl);
            padding: 24px 28px;
            border: 1px solid var(--glass-border);
            transition: all 0.2s;
        }
        .section-label {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--text-tertiary);
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .section-label i {
            font-size: 0.9rem;
        }
        .screenshots-scroll {
            display: flex;
            overflow-x: auto;
            gap: 16px;
            padding-bottom: 8px;
            scrollbar-width: thin;
        }
        .screenshot-img {
            border-radius: 20px;
            max-height: 280px;
            flex-shrink: 0;
            box-shadow: 0 10px 22px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.2);
            cursor: pointer;
            transition: all 0.2s;
        }
        .screenshot-img:hover {
            transform: scale(1.02);
            border-color: white;
        }
        .description-text-wrapper {
            overflow: hidden;
            transition: max-height 0.45s var(--transition-smooth);
        }
        .description-text {
            font-size: 0.95rem;
            color: var(--text-secondary);
            line-height: 1.65;
        }
        .expand-btn {
            background: none;
            border: none;
            color: var(--accent);
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            margin-top: 12px;
            opacity: 0.8;
            transition: opacity 0.2s;
        }
        .expand-btn:hover {
            opacity: 1;
            text-decoration: underline;
        }
        .permission-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
        .permission-item i {
            width: 20px;
            color: white;
        }
        .footer {
            text-align: center;
            padding: 24px 0 12px;
            font-size: 0.75rem;
            color: var(--text-tertiary);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            margin-top: 12px;
        }
        .footer a {
            color: white;
            text-decoration: none;
            margin: 0 8px;
            transition: color 0.2s;
        }
        .footer a:hover {
            text-decoration: underline;
        }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(90px);
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 60px;
            padding: 14px 32px;
            color: white;
            font-weight: 600;
            z-index: 200;
            transition: transform 0.4s cubic-bezier(0.2,0.9,0.4,1.2);
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: var(--shadow-strong);
        }
        .toast.visible {
            transform: translateX(-50%) translateY(0);
        }
        .modal-overlay, .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(18px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s;
        }
        .modal-overlay.modal--visible, .lightbox.visible {
            opacity: 1;
            visibility: visible;
        }
        .modal-content {
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 36px;
            max-width: 580px;
            width: 90%;
            transform: scale(0.95);
            transition: transform 0.3s;
        }
        .modal-overlay.modal--visible .modal-content {
            transform: scale(1);
        }
        .modal-scroll {
            max-height: 70vh;
            overflow-y: auto;
            padding: 28px;
        }
        .modal-close {
            position: absolute;
            top: 18px;
            right: 22px;
            font-size: 28px;
            background: none;
            border: none;
            color: white;
            cursor: pointer;
        }
        .lightbox-img {
            max-width: 90vw;
            max-height: 85vh;
            border-radius: 28px;
            box-shadow: 0 30px 50px black;
        }
        .lightbox-close {
            position: absolute;
            top: 28px;
            right: 34px;
            font-size: 40px;
            background: none;
            border: none;
            color: white;
            cursor: pointer;
        }
        @media (max-width: 680px) {
            body { padding: 20px 16px; }
            .app-header { flex-direction: column; text-align: center; padding: 24px; }
            .download-area { justify-content: center; }
            .platform-card { padding: 28px 20px; min-width: 160px; }
            .app-name { font-size: 1.8rem; }
        }
    </style>
</head>
<body>
<canvas id="wave-canvas"></canvas>
<div class="container">
    <div class="platform-screen" id="platformScreen">
        <div class="platform-badge"><i class="fas fa-crown" style="margin-right: 6px;"></i> DYNAMIC INSTALLER</div>
        <div class="platform-cards" id="platformCards">
            <div class="platform-card" data-os="Windows"><i class="fab fa-windows"></i><span>Windows</span></div>
            <div class="platform-card" data-os="Android"><i class="fab fa-android"></i><span>Android</span></div>
        </div>
    </div>
    <div class="store-view" id="storeView">
        <button class="back-btn" id="backBtn"><i class="fas fa-chevron-left"></i> Назад</button>
        <div class="app-header">
            <img src="Logo.png" alt="Dynamic Browser" class="app-icon" id="appIcon">
            <div class="app-info">
                <h1 class="app-name" id="appName">Dynamic Browser</h1>
                <p class="app-short-desc" id="appShortDesc"></p>
                <div class="download-area">
                    <div class="format-selector" id="formatSelector" style="display: none;">
                        <span class="format-chip active" data-format="exe">.exe</span>
                        <span class="format-chip" data-format="zip">.zip</span>
                    </div>
                    <button class="btn-install" id="btnInstall"><i class="fas fa-download"></i> Скачать <span class="install-meta" id="installMeta"></span></button>
                </div>

                    <span class="file-name-short" id="fileNameShort"></span>

                </div>
                <div class="file-full-info" id="fileFullInfo"></div>
            </div>
        </div>
        <div class="screenshots-section"><h3 class="section-label"><i class="fas fa-images"></i> СКРИНШОТЫ</h3><div class="screenshots-scroll" id="screenshotsContainer"></div></div>
        <div class="description-card"><h3 class="section-label"><i class="fas fa-info-circle"></i> ОПИСАНИЕ</h3><div class="description-text-wrapper" id="descWrapper"><p class="description-text" id="fullDesc"></p></div><button class="expand-btn" id="expandDescBtn" style="display:none;">Развернуть</button></div>
        <div class="permissions-card"><h3 class="section-label"><i class="fas fa-shield-alt"></i> ПРАВА ДОСТУПА</h3><div id="permissionsList"></div></div>
        <div class="footer">© 2026 Dynamic Browser. <a href="#" id="privacyLink">Политика конфиденциальности</a> <a href="https://github.com/Shon-Lua/Dynamic-Browser" target="_blank">GitHub</a></div>
    </div>
</div>
<div class="toast" id="toast"><i class="fas fa-check-circle"></i><span id="toastMessage"></span></div>
<div class="modal-overlay" id="privacyModal"><div class="modal-content"><button class="modal-close" id="modalClose">&times;</button><div class="modal-scroll"><div id="modalBody"></div></div></div></div>
<div class="lightbox" id="lightbox"><button class="lightbox-close" id="lightboxClose">&times;</button><img class="lightbox-img" id="lightboxImg" alt="preview"></div>

<script type="module">
import * as THREE from 'three';
let scene, camera, renderer, waveMesh, stars, geometry, originalY, time = 0, animationId = null, contextLost = false;
const canvas = document.getElementById('wave-canvas');
function initThree() {
    if (renderer) { if (animationId) cancelAnimationFrame(animationId); if (renderer.domElement?.parentNode) renderer.domElement.remove(); }
    scene = new THREE.Scene(); scene.background = new THREE.Color(0x000000); scene.fog = new THREE.FogExp2(0x000000, 0.012);
    camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(12, 8, 14); camera.lookAt(0, 0, 0);
    renderer = new THREE.WebGLRenderer({ canvas, alpha: false, antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight); renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    canvas.addEventListener('webglcontextlost', (e) => { e.preventDefault(); contextLost = true; if (animationId) cancelAnimationFrame(animationId); animationId = null; });
    canvas.addEventListener('webglcontextrestored', () => { contextLost = false; initThree(); });
    const widthSegments = 45, heightSegments = 45, planeWidth = 18, planeHeight = 18;
    geometry = new THREE.PlaneGeometry(planeWidth, planeHeight, widthSegments, heightSegments);
    geometry.rotateX(-Math.PI / 2);
    const positions = geometry.attributes.position.array;
    originalY = new Float32Array(positions.length / 3);
    for (let i = 0; i < positions.length / 3; i++) originalY[i] = positions[i*3 + 1];
    waveMesh = new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({ color: 0xffffff, wireframe: true, emissive: 0x111111, roughness: 0.4, metalness: 0.8 }));
    scene.add(waveMesh);
    const ambientLight = new THREE.AmbientLight(0x222222); scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 1); dirLight.position.set(5, 10, 7); scene.add(dirLight);
    const backLight = new THREE.DirectionalLight(0xffffff, 0.5); backLight.position.set(-3, 5, -5); scene.add(backLight);
    const gridHelper = new THREE.GridHelper(25, 20, 0xffffff, 0x444444); gridHelper.position.y = -2.2; gridHelper.material.transparent = true; gridHelper.material.opacity = 0.2; scene.add(gridHelper);
    const starGeometry = new THREE.BufferGeometry(); const starCount = 600; const starPositions = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount; i++) { starPositions[i*3] = (Math.random() - 0.5) * 200; starPositions[i*3+1] = (Math.random() - 0.5) * 60; starPositions[i*3+2] = (Math.random() - 0.5) * 80 - 40; }
    starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    stars = new THREE.Points(starGeometry, new THREE.PointsMaterial({ color: 0xffffff, size: 0.08, transparent: true, opacity: 0.6 }));
    scene.add(stars);
    animate();
}
function animateWave() {
    if (!geometry || contextLost) return;
    time += 0.018;
    const positionsAttr = geometry.attributes.position, array = positionsAttr.array;
    const widthSeg = 45, heightSeg = 45, pW = 18, pH = 18;
    for (let i = 0; i <= widthSeg; i++) {
        const x = (i / widthSeg - 0.5) * pW;
        for (let j = 0; j <= heightSeg; j++) {
            const z = (j / heightSeg - 0.5) * pH;
            const idx = (j * (widthSeg + 1) + i) * 3;
            const y1 = Math.sin(x * 0.9 + time) * Math.cos(z * 0.7 + time * 0.7) * 0.6;
            const y2 = Math.sin(x * 1.8 - time * 1.2) * 0.3;
            const y3 = Math.cos(z * 1.5 + time * 0.9) * 0.3;
            const y4 = Math.sin((x * 1.2 + z * 1.2) * 0.8 + time * 1.5) * 0.25;
            array[idx + 1] = y1 + y2 + y3 + y4;
        }
    }
    positionsAttr.needsUpdate = true; geometry.computeVertexNormals();
}

const backBtn = document.getElementById('backBtn'), btnInstall = document.getElementById('btnInstall'), fileInfoRow = document.getElementById('fileInfoRow'), fileNameShort = document.getElementById('fileNameShort'), fileToggleBtn = document.getElementById('fileToggleBtn'), fileFullInfo = document.getElementById('fileFullInfo');

let currentInstruction = null, isAnimating = false, currentFileName = '', currentFileSize = '', lastDescriptionText = null;
function truncateFileName(name, maxLen = 42) { return name.length <= maxLen ? name : name.substring(0, maxLen) + '...'; }
function updateFileDisplay() { if (!currentFileName) { fileInfoRow.style.display = 'none'; fileFullInfo.classList.remove('visible'); return; } fileInfoRow.style.display = 'flex'; fileNameShort.textContent = truncateFileName(currentFileName); fileFullInfo.textContent = `${currentFileName} (${currentFileSize})`; if (currentFileName.length <= 42) { fileToggleBtn.style.display = 'none'; } else { fileToggleBtn.style.display = 'inline-flex'; fileToggleBtn.querySelector('span').textContent = 'Подробнее'; fileFullInfo.classList.remove('visible'); } }

function resetDescriptionState() { descWrapper.style.maxHeight = 'none'; expandDescBtn.style.display = 'none'; expandDescBtn.dataset.expanded = 'false'; expandDescBtn.textContent = 'Развернуть'; }
function setupDescriptionExpand() { if (fullDesc.textContent === lastDescriptionText) return; lastDescriptionText = fullDesc.textContent; resetDescriptionState(); requestAnimationFrame(() => { const lineHeight = parseFloat(getComputedStyle(fullDesc).lineHeight); if (isNaN(lineHeight)) return; const maxHeight = lineHeight * 5; if (fullDesc.scrollHeight > maxHeight + 2) { descWrapper.style.maxHeight = maxHeight + 'px'; expandDescBtn.style.display = 'inline-block'; expandDescBtn.textContent = 'Развернуть'; expandDescBtn.dataset.expanded = 'false'; } else { descWrapper.style.maxHeight = 'none'; expandDescBtn.style.display = 'none'; } }); }

async function safeFetchJson(url) { try { const r = await fetch(url); return r.ok ? await r.json() : null; } catch { return null; } }
async function safeFetchText(url) { try { const r = await fetch(url); return r.ok ? await r.text() : null; } catch { return null; } }

async function loadScreenshots(base, imagesObj) { if (!imagesObj) return []; const urls = []; for (const key of Object.keys(imagesObj).sort((a,b)=>(parseInt(a.match(/\d+/)?.[0]||0)-parseInt(b.match(/\d+/)?.[0]||0)))) { const src = `${base}/${imagesObj[key]}`; const img = new Image(); await new Promise(resolve => { img.onload = () => resolve(true); img.onerror = () => resolve(false); img.src = src; }); if (img.complete && img.naturalWidth !== 0) urls.push(src); } return urls; }

function transitionToPlatform() { if (isAnimating) return; isAnimating = true; storeView.style.transition = 'opacity 0.5s ease, transform 0.5s ease, filter 0.5s'; storeView.style.opacity = '0'; storeView.style.transform = 'scale(0.97) translateY(20px)'; storeView.style.filter = 'blur(10px)'; setTimeout(() => { storeView.style.display = 'none'; storeView.classList.remove('visible'); platformScreen.style.display = 'flex'; platformScreen.style.opacity = '0'; platformScreen.style.transform = 'scale(0.98) translateY(-15px)'; platformScreen.style.transition = 'none'; void platformScreen.offsetHeight; platformScreen.style.transition = 'opacity 0.6s ease, transform 0.6s ease, filter 0.5s'; platformScreen.style.opacity = '1'; platformScreen.style.transform = 'scale(1) translateY(0)'; platformScreen.style.filter = 'blur(0px)'; platformScreen.classList.remove('hidden'); isAnimating = false; }, 500); }
async function updateUI() { if (!state.selectedOS) { if (!platformScreen.classList.contains('hidden')) return; transitionToPlatform(); return; }
const osData = appData[state.selectedOS]; appName.textContent = osData.title; appShortDesc.textContent = osData.shortDesc;

fullDesc.textContent = desc; permissionsList.innerHTML = osData.permissions.map(p => `<div class="permission-item"><i class="fas fa-lock"></i> ${p}</div>`).join('');
const version = currentInstruction?.version || '3.2.1'; let fileName = '';

if (!fileName) fileName = state.selectedOS === 'Windows' ? (state.selectedFormat === 'exe' ? `dynamic-browser-setup-${version}.exe` : `dynamic-browser-portable-${version}.zip`) : `dynamic-browser-${version}.apk`;
const size = osData.sizes[state.selectedFormat] || ''; currentFileName = fileName; currentFileSize = size;
if (state.selectedOS === 'Windows') { formatSelector.style.display = 'flex'; document.querySelectorAll('.format-chip').forEach(c => c.classList.remove('active')); document.querySelector(`.format-chip[data-format="${state.selectedFormat}"]`)?.classList.add('active'); installMeta.textContent = `v${version} · ${osData.sizes[state.selectedFormat]}`; } else { formatSelector.style.display = 'none'; state.selectedFormat = 'apk'; installMeta.textContent = `v${version} · ${osData.sizes.apk}`; }
updateFileDisplay(); const screenshots = await loadScreenshots(state.selectedOS, currentInstruction?.Images || null); renderScreenshots(screenshots);
